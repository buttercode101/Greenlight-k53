/* Start a full test (sequential sections) or a single section */
function startMock(onlySec,resume=null){
  practiceStartedAt=Date.now();
  if(!resume&&validAssessment(K.state.activeAssessment)&&!window.confirm('Start a new attempt and replace the unfinished one?'))return;
  assessmentActive=true;
  if(!resume){K.state.paperSeries=(K.state.paperSeries||0)+1;K.save();}
  const series=resume?resume.series:K.state.paperSeries;
  const sections = onlySec ? [onlySec] : SECTION_ORDER.slice();
  // Store results on K.state so finishMock/share handler can access
  if(!resume)K.state.mockResults = onlySec ? (K.state.mockResults || {}) : {};
  if(!resume)K.state.secPass = onlySec ? (K.state.secPass || {}) : {};
  if (!resume && onlySec) { delete K.state.mockResults[onlySec]; delete K.state.secPass[onlySec]; }
  const deadline = resume?resume.deadline:(mockSeconds?Date.now()+mockSeconds*1000:0);
  const timedMock = deadline>0;
  let si=0;
  function startSection(sec){
    const meta=SECTION_META[sec];
    const saved=resume&&resume.sec===sec?resume:null;resume=null;
    mockData=saved?saved.questions:buildSection(sec,series);
    const answers=saved?saved.answers:Array(mockData.length).fill(null);
    let i=saved?saved.i:0,correct=answers.filter((a,n)=>a!==null&&a===mockData[n].ans).length,answered=answers.filter(a=>a!==null).length,total=mockData.length;
    const checkpoint=()=>saveAssessment({mode:'mock',onlySec:onlySec||null,sec,series,deadline,i,questions:mockData,answers});
    checkpoint();
    function timerHTML(){
      if(!mockSeconds)return '';
      const m=String(Math.floor(mockSeconds/60)).padStart(2,'0'),s=String(mockSeconds%60).padStart(2,'0');
      return `<div class="timer no-print ${mockSeconds<=60?'warn':''}"><span class="ttl">Time left</span><span class="time">${m}:${s}</span></div>`;
    }
    if(deadline&&remainingSeconds(deadline)>0){
      mockSeconds=remainingSeconds(deadline);mockTimer=setInterval(()=>{mockSeconds=remainingSeconds(deadline);const t=document.querySelector('.timer .time');if(t)t.textContent=String(Math.floor(mockSeconds/60)).padStart(2,'0')+':'+String(mockSeconds%60).padStart(2,'0');if(mockSeconds<=60&&document.querySelector('.timer'))document.querySelector('.timer').classList.add('warn');if(mockSeconds<=0){clearInterval(mockTimer);mockTimer=null;finishSection(sec);}},250);
    }
    function render(){
      if(deadline&&remainingSeconds(deadline)===0){mockSeconds=0;finishSection(sec);return;}
      if(i>=total){finishSection(sec);return;}
      const q=mockData[i];
      const card=ce('div');card.className='block';
      let head=q.svg?`<div class="question-art">${q.svg}</div>`:'';
      card.innerHTML=`<p class="kicker">${meta.name} · Q${i+1} of ${total}</p>
        ${head}
        <h2 class="question-title">${safeHTML(q.q)}</h2>
        <div>${q.opts.map((o,idx)=>`<button class="opt" type="button" data-i="${idx}">${safeHTML(o)}</button>`).join('')}</div>
        <div class="feedback hidden" role="status" aria-live="polite"></div>
        ${bookmarkButton(q)}${evidence(q)}
        <button class="btn btn-primary next hidden">Next →</button>`;
      app.innerHTML=backbar(meta.name,`${i+1}/${total}`)+(mockSeconds?timerHTML():'');
      app.appendChild(card);
      const fb=card.querySelector('.feedback'),next=card.querySelector('.next');
      card.querySelectorAll('.opt').forEach(b=>{
        b.addEventListener('click',()=>{
          if(b.disabled)return;
          if(deadline&&remainingSeconds(deadline)===0){mockSeconds=0;finishSection(sec);return;}
          const ch=+b.getAttribute('data-i');
          card.querySelectorAll('.opt').forEach(x=>{x.disabled=true;x.classList.add('disabled');});
          answers[i]=ch;answered++;
          recordAttempt(q,ch===q.ans);if(ch===q.ans){b.classList.add('correct');correct++;fb.className='feedback ok';fb.textContent='Correct. '+q.ex;}
          else{b.classList.add('wrong');card.querySelectorAll('.opt')[q.ans].classList.add('correct');fb.className='feedback no';fb.textContent='Review this. '+q.ex;addReview(q);}
          checkpoint();renderAnswerTools(card,q);next.classList.remove('hidden');focusPracticeContent();
        });
      });
      if(answers[i]!==null){const ch=answers[i],ok=ch===q.ans;card.querySelectorAll('.opt').forEach((b,n)=>{b.disabled=true;if(n===q.ans)b.classList.add('correct');else if(n===ch)b.classList.add('wrong');});fb.className='feedback '+(ok?'ok':'no');fb.textContent=q.ex;next.classList.remove('hidden');focusPracticeContent();renderAnswerTools(card,q);}
      next.addEventListener('click',()=>{i++;checkpoint();render();window.scrollTo(0,0);});
      bindBookmark(card,q);bindGo();
    }
    function finishSection(sec){
      const meta=SECTION_META[sec];
      const need=meta.need;
      const passed=sectionPassed(correct,answered,total,need);
      K.state.mockResults[sec]={correct,total,answered,pass:passed,need,missed:mistakeKeys(mockData.filter((q,n)=>answers[n]!==null&&answers[n]!==q.ans))};
      K.state.secPass=K.state.secPass||{};
      K.state.secPass[sec]=passed;
      K.save();
      if(mockTimer){clearInterval(mockTimer);mockTimer=null;}
      const nextSec = onlySec ? null : SECTION_ORDER[SECTION_ORDER.indexOf(sec)+1];
      if(timedMock && mockSeconds<=0){ finishMock(onlySec); return; }
      if(nextSec){
        // Section break screen
        app.innerHTML=backbar('Section Complete')+`<div class="block center">
          <div class="badge-xl">${passed?'✅':'📚'}</div>
          <div class="result-title">${meta.name} done</div>
          <p class="result-sub">${correct}/${total} correct · ${answered} answered · needed ${need} · ${passed?'PASSED ✓':'NOT PASSED'}</p>
          <div class="stat-grid">
            <div class="stat"><div class="n">${correct}</div><div class="l">Correct</div></div>
            <div class="stat"><div class="n">${total-correct}</div><div class="l">Wrong</div></div>
            <div class="stat"><div class="n">${passed?'PASS':'RETRY'}</div><div class="l">Verdict</div></div>
          </div>
          <button class="btn btn-primary" id="nextSecBtn" type="button">Next: ${SECTION_META[nextSec].name} →</button>
          <button class="btn btn-ghost" data-go="mock">Quit to menu</button>
        </div>`;
        $('#nextSecBtn').addEventListener('click',()=>startSection(nextSec));
        bindGo();
      } else {
        finishMock(onlySec);
      }
    }
    render();
  }
  startSection(resume?resume.sec:sections[0]);
}

/* ---------- SHARE CARD (canvas-generated result image) ---------- */
function makeShareCard(secCorrect, secCount, totalCorrect, total, passed, scope='full'){
  const cvs=document.createElement('canvas');
  cvs.width=800; cvs.height=600;
  const ctx=cvs.getContext('2d');
  // Background
  const grad=ctx.createLinearGradient(0,0,0,600);
  grad.addColorStop(0,'#164c34'); grad.addColorStop(1,'#0b3020');
  ctx.fillStyle=grad; ctx.fillRect(0,0,800,600);
  // Accent stripe
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,800,6);
  // Title
  ctx.font='bold 34px Inter, Arial'; ctx.fillStyle='#fff'; ctx.textAlign='center';
  ctx.fillText('GreenLight K53 · Practice result', 400, 80);
  // Overall
  ctx.font='bold 72px Inter, Arial';
  ctx.fillStyle=passed?'#7bf0a2':'#ffb08a';
  ctx.fillText(totalCorrect + ' / ' + total, 400, 180);
  ctx.font='24px Inter, Arial'; ctx.fillStyle='#e8f5ff';
  ctx.fillText(scope==='section'?'Section practice':'Full practice mock', 400, 210);
  // Section bars
  const meta={'rules':'Rules','signs':'Signs','controls':'Controls'};
  const order=['rules','signs','controls'];
  const barW=500, barH=48, startX=150, startY=260, gap=60;
  order.forEach((s,idx)=>{
    const c=secCorrect[s]||0, t=secCount[s]||0, need=SECTION_META[s].need;
    const pct=t>0?c/t:0; const ok=t===SECTION_META[s].n&&c>=need;
    ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.beginPath(); ctx.roundRect(startX,startY+idx*gap,barW,barH,12); ctx.fill();
    ctx.fillStyle=ok?'rgba(21,128,61,0.6)':'rgba(176,69,0,0.6)'; if(t&&c){ctx.beginPath();ctx.roundRect(startX,startY+idx*gap,barW*pct,barH,12);ctx.fill();}
    ctx.font='bold 22px Inter, Arial'; ctx.fillStyle='#fff'; ctx.textAlign='left';
    ctx.fillText(meta[s], startX+20, startY+idx*gap+32);
    ctx.font='20px Inter, Arial'; ctx.fillStyle='#cfefff'; ctx.textAlign='right';
    ctx.fillText(t?c+'/'+t+' (need '+need+')':'Not taken', startX+barW-20, startY+idx*gap+32);
  });
  // Footer
  ctx.font='18px Inter, Arial'; ctx.fillStyle='#cfefff'; ctx.textAlign='center';
  const msg = scope==='section' ? (passed?'Section practice passed':'Keep practising this section') : (passed?'All sections passed in practice':'Working on my weak sections');
  ctx.fillText(msg, 400, 530);
  ctx.font='15px Inter, Arial';ctx.fillStyle='#deecdf';ctx.fillText('greenlight-k53-review.vercel.app · Practice, not a pass guarantee',400,570);
  return cvs.toDataURL('image/png');
}

function mockDecisionFollowup(results){if(K.state.vehicleCode!=='2')return '';const entries=Object.entries(results).filter(([topic,r])=>['signs','rules','controls'].includes(topic)&&r&&r.total>0).sort((a,b)=>a[1].correct/a[1].total-b[1].correct/b[1].total);if(!entries.length)return '';const topic=entries[0][0],label={signs:'sign',rules:'road-rule',controls:'control'}[topic];return `<button class="btn btn-soft" data-practice-mode="${topic}">Practise ${label} decisions from your weakest section</button>`;}

function finishMock(onlySec){
  assessmentActive=false;clearAssessment();
  const sections = onlySec ? [onlySec] : SECTION_ORDER;
  let allPass=true, totalCorrect=0, totalQ=0;
  sections.forEach(s=>{const r=K.state.secPass&&K.state.secPass[s];if(!r)allPass=false;});
  // Build summary
  const rows=sections.map(s=>{
    const p=K.state.secPass&&K.state.secPass[s];
    const m=SECTION_META[s];
    const result=K.state.mockResults?.[s];
    return `<tr><td>${m.name}</td><td>${!result?'NOT TAKEN':`${result.correct}/${result.total} · ${result.answered ?? result.total} answered · ${p?'<span style="color:var(--ok);font-weight:700">PASSED</span>':'<span style="color:var(--err);font-weight:700">NOT PASSED</span>'}`}</td><td>${m.need}/${m.n}</td></tr>`;
  }).join('');
  const overallPass = onlySec ? (K.state.secPass&&K.state.secPass[onlySec]) : allPass;
  const attempted=sections.map(s=>K.state.mockResults?.[s]).filter(Boolean);
  const attemptedCorrect=attempted.reduce((sum,r)=>sum+r.correct,0);
  const attemptedTotal=attempted.reduce((sum,r)=>sum+r.total,0);
  recordOutcome('learning-mock'+(onlySec?'-'+onlySec:''),attemptedCorrect,attemptedTotal);
  if(!onlySec)K.state.mockPass=overallPass;
  K.state.mastery=K.state.mastery||{};
  const resultMap={rules:2,signs:1,controls:3};
  sections.forEach(sec=>{const result=(K.state.mockResults||{})[sec];if(result&&result.total){K.state.mastery[resultMap[sec]]=Math.round(result.correct/result.total*100);}});
  const allResults=Object.values(K.state.mockResults||{});
  const totalSeen=allResults.reduce((sum,item)=>sum+(item.total||0),0);
  const correctSeen=allResults.reduce((sum,item)=>sum+(item.correct||0),0);
  if(totalSeen)K.state.acc={correct:correctSeen,total:totalSeen};
  K.save();
  const missed=[...new Set(sections.flatMap(sec=>K.state.mockResults?.[sec]?.missed||[]))];
  app.innerHTML=backbar('Mock Result')+`<div class="block center">
    <div class="badge-xl">${overallPass?'🏆':'📚'}</div>
    <div class="result-title" role="status">${overallPass?(onlySec?'Section practice passed':'Practice test passed'):'Review your sections'}</div>
    <p class="result-sub">${onlySec?'Section result':'You must pass ALL three sections'}</p>
    <p class="result-sub"><strong>${attemptedCorrect}/${attemptedTotal}</strong> correct${onlySec?' in this section':' across the mock'}</p>
    <table class="span-table" style="margin:var(--s4) 0"><thead><tr><th>Section</th><th>Result</th><th>Pass mark</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="footnote" style="margin-bottom:var(--s4)">This practice paper: Rules ${SECTION_META.rules.need}/${SECTION_META.rules.n} · Signs ${SECTION_META.signs.need}/${SECTION_META.signs.n} · Controls ${SECTION_META.controls.need}/${SECTION_META.controls.n}. You must reach each on its own.</p>
    ${overallPass?'<p>You passed this practice test. Review the official material before booking.</p>':'<p>Review the sections you missed, then try again.</p>'}
    ${retryMissedButton(missed)}${!missed.length&&K.state.review.length?`<button class="btn btn-soft" id="revBtn">Review my weak spots (${K.state.review.length})</button>`:''}
    ${mockDecisionFollowup(K.state.mockResults||{})}
    <button class="btn btn-ghost" id="shareBtn" type="button">📤 Share Result</button>
    <button class="btn btn-ghost" data-go="mock">Retake mock</button>
    <button class="btn btn-ghost" data-go="home">Home</button>
  </div>`;
  bindMissed(missed);if($('#revBtn'))$('#revBtn').addEventListener('click',openReview);
  if($('#shareBtn'))$('#shareBtn').addEventListener('click',()=>{
    const r = K.state.mockResults || {};
    const secCorrect={}, secCount={};
    SECTION_ORDER.forEach(s=>{const item=onlySec&&s!==onlySec?null:r[s];secCorrect[s]=item?.correct||0;secCount[s]=item?.total||0;});
    const totalCorrect = sections.reduce((sum,s)=>sum+(r[s]?.correct||0), 0);
    const totalQ = sections.reduce((sum,s)=>sum+(r[s]?.total||0), 0);
    const dataUrl=makeShareCard(secCorrect, secCount, totalCorrect, totalQ, overallPass, onlySec?'section':'full');
    saveResultImage(dataUrl,'k53-result.png');
  });
  if(overallPass)confetti();
  bindGo();
}

function openSim(){
  currentArea='tests';

    <div class="badge-xl">⚡</div>
    <div class="result-title" style="font-size:24px">Test-Day Simulation</div>
    <p class="result-sub">Code ${K.state.vehicleCode}: practice paper ${((K.state.paperSeries||0)%3)+1} of 3 from our study pool. Full 64 questions, mixed order, no section breaks. The complete official manuals remain essential.<br>60-minute timer — the DLTC test may not exceed 1 hour.</p>
    <button class="btn btn-primary" id="simGo" type="button">Start with 60:00 timer</button>
    <button class="btn btn-ghost" id="simNoTime" type="button">Start without a timer</button>
    <button class="btn btn-ghost" data-go="home">Home</button>
  </div>`;
  const go=async(t)=>{try{await loadDecisionModule();}catch{}if(mockTimer){clearInterval(mockTimer);mockTimer=null;}mockSeconds=t;startSim();};
  $('#simGo').addEventListener('click',()=>go(60*60));
  $('#simNoTime').addEventListener('click',()=>go(0));

function startSim(resume=null){
  practiceStartedAt=Date.now();
  if(!resume&&validAssessment(K.state.activeAssessment)&&!window.confirm('Start a new attempt and replace the unfinished one?'))return;
  assessmentActive=true;
  const deadline = resume?resume.deadline:(mockSeconds ? Date.now() + mockSeconds * 1000 : 0);
  if(!resume){K.state.paperSeries=(K.state.paperSeries||0)+1;K.save();}
  const series=K.state.paperSeries;
  // Build full pool (all sections) and shuffle into 64 questions (28+28+8)
  let pool=[];
  K.rulesForCode(K.state.vehicleCode).forEach(r=>{const opts=K.shuffle([r.a,...K.ruleWrongs(r)]);pool.push({q:r.q,opts,ans:opts.indexOf(r.a),ex:r.a,sec:'Rules'});});
  K.extraForCode(K.state.vehicleCode).forEach(e=>{const so=K.shufOpts(e.opts,e.ans);pool.push({q:e.q,opts:so.opts,ans:so.ans,ex:e.ex,sec:'Rules'});});
  K.SIGNS.forEach(s=>pool.push({...K.signQuestion(s),sec:'Signs'}));
  K.MARKINGS.forEach(mk=>{const wrong=K.shuffle(K.MARKINGS.filter(x=>x!==mk).map(x=>x.d)).slice(0,3);const opts=K.shuffle([mk.d,...wrong]);pool.push({q:mk.t+' — what does it mean?',opts,ans:opts.indexOf(mk.d),ex:mk.tip,sec:'Signs'});});
  K.SIGN_VARIANTS.forEach(s=>{const so=K.shufOpts(s.opts,s.ans);pool.push({q:s.q,opts:so.opts,ans:so.ans,ex:s.ex,sec:'Signs'});});
  K.controlsForCode(K.state.vehicleCode).forEach(c=>{const so=K.shufOpts(c.opts,c.ans);pool.push({q:c.q,opts:so.opts,ans:so.ans,ex:c.ex,sec:'Controls'});});
  K.CONTROL_VARIANTS.forEach(c=>{const so=K.shufOpts(c.opts,c.ans);pool.push({q:c.q,opts:so.opts,ans:so.ans,ex:c.ex,sec:'Controls'});});
  if(K.decisionQuestions)for(const [topic,label] of Object.entries({signs:'Signs',rules:'Rules',controls:'Controls'}))pool.push(...K.decisionQuestions(topic).map(q=>({...q,sec:label})));
  // Retain the 64-question practice structure and original section pass targets.
  const rulesPool = pool.filter(q=>q.sec==='Rules');
  const signsPool = pool.filter(q=>q.sec==='Signs');
  const ctrlPool = pool.filter(q=>q.sec==='Controls');
  mockData=K.shuffle([
    ...K.selectPaper(rulesPool,28,series),
    ...K.selectPaper(signsPool,28,series),
    ...K.selectPaper(ctrlPool,8,series)
  ]);
  if(resume)mockData=resume.questions;
  const answers=resume?resume.answers:Array(mockData.length).fill(null);
  let i=resume?resume.i:0,correct=0,total=mockData.length;
  const secCount={rules:0,signs:0,controls:0}, secCorrect={rules:0,signs:0,controls:0};
  answers.forEach((a,n)=>{if(a!==null){const q=mockData[n],sec=q.sec.toLowerCase();secCount[sec]++;if(a===q.ans){correct++;secCorrect[sec]++;}}});
  const checkpoint=()=>saveAssessment({mode:'sim',deadline,i,questions:mockData,answers});
  checkpoint();
  function timerHTML(){
    if(!mockSeconds)return '';
    const m=String(Math.floor(mockSeconds/60)).padStart(2,'0'),s=String(mockSeconds%60).padStart(2,'0');
    return `<div class="timer no-print ${mockSeconds<=60?'warn':''}"><span class="ttl">Time left</span><span class="time">${m}:${s}</span></div>`;
  }
  if(deadline&&remainingSeconds(deadline)>0){
    mockSeconds=remainingSeconds(deadline);mockTimer=setInterval(()=>{mockSeconds=remainingSeconds(deadline);const t=document.querySelector('.timer .time');if(t)t.textContent=String(Math.floor(mockSeconds/60)).padStart(2,'0')+':'+String(mockSeconds%60).padStart(2,'0');if(mockSeconds<=60&&document.querySelector('.timer'))document.querySelector('.timer').classList.add('warn');if(mockSeconds<=0){clearInterval(mockTimer);mockTimer=null;finishSim();}},250);
  }
  function render(){
    if(deadline&&remainingSeconds(deadline)===0){finishSim();return;}
    if(i>=total){if(mockTimer){clearInterval(mockTimer);mockTimer=null;}finishSim();return;}
    const q=mockData[i];
    const card=ce('div');card.className='block';
    let head=q.svg?`<div class="question-art">${q.svg}</div>`:'';
    card.innerHTML=`<p class="kicker">Q${i+1} of ${total}</p>
      ${head}
      <h2 class="question-title">${safeHTML(q.q)}</h2>
      <div>${q.opts.map((o,idx)=>`<button class="opt" type="button" data-i="${idx}">${safeHTML(o)}</button>`).join('')}</div>
      <div class="feedback hidden" role="status" aria-live="polite"></div>
      ${bookmarkButton(q)}${evidence(q)}
      <button class="btn btn-primary next hidden">Next →</button>`;
    app.innerHTML=backbar('Test-Day Sim',`${i+1}/${total}`)+(mockSeconds?timerHTML():'');
    app.appendChild(card);
    const fb=card.querySelector('.feedback'),next=card.querySelector('.next');
    card.querySelectorAll('.opt').forEach(b=>{
      b.addEventListener('click',()=>{
        const ch=+b.getAttribute('data-i');
        if (b.disabled) return;
        if(deadline&&remainingSeconds(deadline)===0){finishSim();return;}
        card.querySelectorAll('.opt').forEach(x=>{x.disabled=true;x.classList.add('disabled');});
        answers[i]=ch;secCount[q.sec.toLowerCase()]++;
        recordAttempt(q,ch===q.ans);if(ch===q.ans){correct++;secCorrect[q.sec.toLowerCase()]++;}
        else{addReview(q);}
        fb.className='feedback';fb.textContent='Answer recorded. Your results appear at the end of the simulation.';
        checkpoint();next.classList.remove('hidden');focusPracticeContent();
      });
    });
    if(answers[i]!==null){card.querySelectorAll('.opt').forEach(b=>b.disabled=true);fb.className='feedback';fb.textContent='Answer recorded. Your results appear at the end of the simulation.';next.classList.remove('hidden');focusPracticeContent();}
    next.addEventListener('click',()=>{i++;checkpoint();render();window.scrollTo(0,0);});
    bindBookmark(card,q);bindGo();
  }
  function finishSim(){
    assessmentActive=false;clearAssessment();
    const missed=mistakeKeys(mockData.filter((q,n)=>answers[n]!==null&&answers[n]!==q.ans));
    const rows=SECTION_ORDER.map(s=>{const m=SECTION_META[s];const c=secCorrect[s],t=secCount[s];const need=m.need;const passed=t===m.n&&c>=need;return `<tr><td>${m.name}</td><td>${c+'/'+m.n} (${t} answered)</td><td>${passed?'<span style="color:var(--ok);font-weight:700">PASSED</span>':'<span style="color:var(--err);font-weight:700">NOT PASSED</span>'}</td><td>${need}</td></tr>`;}).join('');
    const allPass=SECTION_ORDER.every(s=>secCount[s]===SECTION_META[s].n&&secCorrect[s]>=SECTION_META[s].need);
    recordOutcome('timed-simulation',correct,total);
    K.state.shareData={secCorrect,secCount,correct,total,passed:allPass};
    K.state.mockPass=allPass;
    K.state.secPass=K.state.secPass||{};
    K.state.mastery=K.state.mastery||{};
    const simMap={rules:2,signs:1,controls:3};
    SECTION_ORDER.forEach(s=>{K.state.secPass[s]=secCount[s]===SECTION_META[s].n&&secCorrect[s]>=SECTION_META[s].need; if(secCount[s]===SECTION_META[s].n)K.state.mastery[simMap[s]]=Math.round(secCorrect[s]/secCount[s]*100);});
    K.state.acc={correct,total};
    K.save();
    app.innerHTML=backbar('Sim Result')+`<div class="block center">
      <div class="badge-xl">${allPass?'🏆':'📚'}</div>
      <div class="result-title" role="status">${allPass?'Practice test passed':'Check your sections'}</div>
      <p class="result-sub">${correct}/${total} overall · you must pass each section</p>
      <table class="span-table" style="margin:var(--s4) 0"><thead><tr><th>Section</th><th>Your score</th><th>Result</th><th>Pass</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="footnote" style="margin-bottom:var(--s4)">This simulation: pass EACH section — Rules ${SECTION_META.rules.need}/${SECTION_META.rules.n} · Signs ${SECTION_META.signs.need}/${SECTION_META.signs.n} · Controls ${SECTION_META.controls.need}/${SECTION_META.controls.n}.</p>
      ${allPass?'<p>You passed this practice simulation. Review the official material before booking your test.</p>':'<p>Review the sections you missed, then try again.</p>'}
      ${retryMissedButton(missed)}${!missed.length&&K.state.review.length?`<button class="btn btn-soft" id="revBtn">Review weak spots (${K.state.review.length})</button>`:''}
      ${mockDecisionFollowup(Object.fromEntries(SECTION_ORDER.map(s=>[s,{correct:secCorrect[s],total:secCount[s]}])))}
      <button class="btn btn-ghost" id="shareBtn" type="button">📤 Share Result</button>
      <button class="btn btn-ghost" data-go="sim">Retry sim</button>
      <button class="btn btn-ghost" data-go="home">Home</button>
    </div>`;
      bindMissed(missed);if($('#revBtn'))$('#revBtn').addEventListener('click',openReview);
  if($('#shareBtn'))$('#shareBtn').addEventListener('click',()=>{
    const d=K.state.shareData;
    if(!d)return;
    const dataUrl=makeShareCard(d.secCorrect, d.secCount, d.correct, d.total, d.passed);
    saveResultImage(dataUrl,'k53-sim-result.png');
  });
  if(allPass)confetti();
  bindGo();
}
  render();
}

/* ---------- PWA INSTALL PROMPT ---------- */
let deferredPrompt=null;
let installDismissed=false;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone=(window.matchMedia&&(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true));
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault(); deferredPrompt=e;
});
window.addEventListener('appinstalled',()=>{ deferredPrompt=null; installDismissed=true; removeInstallBanner(); });
function installPromptHTML(){
  const canPrompt=!isIOS && !!deferredPrompt;
  const label=isIOS?'Get GreenLight on your Home Screen':(canPrompt?'Install GreenLight K53':'Add GreenLight to your phone');
  const sub=isIOS?'Works offline after adding to Home Screen.':'Free study aid · works offline after installation.';
  const icon = '<span class="pwa-icon" aria-hidden="true"><img src="icon.svg" alt="" width="24" height="24"></span>';
  const close = '<button class="pwa-close" id="pwaClose" type="button" aria-label="Dismiss install prompt">✕</button>';
  const btn = canPrompt
    ? '<button class="pwa-install" id="pwaInstall" type="button">Install</button>'
    : '<button class="pwa-install pwa-install-subtle" id="pwaInstall" type="button">How to install</button>';
  return `<div class="pwa-card">
      ${close}
      ${icon}
      <div class="pwa-body">
        <div class="pwa-title">${label}</div>
        <div class="pwa-sub">${sub}</div>
      </div>
      ${btn}
    </div>`;
}
function removeInstallBanner(){ const el=document.getElementById('installBanner'); if(el)el.remove(); }
function maybeShowInstall(){
  if(installDismissed||isStandalone)return;
  if(document.getElementById('installBanner'))return;
  // If we have no real prompt and it's not iOS, still allow an honest "how to install" banner.
  const banner=document.createElement('div');
  banner.id='installBanner'; banner.className='no-print';
  banner.setAttribute('role','dialog'); banner.setAttribute('aria-label','Install GreenLight K53');
  banner.innerHTML=installPromptHTML();
  if(!document.getElementById('app')){ if(app) app.insertBefore(banner, app.firstChild); return; }
  app.insertBefore(banner, app.firstChild);
  requestAnimationFrame(()=>banner.classList.add('pwa-in'));
  const i=document.getElementById('pwaInstall'); const d=document.getElementById('pwaClose');
  if(i)i.addEventListener('click',async()=>{
    const canPrompt=!isIOS && !!deferredPrompt;
    if(!canPrompt){
      // No native prompt (iOS or browser hasn't offered): show honest guidance, no dead button
      i.textContent='Done';
      const b=banner.querySelector('.pwa-sub');
      b.textContent=isIOS
        ?'In Safari: tap Share (square with ↑) → “Add to Home Screen” → “Add”. Open it from your Home Screen to use it offline.'
        :'In your browser: tap the ⋮/Share menu → “Install app” or “Add to Home Screen”. It then works offline like an app.';
      b.classList.add('pwa-warn');
      return;
    }
    banner.classList.remove('pwa-in');
    deferredPrompt.prompt();
    try{ await deferredPrompt.userChoice; }catch(e){}
    deferredPrompt=null; installDismissed=true;
    removeInstallBanner();
  });
  if(d)d.addEventListener('click',()=>{ banner.classList.remove('pwa-in'); installDismissed=true; deferredPrompt=null; setTimeout(removeInstallBanner,180); });
}

/* PWA: one install/update flow for every study tool. */
if ('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')) {
  navigator.serviceWorker.ready.then(()=>{window.__offlineReady=true;syncConnectivity();});
  let waitingWorker=null,applyRequested=false,dismissed=false;
  const busy=()=>assessmentActive||decisionModule?.isActive()||!!app.querySelector('.opt');
  function showAppUpdate(){
    if(!waitingWorker||dismissed)return;
    let notice=document.getElementById('swToast');
    if(busy()){if(notice)notice.hidden=true;return;}
    if(!notice){notice=ce('div');notice.id='swToast';notice.className='app-update no-print';notice.setAttribute('role','status');notice.innerHTML='<span id="updateCopy"></span><button id="swReload" type="button">Update app</button><button id="swClose" type="button" aria-label="Dismiss update message">×</button>';document.body.append(notice);notice.querySelector('#swClose').onclick=()=>{dismissed=true;notice.remove();};notice.querySelector('#swReload').onclick=()=>{if(busy())return;applyRequested=true;waitingWorker.postMessage({type:'SKIP_WAITING'});};}
    notice.hidden=false;const anchor=app.querySelector('.app-header');if(anchor)anchor.after(notice);
    notice.querySelector('#swReload').disabled=false;
    notice.querySelector('#updateCopy').textContent=busy()?'An update is ready. Finish or leave this exercise to apply it.':'An update is ready. Saved study progress will be kept.';
  }
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>{
      function check(){if(reg.waiting&&navigator.serviceWorker.controller){waitingWorker=reg.waiting;showAppUpdate();}}
      check();reg.addEventListener('updatefound',()=>{reg.installing?.addEventListener('statechange',check);});
      if(navigator.onLine)void reg.update().catch(()=>{});
    }).catch(()=>{});
  });
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(applyRequested)location.reload();});
  setInterval(showAppUpdate,1000);
}
