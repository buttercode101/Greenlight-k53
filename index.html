<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1720" />
    <meta
      name="description"
      content="Greenlight K53 premium South African learner's licence prep with road signs, rules, controls and mock test practice."
    />
    <title>Greenlight K53 | Premium Learner's Licence Prep</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f5f3ef;
        --bg-alt: #efeae1;
        --panel: rgba(255, 255, 255, 0.7);
        --panel-strong: #ffffff;
        --ink: #111827;
        --ink-soft: #4b5563;
        --ink-faint: #7a8694;
        --line: rgba(17, 24, 39, 0.09);
        --line-strong: rgba(17, 24, 39, 0.15);
        --accent: #17a85f;
        --accent-strong: #12864b;
        --accent-soft: #eafaf1;
        --warning: #f4ba4f;
        --warning-soft: #fff6dd;
        --danger: #d64a4a;
        --danger-soft: #ffeaea;
        --shadow: 0 18px 38px rgba(17, 24, 39, 0.08), 0 4px 12px rgba(17, 24, 39, 0.04);
        --radius-xl: 30px;
        --radius-lg: 24px;
        --radius-md: 18px;
        --radius-sm: 14px;
        --container: 1180px;
      }

      * { box-sizing: border-box; }

      html { scroll-behavior: smooth; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(23, 168, 95, 0.12), transparent 28%),
          linear-gradient(180deg, #f5f3ef 0%, #fefcf9 100%);
        color: var(--ink);
      }

      a { color: inherit; text-decoration: none; }
      button { font: inherit; }

      .app-shell {
        width: min(var(--container), calc(100% - 32px));
        margin: 24px auto 64px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid var(--line);
        backdrop-filter: blur(16px);
        border-radius: 18px;
        padding: 14px 18px;
        position: sticky;
        top: 16px;
        z-index: 20;
        box-shadow: var(--shadow);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #17a85f 0%, #0d7743 100%);
        color: white;
        font-weight: 900;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
      }

      .brand-copy { line-height: 1.1; }
      .brand-copy strong { display: block; font-size: 0.98rem; }
      .brand-copy span {
        display: block;
        color: var(--ink-soft);
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .nav-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .chip {
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.58);
        color: var(--ink-soft);
        border-radius: 999px;
        padding: 9px 12px;
        font-size: 0.76rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .chip:hover {
        border-color: rgba(23, 168, 95, 0.4);
        color: var(--accent-strong);
      }

      .chip.primary {
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
        color: white;
        border-color: transparent;
        box-shadow: 0 12px 18px rgba(23, 168, 95, 0.18);
      }

      .page { margin-top: 24px; }

      .hero {
        display: grid;
        grid-template-columns: 1.35fr 0.85fr;
        gap: 24px;
        padding: 26px;
        background: linear-gradient(135deg, rgba(255,255,255,0.7), rgba(234,250,241,0.8));
        border: 1px solid var(--line);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        background: rgba(23, 168, 95, 0.1);
        border: 1px solid rgba(23, 168, 95, 0.16);
        color: var(--accent-strong);
        padding: 8px 12px;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .hero-copy h1 {
        margin: 18px 0 14px;
        max-width: 640px;
        font-size: clamp(2.8rem, 6vw, 5.2rem);
        line-height: 0.95;
        letter-spacing: -0.07em;
      }

      .hero-copy p {
        margin: 0;
        max-width: 620px;
        color: var(--ink-soft);
        font-size: 1.08rem;
        line-height: 1.72;
      }

      .cta-row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 24px;
      }

      .cta {
        border: none;
        border-radius: 16px;
        padding: 14px 20px;
        font-weight: 700;
        font-size: 0.96rem;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .cta:hover { transform: translateY(-1px); }

      .cta.primary {
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
        color: white;
        box-shadow: 0 14px 18px rgba(23,168,95,0.18);
      }

      .cta.secondary {
        background: white;
        color: var(--ink);
        border: 1px solid var(--line);
      }

      .hero-stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(112px, 1fr));
        gap: 10px;
        margin-top: 28px;
      }

      .stat-pill {
        background: rgba(255,255,255,0.62);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 12px 10px;
      }

      .stat-pill strong {
        display: block;
        font-size: 1.36rem;
        letter-spacing: -0.06em;
      }

      .stat-pill span {
        display: block;
        margin-top: 4px;
        color: var(--ink-soft);
        font-size: 0.72rem;
      }

      .hero-visual {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .card-scene {
        width: min(100%, 420px);
        min-height: 420px;
        background: linear-gradient(180deg, #edf8f2 0%, #eef3f5 100%);
        border-radius: 30px;
        border: 1px solid var(--line);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), var(--shadow);
        position: relative;
        overflow: hidden;
      }

      .scene-top {
        position: absolute;
        inset: 0 0 auto 0;
        height: 120px;
        background: linear-gradient(180deg, rgba(23,168,95,0.14), rgba(23,168,95,0));
      }

      .route-badge {
        position: absolute;
        top: 26px;
        right: 24px;
        background: rgba(17,24,39,0.96);
        color: white;
        border-radius: 18px;
        padding: 10px 12px;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        box-shadow: 0 18px 34px rgba(17,24,39,0.18);
      }

      .signal-ring {
        position: absolute;
        left: 50%;
        top: 40%;
        transform: translate(-50%, -50%);
        width: 170px;
        height: 170px;
        border-radius: 50%;
        border: 1px solid rgba(23,168,95,0.25);
        background: radial-gradient(circle at center, rgba(23,168,95,0.12), rgba(23,168,95,0.03) 60%, transparent 70%);
      }

      .signal-ring::before,
      .signal-ring::after {
        content: "";
        position: absolute;
        inset: 10px;
        border-radius: 50%;
        border: 1px solid rgba(17,24,39,0.08);
      }

      .signal-ring::after { inset: 28px; background: linear-gradient(135deg, rgba(23,168,95,0.08), rgba(255,255,255,0.9)); }

      .signal-visual {
        position: absolute;
        left: 50%;
        top: 38%;
        transform: translate(-50%, -50%);
        width: 120px;
        height: 120px;
        border-radius: 32px;
        background: linear-gradient(135deg, rgba(17,24,39,0.98), rgba(48,58,66,0.98));
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 800;
        letter-spacing: 0.1em;
        box-shadow: 0 20px 38px rgba(17,24,39,0.12);
      }

      .road-panel {
        position: absolute;
        left: 24px;
        right: 24px;
        bottom: 24px;
        padding: 24px 18px 18px;
        border-radius: 22px;
        background: rgba(255,255,255,0.76);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }

      .road-mini {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      .mini-card {
        padding: 12px 10px;
        background: rgba(17,24,39,0.03);
        border: 1px solid var(--line);
        border-radius: 16px;
        text-align: center;
      }

      .mini-card strong {
        display: block;
        font-size: 1.2rem;
        letter-spacing: -0.05em;
      }

      .mini-card span {
        display: block;
        margin-top: 6px;
        color: var(--ink-soft);
        font-size: 0.72rem;
      }

      .nav-panel {
        margin-top: 22px;
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding-bottom: 6px;
      }

      .nav-pill {
        background: rgba(255,255,255,0.58);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 16px;
        min-width: 148px;
        font-weight: 600;
        color: var(--ink-soft);
        cursor: pointer;
        transition: 0.2s ease;
      }

      .nav-pill.active {
        background: linear-gradient(135deg, rgba(23,168,95,0.14), rgba(23,168,95,0.05));
        border-color: rgba(23,168,95,0.25);
        color: var(--accent-strong);
      }

      .main-area {
        margin-top: 26px;
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 22px;
      }

      .panel {
        background: rgba(255,255,255,0.7);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: var(--shadow);
      }

      .content-panel { padding: 22px; }

      .content-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }

      .content-header h2 {
        margin: 0;
        font-size: clamp(1.55rem, 2vw, 2.25rem);
        letter-spacing: -0.06em;
      }

      .soft-tag {
        padding: 8px 10px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent-strong);
        border: 1px solid rgba(23,168,95,0.12);
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0,1fr));
        gap: 14px;
      }

      .summary-card {
        background: linear-gradient(180deg, rgba(17,24,39,0.015), rgba(23,168,95,0.02));
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px 16px;
      }

      .summary-card strong {
        display: block;
        font-size: 2rem;
        letter-spacing: -0.06em;
        margin-bottom: 6px;
      }

      .summary-card span {
        color: var(--ink-soft);
        font-size: 0.8rem;
      }

      .feature-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0,1fr));
        gap: 16px;
        margin-top: 20px;
      }

      .feature-card {
        padding: 16px;
        background: rgba(255,255,255,0.72);
        border: 1px solid var(--line);
        border-radius: 18px;
      }

      .feature-icon {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: linear-gradient(135deg, rgba(23,168,95,0.15), rgba(23,168,95,0.05));
        display: grid;
        place-items: center;
        color: var(--accent-strong);
        font-size: 1.1rem;
        margin-bottom: 14px;
      }

      .feature-card h3 {
        margin: 0 0 8px;
        font-size: 1.08rem;
      }

      .feature-card p {
        margin: 0;
        color: var(--ink-soft);
        font-size: 0.92rem;
        line-height: 1.6;
      }

      .module-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0,1fr));
        gap: 18px;
        margin-top: 20px;
      }

      .module-card {
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: linear-gradient(180deg, rgba(255,255,255,0.75), rgba(244,247,240,0.88));
        cursor: pointer;
        transition: transform 0.2s ease, border-color 0.2s ease;
      }

      .module-card:hover {
        transform: translateY(-2px);
        border-color: rgba(23,168,95,0.3);
      }

      .module-card .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .module-icon {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, rgba(23,168,95,0.12), rgba(23,168,95,0.05));
        color: var(--accent-strong);
        font-size: 1.2rem;
      }

      .module-card h3 {
        margin: 0 0 8px;
        font-size: 1.15rem;
      }

      .module-card p {
        margin: 0;
        color: var(--ink-soft);
        line-height: 1.6;
      }

      .module-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 14px;
        color: var(--ink-soft);
        font-size: 0.75rem;
        font-weight: 600;
      }

      .progress-ring {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: conic-gradient(var(--accent) 0 68%, rgba(17,24,39,0.06) 68% 100%);
        display: grid;
        place-items: center;
        position: relative;
      }

      .progress-ring::before {
        content: "";
        position: absolute;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: white;
      }

      .progress-ring span {
        position: relative;
        z-index: 1;
        font-weight: 800;
        font-size: 0.8rem;
      }

      .side-panel {
        padding: 20px;
      }

      .side-panel h3 {
        margin: 0 0 16px;
        font-size: 1.2rem;
        letter-spacing: -0.04em;
      }

      .checklist {
        display: grid;
        gap: 12px;
      }

      .check-item {
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(17,24,39,0.02);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 12px 14px;
      }

      .check-bullet {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(23,168,95,0.12);
        color: var(--accent-strong);
        font-weight: 800;
      }

      .check-item strong {
        display: block;
        font-size: 0.94rem;
      }

      .check-item span {
        display: block;
        color: var(--ink-soft);
        font-size: 0.75rem;
      }

      .mini-cta {
        margin-top: 18px;
        width: 100%;
        border: none;
        border-radius: 16px;
        background: linear-gradient(135deg, #111827, #253443);
        color: white;
        padding: 14px 16px;
        font-weight: 700;
        cursor: pointer;
      }

      .study-card {
        margin-top: 18px;
        background: linear-gradient(135deg, rgba(23,168,95,0.12), rgba(255,255,255,0.8));
        border: 1px solid rgba(23,168,95,0.15);
        border-radius: 18px;
        padding: 18px;
      }

      .study-card h4 {
        margin: 0 0 12px;
        font-size: 1rem;
      }

      .study-card ul {
        margin: 0;
        padding-left: 18px;
        color: var(--ink-soft);
        line-height: 1.7;
      }

      .quiz-shell {
        display: grid;
        gap: 18px;
      }

      .quiz-card {
        background: rgba(255,255,255,0.84);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 22px;
      }

      .question-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
        color: var(--ink-soft);
        font-size: 0.82rem;
        font-weight: 600;
      }

      .question-block {
        display: grid;
        gap: 18px;
      }

      .question-block h3 {
        margin: 0;
        font-size: clamp(1.38rem, 2vw, 2.1rem);
        line-height: 1.4;
        letter-spacing: -0.05em;
      }

      .answer-list {
        display: grid;
        gap: 12px;
      }

      .answer {
        width: 100%;
        padding: 14px 16px;
        border-radius: 16px;
        text-align: left;
        background: rgba(17,24,39,0.02);
        border: 1px solid var(--line);
        color: var(--ink);
        cursor: pointer;
        transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      }

      .answer:hover {
        transform: translateY(-1px);
        border-color: rgba(23,168,95,0.28);
      }

      .answer.correct {
        background: rgba(23,168,95,0.08);
        border-color: rgba(23,168,95,0.45);
        color: var(--accent-strong);
      }

      .answer.wrong {
        background: rgba(214,74,74,0.06);
        border-color: rgba(214,74,74,0.35);
        color: var(--danger);
      }

      .explanation {
        margin-top: 8px;
        border-radius: 16px;
        padding: 14px 16px;
        background: rgba(23,168,95,0.06);
        border: 1px solid rgba(23,168,95,0.12);
        color: var(--ink-soft);
        line-height: 1.6;
      }

      .quiz-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 18px;
      }

      .ghost {
        background: rgba(17,24,39,0.03);
        border: 1px solid var(--line);
        border-radius: 14px;
        color: var(--ink);
        padding: 12px 16px;
        font-weight: 700;
        cursor: pointer;
      }

      .result-box {
        padding: 22px;
        border-radius: 22px;
        background: linear-gradient(135deg, rgba(23,168,95,0.12), rgba(255,255,255,0.9));
        border: 1px solid rgba(23,168,95,0.15);
      }

      .result-box h3 {
        margin: 0 0 8px;
        font-size: clamp(1.8rem, 3vw, 2.8rem);
        letter-spacing: -0.06em;
      }

      .result-box p {
        margin: 0;
        color: var(--ink-soft);
        line-height: 1.7;
      }

      .score-row {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        margin-top: 18px;
      }

      .score-pill {
        background: rgba(255,255,255,0.72);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
      }

      .score-pill strong {
        display: block;
        font-size: 1.35rem;
        line-height: 1;
      }

      .score-pill span {
        color: var(--ink-soft);
        font-size: 0.72rem;
      }

      .list-grid {
        display: grid;
        gap: 14px;
        margin-top: 18px;
      }

      .list-item {
        display: flex;
        gap: 14px;
        align-items: flex-start;
        padding: 14px 16px;
        background: rgba(255,255,255,0.7);
        border: 1px solid var(--line);
        border-radius: 18px;
      }

      .list-num {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: rgba(23,168,95,0.12);
        color: var(--accent-strong);
        display: grid;
        place-items: center;
        font-weight: 800;
      }

      .list-copy strong {
        display: block;
        margin-bottom: 5px;
      }

      .list-copy p {
        margin: 0;
        color: var(--ink-soft);
        line-height: 1.6;
      }

      @media (max-width: 980px) {
        .hero,
        .main-area {
          grid-template-columns: 1fr;
        }

        .feature-list,
        .summary-grid,
        .module-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 620px) {
        .app-shell {
          width: min(var(--container), calc(100% - 18px));
          margin-top: 12px;
        }

        .topbar {
          padding: 12px 14px;
        }

        .hero-copy h1 {
          letter-spacing: -0.05em;
        }

        .hero-stats {
          grid-template-columns: 1fr;
        }

        .nav-actions {
          justify-content: flex-end;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="Greenlight K53 brand">
          <div class="brand-mark">GK</div>
          <div class="brand-copy">
            <strong>Greenlight K53</strong>
            <span>learner prep</span>
          </div>
        </div>

        <div class="nav-actions">
          <button class="chip" type="button" data-view="overview">Overview</button>
          <button class="chip" type="button" data-view="signs">Road signs</button>
          <button class="chip" type="button" data-view="rules">Rules</button>
          <button class="chip primary" type="button" data-view="quiz">Start mock</button>
        </div>
      </header>

      <main class="page" id="app"></main>
    </div>

    <script>
      const state = {
        view: 'overview',
        mockIndex: 0,
        score: 0,
        answered: 0,
        completed: false,
        questions: []
      };

      const modules = {
        overview: {
          title: 'Learning dashboard',
          label: 'Everything in one place',
          summary: [
            { value: '64', label: 'mock questions' },
            { value: '3', label: 'vehicle codes' },
            { value: '4.9/5', label: 'study clarity' }
          ],
          features: [
            { icon: '✓', title: 'Focused learning flow', text: 'Study signs, rules and vehicle controls in a rhythm designed for clarity and confidence.' },
            { icon: '⚡', title: 'Fast exam readiness', text: 'Short, high-signal practice blocks make progress feel measurable without overwhelming the learner.' },
            { icon: '🚦', title: 'Road law clarity', text: 'Plain-English explanations make everyday decisions easy to remember and apply.' },
            { icon: '📘', title: 'Revision built in', text: 'Return to weak areas repeatedly using an elegant review flow built for repetition and confidence.' }
          ]
        },
        signs: {
          title: 'Road sign library',
          label: 'Read the signs before the road',
          summary: [
            { value: '18', label: 'core signs' },
            { value: '6', label: 'sign families' },
            { value: '100%', label: 'visual-first' }
          ],
          cards: [
            { title: 'Stop', detail: 'Complete stop before moving on when safe.', icon: '🛑' },
            { title: 'Yield', detail: 'Give way to traffic that has priority.', icon: '⚠️' },
            { title: 'No entry', detail: 'Do not enter from that direction.', icon: '🚫' },
            { title: 'Minimum speed', detail: 'Drive at or above the posted minimum.', icon: '⏱️' },
            { title: 'Pedestrian crossing', detail: 'Slow down and expect people crossing.', icon: '🚶' },
            { title: 'Railway crossing', detail: 'Prepare to stop and obey every warning.', icon: '🚆' }
          ]
        },
        rules: {
          title: 'Road rules',
          label: 'Use the rules, not guesswork',
          summary: [
            { value: '12', label: 'core rules' },
            { value: '3', label: 'learning tracks' },
            { value: '1', label: 'decision habit' }
          ],
          cards: [
            { title: 'Keep left', detail: 'In South Africa, drive on the left and pass on the right when safe.', icon: '🛣️' },
            { title: 'Gap selection', detail: 'Leave proper follow distance and increase it in rain or poor visibility.', icon: '📏' },
            { title: 'Roundabouts', detail: 'Yield to traffic already moving in the circle.', icon: '🔄' },
            { title: 'Pedestrians', detail: 'Marked crossings require patience and awareness.', icon: '👟' },
            { title: 'Control signals', detail: 'Progress only when it is safe and legal to do so.', icon: '💡' },
            { title: 'Emergency vehicles', detail: 'Pull over left and stop when sirens and lights are active.', icon: '🚑' }
          ]
        },
        controls: {
          title: 'Vehicle controls',
          label: 'Know the controls before you move',
          summary: [
            { value: '24', label: 'control prompts' },
            { value: '3', label: 'vehicle classes' },
            { value: '100%', label: 'control ownership' }
          ],
          cards: [
            { title: 'Clutch', detail: 'Right foot handles brake and accelerator in a manual setup.', icon: '🦶' },
            { title: 'Steering', detail: 'Always keep directional control smooth and precise.', icon: '🧭' },
            { title: 'Indicators', detail: 'Signal in good time before turning or changing lanes.', icon: '🚨' },
            { title: 'Parking brake', detail: 'Secure the vehicle whenever parked or stationary.', icon: '🧱' },
            { title: 'Mirrors', detail: 'Check them before moving, turning or changing lanes.', icon: '🪞' },
            { title: 'Lights', detail: 'Use the correct beam for night and poor visibility.', icon: '💡' }
          ]
        }
      };

      const mockQuestions = [
        {
          question: 'A red octagon road sign means what?',
          options: ['Proceed with caution', 'Stop completely', 'Give way', 'Slow down and continue'],
          correct: 1,
          explanation: 'A red octagon is the stop sign. It requires a full stop before moving on when safe.'
        },
        {
          question: 'When approaching a pedestrian crossing, the correct response is to:',
          options: ['Accelerate and pass quickly', 'Ignore it if no one is visible', 'Slow down and be ready to stop', 'Only stop if a police officer is present'],
          correct: 2,
          explanation: 'Pedestrian crossings need caution. People may step onto the crossing at any time.'
        },
        {
          question: 'Who has priority at a roundabout?',
          options: ['The vehicle entering from your left', 'The vehicle already on the roundabout', 'The largest vehicle', 'The nearest vehicle'],
          correct: 1,
          explanation: 'Traffic already moving in the circle usually has priority; yield to it when safe.'
        },
        {
          question: 'Which control is used to brake a vehicle?',
          options: ['The steering wheel', 'The clutch', 'The brake pedal', 'The indicator lever'],
          correct: 2,
          explanation: 'The brake pedal slows or stops the vehicle. The steering wheel controls direction.'
        },
        {
          question: 'What does a blue circular sign usually mean?',
          options: ['Warning only', 'Mandatory instruction', 'Roadworks ahead', 'Sharp bend ahead'],
          correct: 1,
          explanation: 'Blue signs typically give a compulsory instruction, such as keep left or minimum speed.'
        },
        {
          question: 'When it is raining, the safest adjustment is to:',
          options: ['Increase the following distance and reduce speed', 'Keep the same speed and follow closely', 'Use high beams constantly', 'Brake hard every few seconds'],
          correct: 0,
          explanation: 'Wet roads reduce grip and visibility, which increases stopping distance and risk.'
        }
      ];

      const route = {
        overview: renderOverview,
        signs: renderModule,
        rules: renderModule,
        controls: renderModule,
        quiz: renderQuiz
      };

      function render() {
        const renderFn = route[state.view] || renderOverview;
        document.getElementById('app').innerHTML = renderFn();
        bindAllEvents();
      }

      function bindAllEvents() {
        document.querySelectorAll('[data-view]').forEach((button) => {
          button.addEventListener('click', () => {
            const view = button.dataset.view;
            state.view = view;
            if (view !== 'quiz') {
              state.completed = false;
              state.score = 0;
              state.answered = 0;
              state.mockIndex = 0;
              state.questions = [];
            }
            render();
          });
        });

        document.querySelectorAll('[data-answer]').forEach((button) => {
          button.addEventListener('click', () => {
            const choiceIndex = Number(button.dataset.answer);
            const question = state.questions[state.mockIndex];
            if (!question || question.answered) return;

            question.answered = true;
            const isCorrect = choiceIndex === question.correct;
            if (isCorrect) state.score += 1;
            state.answered += 1;

            button.classList.add(isCorrect ? 'correct' : 'wrong');
            const correctButton = Array.from(document.querySelectorAll('[data-answer]')).find(
              (node) => Number(node.dataset.answer) === question.correct
            );
            if (correctButton) correctButton.classList.add('correct');

            const explanation = document.getElementById('explanation');
            if (explanation) {
              explanation.innerHTML = `<strong>Why:</strong> ${question.explanation}`;
            }

            const nextButton = document.getElementById('nextQuestion');
            if (nextButton) {
              nextButton.disabled = false;
              nextButton.textContent = state.mockIndex === state.questions.length - 1 ? 'See results' : 'Next question';
            }
          });
        });

        const nextButton = document.getElementById('nextQuestion');
        if (nextButton) {
          nextButton.addEventListener('click', () => {
            if (state.mockIndex < state.questions.length - 1) {
              state.mockIndex += 1;
              render();
              return;
            }
            state.completed = true;
            render();
          });
        }

        const restartButton = document.getElementById('restartQuiz');
        if (restartButton) {
          restartButton.addEventListener('click', () => {
            state.mockIndex = 0;
            state.score = 0;
            state.answered = 0;
            state.completed = false;
            state.questions = mockQuestions.map((item) => ({ ...item, answered: false }));
            render();
          });
        }
      }

      function renderOverview() {
        return `
          <section class="hero">
            <div class="hero-copy">
              <div class="eyebrow">Premium learner prep</div>
              <h1>Learn the road. Pass with confidence.</h1>
              <p>
                A cleaner, calmer way to study South African K53 road signs, rules and vehicle controls.
                Everything is designed to feel clear, focused and confidence-building from the first lesson to the final mock.
              </p>
              <div class="cta-row">
                <button class="cta primary" type="button" data-view="quiz">Start mock</button>
                <button class="cta secondary" type="button" data-view="signs">Study signs</button>
              </div>
              <div class="hero-stats">
                ${modules.overview.summary.map(
                  (item) => `
                    <div class="stat-pill">
                      <strong>${item.value}</strong>
                      <span>${item.label}</span>
                    </div>
                  `
                ).join('')}
              </div>
            </div>

            <div class="hero-visual" aria-hidden="true">
              <div class="card-scene">
                <div class="scene-top"></div>
                <div class="route-badge">A+ route</div>
                <div class="signal-ring"></div>
                <div class="signal-visual">K53</div>
                <div class="road-panel">
                  <div class="road-mini">
                    <div class="mini-card">
                      <strong>94%</strong>
                      <span>clarity</span>
                    </div>
                    <div class="mini-card">
                      <strong>4.8</strong>
                      <span>flow score</span>
                    </div>
                    <div class="mini-card">
                      <strong>3x</strong>
                      <span>faster review</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <nav class="nav-panel" aria-label="Primary navigation">
            <button class="nav-pill active" type="button" data-view="overview">Dashboard</button>
            <button class="nav-pill" type="button" data-view="signs">Signs</button>
            <button class="nav-pill" type="button" data-view="rules">Rules</button>
            <button class="nav-pill" type="button" data-view="controls">Controls</button>
            <button class="nav-pill" type="button" data-view="quiz">Mock test</button>
          </nav>

          <section class="main-area">
            <div class="panel content-panel">
              <div class="content-header">
                <h2>Everything you need to pass</h2>
                <span class="soft-tag">clear path</span>
              </div>

              <div class="summary-grid">
                <div class="summary-card">
                  <strong>12</strong>
                  <span>high-impact rules</span>
                </div>
                <div class="summary-card">
                  <strong>18</strong>
                  <span>critical signs</span>
                </div>
                <div class="summary-card">
                  <strong>6</strong>
                  <span>practice loops</span>
                </div>
              </div>

              <div class="feature-list">
                ${modules.overview.features.map(
                  (feature) => `
                    <article class="feature-card">
                      <div class="feature-icon">${feature.icon}</div>
                      <h3>${feature.title}</h3>
                      <p>${feature.text}</p>
                    </article>
                  `).join('')}
              </div>
            </div>

            <aside class="panel side-panel">
              <h3>Quick win checklist</h3>
              <div class="checklist">
                <div class="check-item">
                  <div class="check-bullet">✓</div>
                  <div>
                    <strong>Master the sign families</strong>
                    <span>Red, blue, warning and info</span>
                  </div>
                </div>
                <div class="check-item">
                  <div class="check-bullet">✓</div>
                  <div>
                    <strong>Review decision rules</strong>
                    <span>Right of way, crossing and stopping</span>
                  </div>
                </div>
                <div class="check-item">
                  <div class="check-bullet">✓</div>
                  <div>
                    <strong>Know vehicle controls</strong>
                    <span>Brake, clutch, steering, lights</span>
                  </div>
                </div>
              </div>

              <button class="mini-cta" type="button" data-view="quiz">Take a timed mock</button>

              <div class="study-card">
                <h4>Study rhythm</h4>
                <ul>
                  <li>Learn a sign family</li>
                  <li>Review one rule set</li>
                  <li>Answer a mini quiz</li>
                  <li>Repeat with confidence</li>
                </ul>
              </div>
            </aside>
          </section>
        `;
      }

      function renderModule() {
        const moduleKey = state.view === 'rules' ? 'rules' : state.view === 'controls' ? 'controls' : 'signs';
        const module = modules[moduleKey];

        return `
          <section class="panel content-panel">
            <div class="content-header">
              <div>
                <div class="eyebrow">${module.label}</div>
                <h2 style="margin-top: 14px;">${module.title}</h2>
              </div>
              <span class="soft-tag">study mode</span>
            </div>

            <div class="summary-grid">
              ${module.summary.map(
                (item) => `
                  <div class="summary-card">
                    <strong>${item.value}</strong>
                    <span>${item.label}</span>
                  </div>
                `
              ).join('')}
            </div>

            <div class="module-grid">
              ${module.cards.map(
                (card) => `
                  <div class="module-card" data-module="${moduleKey}">
                    <div class="topline">
                      <div class="module-icon">${card.icon}</div>
                      <div class="progress-ring"><span>68%</span></div>
                    </div>
                    <h3>${card.title}</h3>
                    <p>${card.detail}</p>
                    <div class="module-meta">
                      <span>Priority lesson</span>
                      <span>Review</span>
                    </div>
                  </div>
                `
              ).join('')}
            </div>

            <div class="list-grid">
              <div class="list-item">
                <div class="list-num">1</div>
                <div class="list-copy">
                  <strong>Start with the shape</strong>
                  <p>Red, blue and warning signs all carry a different meaning. Learn the form first before memorising the rule.</p>
                </div>
              </div>
              <div class="list-item">
                <div class="list-num">2</div>
                <div class="list-copy">
                  <strong>Connect it to a decision</strong>
                  <p>Every sign should trigger a real action: stop, yield, proceed, reduce speed or obey a command.</p>
                </div>
              </div>
            </div>
          </section>
        `;
      }

      function renderQuiz() {
        if (!state.questions.length) {
          state.questions = mockQuestions.map((item) => ({ ...item, answered: false }));
        }

        if (state.completed) {
          const percent = Math.round((state.score / state.questions.length) * 100);
          return `
            <section class="result-box">
              <h3>${percent >= 70 ? 'Strong progress' : 'Keep building momentum'}</h3>
              <p>
                ${percent >= 70
                  ? 'You are showing solid understanding. Keep repeating the weak areas and move to a full mock when ready.'
                  : 'This is a useful checkpoint. Review the explanations and try another round to improve your confidence.'}
              </p>
              <div class="score-row">
                <div class="score-pill">
                  <strong>${state.score}/${state.questions.length}</strong>
                  <span>correct</span>
                </div>
                <div class="score-pill">
                  <strong>${percent}%</strong>
                  <span>score</span>
                </div>
                <div class="score-pill">
                  <strong>${Math.max(0, state.questions.length - state.score)}</strong>
                  <span>to review</span>
                </div>
              </div>
              <div class="cta-row" style="margin-top: 18px;">
                <button class="cta primary" type="button" id="restartQuiz">Retry mock</button>
                <button class="cta secondary" type="button" data-view="overview">Back to overview</button>
              </div>
            </section>
          `;
        }

        const question = state.questions[state.mockIndex];
        if (!question) return renderOverview();

        return `
          <section class="quiz-shell">
            <div class="panel content-panel">
              <div class="quiz-card">
                <div class="question-meta">
                  <span>Mock practice</span>
                  <span>${state.mockIndex + 1} / ${state.questions.length}</span>
                </div>

                <div class="question-block">
                  <h3>${question.question}</h3>
                  <div class="answer-list">
                    ${question.options.map(
                      (option, index) => `
                        <button class="answer" type="button" data-answer="${index}">${option}</button>
                      `
                    ).join('')}
                  </div>

                  <div id="explanation" class="explanation">
                    <strong>Why:</strong> Select the best answer to reveal the explanation.
                  </div>
                </div>

                <div class="quiz-actions">
                  <button class="ghost" type="button" data-view="overview">Exit</button>
                  <button class="cta primary" type="button" id="nextQuestion" disabled>Next question</button>
                </div>
              </div>
            </div>
          </section>
        `;
      }

      document.addEventListener('DOMContentLoaded', () => {
        state.questions = mockQuestions.map((item) => ({ ...item, answered: false }));
        render();
      });
    </script>
  </body>
</html>
