/* ============================================================
   DESIGN.md COMPATIBLE TOKENS (Notion + Mintlify hybrid)
   Warm neutrals, single accent, whisper borders, docs clarity
   ============================================================ */
:root{
  /* GreenLight K53 — traffic-signal inspired, warm asphalt + signal green */
  --ink: #17130f;            /* warm asphalt ink */
  --ink-soft: #5c554b;       /* warm gray-brown */
  --ink-faint: #857d70;
  --paper: #fffdf8;          /* warm daylight paper */
  --warm: #f4efe6;           /* warm sand surface */
  --accent: #0e8f3e;         /* signal GO green — primary */
  --accent-soft: #e8f6ec;
  --accent-dark: #0a6b2e;
  --ok: #0e8f3e;             /* go green */
  --ok-soft: #e8f6ec;
  --warn: #b97b06;           /* amber */
  --warn-soft: #fdf3df;
  --err: #c0392b;            /* stop red */
  --err-soft: #fdecea;
  --line: rgba(23,19,15,0.12);
  --line-soft: rgba(23,19,15,0.07);
  --ring: rgba(23,19,15,0.10);
  --r-micro: 4px; --r-std: 12px; --r-lg: 16px; --r-pill: 9999px;
  --sh-card: rgba(23,19,15,0.06) 0 4px 18px, rgba(23,19,15,0.04) 0 2px 8px;
  --sh-btn: rgba(23,19,15,0.07) 0 1px 2px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px; --s9:80px; --s10:120px;
}
html[data-theme="dark"]{
  --ink: rgba(255,250,242,0.97);
  --ink-soft: #b9b2a6;
  --ink-faint: #8f8678;
  --paper: #15120e;
  --warm: #221e18;
  --accent-soft: rgba(14,143,62,0.22);
  --accent-dark: #3ddb7c;
  --ok-soft: rgba(21,128,61,0.22);
  --warn-soft: rgba(138,90,0,0.22);
  --err-soft: rgba(176,69,0,0.22);
  --line: rgba(255,255,255,0.14);
  --line-soft: rgba(255,255,255,0.09);
  --ring: rgba(255,255,255,0.12);
  --sh-card: rgba(0,0,0,0.5) 0px 4px 18px, rgba(0,0,0,0.3) 0px 2px 8px;
  --sh-btn: rgba(0,0,0,0.4) 0 1px 2px;
}
html[data-theme="dark"] body{color-scheme:dark;}
html[data-theme="dark"] .hero{background:
  radial-gradient(120% 140% at 0% 0%, rgba(14,143,62,0.22), rgba(14,143,62,0) 55%),
  radial-gradient(120% 140% at 100% 0%, rgba(185,123,6,0.16), rgba(185,123,6,0) 50%),
  var(--warm);}
html[data-theme="dark"] .story{border-left-color:var(--accent);}
html[data-theme="dark"] .feedback.ok{color:#7bf0a2;}
html[data-theme="dark"] .feedback.no{color:#ffb08a;}
html[data-theme="dark"] .btn-ok:hover{filter:brightness(1.1);}
/* Theme toggle in topbar */
.theme-toggle{background:none;border:1px solid var(--line);border-radius:var(--r-pill);color:var(--ink-soft);
  font-size:16px;width:36px;height:36px;cursor:pointer;display:grid;place-items:center;flex:none;padding:0;}
.theme-toggle:hover{border-color:var(--accent);color:var(--accent);}
/* ---------- Speech / read-aloud controls ---------- */
.speak{background:none;border:1px solid var(--line);border-radius:var(--r-pill);color:var(--ink-soft);
  font-size:15px;width:36px;height:36px;cursor:pointer;display:inline-grid;place-items:center;flex:none;padding:0;
  vertical-align:middle;transition:border-color .15s,color .15s;}
.speak:hover{border-color:var(--accent);color:var(--accent);}
.speak.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.tts-bar{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;background:var(--warm);
  border:1px solid var(--line-soft);border-radius:var(--r-std);padding:10px var(--s3);margin-top:var(--s3);}
.tts-bar .ttx{font-size:13px;color:var(--ink-soft);flex:1;min-width:140px;}
.tts-bar select{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:var(--r-micro);
  background:var(--paper);color:var(--ink);padding:6px 8px;max-width:160px;}
.tts-bar .rate{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);}
.tts-bar input[type=range]{width:90px;accent-color:var(--accent);}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--paper); color:var(--ink); line-height:1.55; font-size:17px;
  font-feature-settings:"lnum" 1;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:680px;margin:0 auto;padding:var(--s4) var(--s4) var(--s7);}
/* ---------- Top progress ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--paper);
  border-bottom:1px solid var(--line-soft);padding:10px var(--s4);
  display:flex;align-items:center;gap:var(--s3);}
.topbar .brand{font-weight:700;font-size:15px;letter-spacing:-0.2px;}
.topbar .brand span{color:var(--accent);}
.prog{flex:1;height:8px;background:var(--warm);border-radius:var(--r-pill);overflow:hidden;}
.prog > i{display:block;height:100%;width:0;background:var(--accent);border-radius:var(--r-pill);transition:width .5s ease;}
.prog-label{font-size:12px;color:var(--ink-soft);font-weight:500;min-width:38px;text-align:right;}
/* ---------- Hero ---------- */
.hero{border-radius:var(--r-lg);padding:var(--s7) var(--s5);margin-bottom:var(--s5);
  background:
    radial-gradient(120% 140% at 0% 0%, rgba(0,117,222,0.10), rgba(0,117,222,0) 55%),
    radial-gradient(120% 140% at 100% 0%, rgba(26,174,57,0.08), rgba(26,174,57,0) 50%),
    var(--warm);
  border:1px solid var(--line-soft);}
.hero h1{margin:0 0 var(--s2);font-size:34px;line-height:1.05;font-weight:700;letter-spacing:-1.4px;}
.hero p{margin:0;color:var(--ink-soft);font-size:16px;max-width:46ch;}
.hero .facts{display:flex;gap:var(--s4);margin-top:var(--s4);flex-wrap:wrap;}
.hero .fact{font-size:13px;color:var(--ink-soft);}
.hero .fact b{display:block;font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-0.5px;}
/* ---------- Section blocks (left-aligned reading flow) ---------- */
.block{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:var(--s5);margin-bottom:var(--s4);box-shadow:var(--sh-card);}
.block h2{margin:0 0 var(--s2);font-size:22px;font-weight:700;letter-spacing:-0.6px;}
.block .lead{margin:0 0 var(--s4);color:var(--ink-soft);font-size:15px;}
.kicker{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.6px;
  color:var(--accent);margin:0 0 var(--s2);}
/* ---------- Buttons ---------- */
.btn{display:block;width:100%;border:none;border-radius:var(--r-pill);
  padding:16px var(--s5);font-size:16px;font-weight:600;cursor:pointer;
  font-family:inherit;transition:transform .08s, background .15s, filter .15s;
  margin-top:var(--s3);text-align:left;line-height:1.3;}
.btn:active{transform:scale(.985);}
.btn-primary{background:var(--accent);color:#fff;box-shadow:var(--sh-btn);}
.btn-primary:hover{background:var(--accent-dark);}
.btn-ghost{background:var(--warm);color:var(--ink);}
.btn-ghost:hover{background:var(--accent-soft);}
.btn-soft{background:var(--accent-soft);color:var(--accent-dark);}
.btn-ok{background:var(--ok);color:#fff;}
.btn-ok:hover{filter:brightness(.95);}
.btn .sub{display:block;font-size:13px;font-weight:500;opacity:.85;margin-top:2px;}
.btn-row{display:flex;gap:var(--s2);}
.btn-row .btn{margin-top:var(--s3);}
/* Balance buttons on wide screens — cap + center instead of stretched pills */
@media (min-width:560px){
  .block > .btn, .btn-row .btn{width:auto;min-width:320px;margin-left:auto;margin-right:auto;text-align:center;}
}
/* ---------- Sign card (visual-first) ---------- */
.signcard{display:flex;flex-wrap:wrap;gap:var(--s4);align-items:flex-start;padding:var(--s4);
  border:1px solid var(--line-soft);border-radius:var(--r-std);margin-bottom:var(--s3);
  background:var(--paper);}
.signcard .art{flex:none;width:96px;height:96px;display:grid;place-items:center;
  background:var(--warm);border-radius:var(--r-std);}
.signcard .body{flex:1 1 0;min-width:min(100%,170px);}
.signcard .name{display:flex;flex-wrap:wrap;align-items:center;column-gap:8px;row-gap:6px;
  font-weight:700;font-size:17px;letter-spacing:-0.3px;color:var(--ink);}
.signcard .fam{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:0.5px;padding:2px 8px;border-radius:var(--r-pill);white-space:normal;
  overflow-wrap:break-word;max-width:100%;}
.signcard .name .speak{flex:none;margin-left:auto;}
.fam-red{background:var(--err-soft);color:var(--err);}
.fam-tri{background:var(--warn-soft);color:var(--warn);}
.fam-blue{background:var(--accent-soft);color:var(--accent-dark);}
.fam-info{background:var(--ok-soft);color:var(--ok);}
.signcard .mean{margin:4px 0 0;font-size:14px;color:var(--ink-soft);}
.signcard .analogy{margin:6px 0 0;font-size:13px;color:var(--ink);background:var(--warm);
  padding:6px 10px;border-radius:var(--r-micro);}
/* ---------- Story cards (rules) ---------- */
.story{border-left:3px solid var(--accent);background:var(--warm);
  padding:var(--s3) var(--s4);border-radius:0 var(--r-std) var(--r-std) 0;margin-bottom:var(--s3);}
.story .q{font-weight:600;font-size:16px;margin:0 0 4px;}
.story .a{font-size:14px;color:var(--ink-soft);margin:0;}
/* ---------- Quiz ---------- */
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);
  background:var(--paper);border-radius:var(--r-std);padding:14px var(--s4);font-size:16px;
  margin-bottom:var(--s2);cursor:pointer;font-family:inherit;color:var(--ink);
  transition:border-color .12s, background .12s;}
.opt:active{border-color:var(--accent);}
.opt.correct{border-color:var(--ok);background:var(--ok-soft);}
.opt.wrong{border-color:var(--err);background:var(--err-soft);}
.opt.disabled{pointer-events:none;}
.feedback{padding:12px var(--s4);border-radius:var(--r-std);margin:var(--s3) 0;font-size:14px;}
.feedback.ok{background:var(--ok-soft);color:#0f6b22;}
.feedback.no{background:var(--err-soft);color:#9a3d00;}
/* ---------- Markings + misc ---------- */
.mini{border:1px solid var(--line-soft);border-radius:var(--r-std);padding:var(--s3) var(--s4);
  margin-bottom:var(--s2);background:var(--paper);}
.mini .t{font-weight:600;font-size:15px;}
.mini .d{font-size:14px;color:var(--ink-soft);margin-top:2px;}
/* ---------- Results ---------- */
.result-title{font-size:28px;font-weight:700;letter-spacing:-0.8px;margin:0 0 4px;}
.result-sub{color:var(--ink-soft);margin:0 0 var(--s4);font-size:15px;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);margin:var(--s4) 0;}
.stat{background:var(--warm);border-radius:var(--r-std);padding:var(--s3);text-align:center;}
.stat .n{font-size:22px;font-weight:700;letter-spacing:-0.5px;}
.stat .l{font-size:12px;color:var(--ink-soft);margin-top:2px;}
/* ---------- Back bar ---------- */
.backbar{position:sticky;top:0;z-index:30;background:var(--paper);
  border-bottom:1px solid var(--line-soft);padding:10px var(--s4);
  display:flex;align-items:center;gap:var(--s3);}
.backbar button{background:none;border:none;font-size:22px;cursor:pointer;color:var(--ink-soft);padding:4px 6px;}
.backbar .ttl{font-weight:700;font-size:16px;}
.backbar .sc{margin-left:auto;font-size:13px;color:var(--ink-soft);font-weight:500;}
/* ---------- Progress rings (readiness) ---------- */
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);margin:var(--s4) 0;}
.ring{--val:0;width:72px;height:72px;margin:0 auto 6px;border-radius:50%;
  background:conic-gradient(var(--accent) calc(var(--val)*1%), var(--warm) 0);display:grid;place-items:center;}
.ring::before{content:'';width:56px;height:56px;border-radius:50%;background:var(--paper);}
.ring span{position:absolute;font-size:15px;font-weight:700;}
.ringwrap{text-align:center;}
.ringwrap .rt{font-size:12px;color:var(--ink-soft);font-weight:600;}
/* ---------- Streak ---------- */
.streak{display:flex;align-items:center;justify-content:center;gap:var(--s2);background:var(--warm);
  border:1px solid var(--line-soft);border-radius:var(--r-pill);padding:8px var(--s4);font-size:14px;font-weight:600;margin-bottom:var(--s3);}
.streak .flame{font-size:18px;}
/* ---------- Flashcards ---------- */
.flash-stage{perspective:1200px;margin:var(--s4) 0;}
.flash-card{position:relative;width:100%;min-height:220px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer;}
.flash-card.flip{transform:rotateY(180deg);}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);
  border-radius:var(--r-lg);background:var(--paper);box-shadow:var(--sh-card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--s5);text-align:center;}
.flash-back{transform:rotateY(180deg);background:var(--accent-soft);}
.flash-back .mean{color:var(--ink);font-size:16px;font-weight:600;margin-top:var(--s2);}
.flash-back .analogy{margin-top:var(--s2);font-size:14px;color:var(--ink-soft);}
.flash-back .hint{position:absolute;top:var(--s2);right:var(--s2);font-size:11px;font-weight:700;color:var(--accent-dark);text-transform:uppercase;letter-spacing:.5px;}
.flash-ctl{display:flex;gap:var(--s2);margin-top:var(--s3);}
@media (prefers-reduced-motion: reduce){.flash-card{transition:none;}}
/* ---------- Memory tricks ---------- */
.mem{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s4);border:1px solid var(--line-soft);
  border-radius:var(--r-std);margin-bottom:var(--s3);background:var(--paper);}
.mem .t2{flex:none;width:40px;height:40px;border-radius:var(--r-pill);background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:18px;}
.mem .tt{font-weight:700;font-size:15px;letter-spacing:-0.2px;}
.mem .tn{margin:2px 0 0;font-size:14px;color:var(--ink-soft);}
/* ---------- Stopping table ---------- */
.span-table{width:100%;border-collapse:collapse;font-size:14px;margin:var(--s3) 0;}
.span-table th,.span-table td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line-soft);}
.span-table th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);}
.span-table td:first-child{font-weight:700;}
.span-table tr:last-child td{border-bottom:none;}
/* ---------- Timer ---------- */
.timer{position:sticky;top:0;z-index:31;background:var(--paper);border-bottom:1px solid var(--line-soft);
  padding:8px var(--s4);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:space-between;}
.timer .ttl{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;}
.timer .time{font-variant-numeric:tabular-nums;}
.timer.warn .time{color:var(--err);}
/* ---------- Utility ---------- */
.hidden{display:none!important;}
.center{text-align:center;}
.footnote{text-align:center;font-size:12px;color:var(--ink-faint);margin-top:var(--s5);line-height:1.5;}
.badge-xl{font-size:60px;text-align:center;margin:6px 0 2px;}
/* ---------- Cheat sheet (print) ---------- */
.cheat h3{margin:var(--s5) 0 6px;font-size:17px;letter-spacing:-0.3px;}
.cheat ul{margin:0;padding-left:20px;}
.cheat li{margin-bottom:6px;font-size:15px;}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--r-pill);margin-right:6px;text-transform:uppercase;letter-spacing:.4px;}
.tag-r{background:var(--err-soft);color:var(--err);}
.tag-t{background:var(--warn-soft);color:var(--warn);}
.tag-b{background:var(--accent-soft);color:var(--accent-dark);}
.tag-g{background:var(--ok-soft);color:var(--ok);}
/* ---------- Confetti ---------- */
.confetti{position:fixed;top:-12px;width:9px;height:14px;opacity:.9;z-index:999;pointer-events:none;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0;}}
@media (prefers-reduced-motion: reduce){.confetti{display:none;}.prog>i{transition:none;}}
/* focus visibility */
a:focus-visible,button:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
@media print{
  .topbar,.backbar,.btn,.footnote,.no-print{display:none!important;}
  .wrap{max-width:100%;padding:0 12px;}
  .block,.signcard,.mini,.story{box-shadow:none;border-color:#ccc;break-inside:avoid;}
  body{font-size:12px;}
}
/* Real SADC sign assets — consistent render */
.signsvg{width:100%;height:100%;display:block;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(23,19,15,.12));}
.question-art{width:min(100%,180px);height:180px;margin:0 auto 16px;display:grid;place-items:center;background:#fff;border:1px solid var(--line-soft);border-radius:12px;padding:12px;box-sizing:border-box;}
.question-art .signsvg{width:100%;height:100%;}
@media(max-width:520px){.question-art{width:144px;height:144px;}}
.signcard .art{width:112px;height:112px;padding:8px;background:#fff;border:1px solid var(--line);box-shadow:inset 0 0 0 4px var(--warm);}

  if(typeof svg==='string' && svg.endsWith('.svg')) return '<img class="signsvg" src="'+svg+'" alt="" width="88" height="88" >';
  return svg;
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
/* Shuffle option order AND return the new index of the correct answer (never hard-coded). */
function shufOpts(opts, correctIdx){
  const tagged=opts.map((o,i)=>({o,i}));
  const sh=shuffle(tagged);
  return {opts:sh.map(x=>x.o), ans: sh.findIndex(x=>x.i===correctIdx)};
}
function signQuestion(sign){
  const related=shuffle(SIGNS.filter(x=>x.id!==sign.id&&x.fam===sign.fam));
  const others=shuffle(SIGNS.filter(x=>x.id!==sign.id&&x.fam!==sign.fam));
  const wrongs=[...related,...others].slice(0,3).map(x=>x.name);
  const opts=shuffle([sign.name,...wrongs]);
  return {q:'What does this sign mean?',svg:signImg(sign.svg),opts,ans:opts.indexOf(sign.name),ex:sign.mean};
}
/* Build 3 plausible-but-wrong options for a rules question, avoiding the correct answer
   and avoiding duplicates. Mixes real content (other rule answers) with sensible decoys so
   the wrong answers read like a real multiple-choice test, not "The opposite". */
function ruleWrongs(rule){
  // Prefer the rule's curated wrong-answer array (topic-relevant, similar-but-not-identical).
  if(rule && rule.w && rule.w.length>=3){ return shuffle(rule.w.slice(0,3)); }
  const correct=rule && rule.a ? rule.a : rule;
  const pool=[];
  RULES.forEach(r=>{ if(r.a!==correct) pool.push(r.a); });
  const decoys=['At least 5 seconds behind','The car on your left goes first','Drive on the right','120 km/h','Stop only if a police officer signals','0.05 g per 100 ml for everyone','At least 1 second behind','Green means go without looking'];
  const out=new Set();
  shuffle(pool).forEach(x=>{ if(out.size<2 && !out.has(x)) out.add(x); });
  shuffle(decoys).forEach(x=>{ if(out.size<3 && !out.has(x)) out.add(x); });
  return [...out].slice(0,3);
}
function buildMock(){

 MARKINGS.forEach(mk=>{
   const wrongs=shuffle(MARKINGS.filter(x=>x!==mk).map(x=>x.d)).slice(0,3);
   const opts=shuffle([mk.d,...wrongs]);
   m.push({type:'mark',q:mk.t+' — what does it mean?',opts,ans:opts.indexOf(mk.d),ex:mk.tip});
 });
 RULES.forEach(r=>{
   const opts=shuffle([r.a,...ruleWrongs(r)]);
   m.push({type:'rule',q:r.q,opts,ans:opts.indexOf(r.a),ex:r.a});
 });
 CONTROLS.forEach(c=>{const so=shufOpts(c.opts,c.ans);m.push({type:'ctrl',q:c.q,opts:so.opts,ans:so.ans,ex:c.ex});});
 MOCK_EXTRA.forEach(e=>{const so=shufOpts(e.opts,e.ans);m.push({type:'extra',q:e.q,opts:so.opts,ans:so.ans,ex:e.ex});});
 return shuffle(m).slice(0,40);
}

/* ---------- TEXT-TO-SPEECH (browser speechSynthesis — offline, no service) ---------- */
const TTS = (()=>{
  function ok(){return typeof speechSynthesis!=='undefined';}
  function pickVoice(){
    if(!ok())return null;
    const vs=speechSynthesis.getVoices();
    if(!vs||!vs.length)return null;
    const prefs=[
      v=>/en[-_]ZA/i.test(v.lang)&&/male/i.test(v.name), // prefer SA male
      v=>/en[-_]ZA/i.test(v.lang),
      v=>/en[-_]GB/i.test(v.lang),
      v=>/en[-_]US/i.test(v.lang)&&/male/i.test(v.name),
      v=>v.lang.startsWith('en')
    ];
    for(const match of prefs){const f=vs.find(match);if(f)return f;}
    return vs[0];
  }
  function stop(){if(ok())speechSynthesis.cancel();}
  function speak(text){ 
    if(!ok()||!text)return;
    stop();
    const u=new SpeechSynthesisUtterance(text);
    const v=pickVoice(); if(v)u.voice=v;
    u.lang=(v&&v.lang)||'en-ZA';
    u.rate=+(state.rate||1);
    u.pitch=1;
    speechSynthesis.speak(u);
  }
  if(ok()){speechSynthesis.onvoiceschanged=()=>{}; speechSynthesis.getVoices();}
  return {ok,speak,stop};
})();
window.__TTS=TTS;
/* Streak: bump once per calendar day; reset if a day was skipped */
function touch(){
  const today=dayKey();
  if(state.lastDay===today) return;
  const y=new Date(); y.setDate(y.getDate()-1);
  const yes=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
  state.streak = (state.lastDay===yes) ? (state.streak||0)+1 : 1;
  state.lastDay=today;
  save();
}

function nextStep(){const weak=[1,2,3].filter(n=>K.state.sessions[n]&&ringFor(n)<70);if(!K.state.sessions[1])return {go:'session1',title:'Start with road signs',copy:'Build recognition first. Finish a short check to unlock an evidence-based score.',cta:'Start signs · about 25 min'};if(weak.length){const n=weak[0], names={1:'Signs',2:'Rules',3:'Controls'};return {go:'session'+n,title:'Repair your '+names[n]+' score',copy:'Your recent accuracy is below 70%. A focused check is the fastest next step.',cta:'Practise '+names[n]};}if(!K.state.sessions[2])return {go:'session2',title:'Continue with road rules',copy:'Turn recognition into safe decisions with a short quiz.',cta:'Start rules · about 25 min'};if(!K.state.sessions[3])return {go:'session3',title:'Finish vehicle controls',copy:'Complete the final topic before a full mock.',cta:'Start controls · about 15 min'};return {go:'mock',title:'Take a realistic mock',copy:'Use the timed simulation only when you want exam pressure; this mock teaches as you go.',cta:'Start learning mock'};}
/* Speak a raw string via TTS (voice+rate from state) */
function speakText(t){ if(t&&window.__TTS&&window.__TTS.ok)window.__TTS.speak(t); }
function stopSpeech(){ if(window.__TTS&&window.__TTS.ok)window.__TTS.stop(); }
/* Toggle: read the visible content of the current screen aloud/off */
function toggleTopSpeech(){
  if(!window.__TTS||!window.__TTS.ok)return;
  const btn=document.querySelector('[data-speak-top]');
  const speaking=btn&&btn.classList.contains('active');
  if(speaking){stopSpeech();btn.classList.remove('active');return;}
  // Grab readable text from the current screen (skip nav, buttons, hidden)
  const txt=(app.innerText||'').replace(/\s+/g,' ').trim();
  speakText(txt||'Nothing to read on this screen yet.');
  if(btn)btn.classList.add('active');
  // Clear 'active' when speech finishes
  speechSynthesis.addEventListener&&speechSynthesis.addEventListener('end',()=>{if(btn)btn.classList.remove('active');},{once:true});
}
/* Speak a specific text via a small button */
function speakBtn(text){
  const safe=String(text).replace(/"/g,'&quot;').replace(/&/g,'&amp;');
  return `<button class="speak" type="button" data-speak="${safe}" aria-label="Read this aloud" title="Read aloud">🔊</button>`;
}
/* Build a TTS settings bar (voice + rate) used on content screens */
function ttsSettingsBar(){
  const voices=(window.speechSynthesis&&window.speechSynthesis.getVoices?window.speechSynthesis.getVoices():[])||[];
  const en=voices.filter(v=>v.lang&&/^en/i.test(v.lang));
  const list=((en.length?en:voices).slice(0,12));
  const opts=list.map(v=>`<option value="${v.name}" ${(state.voice&&state.voice===v.name)?'selected':''}>${v.name.replace(/^[A-Za-z-]+\s+/,'')} (${v.lang})</option>`).join('');
  return `<div class="tts-bar no-print">
    <span class="ttx">🔊 Listen &amp; learn</span>
    ${list.length?`<select id="ttsVoice" aria-label="Choose voice">${opts}<option value="">Default</option></select>`:''}
    <label class="rate">Speed <input type="range" id="ttsRate" min="0.5" max="1.5" step="0.1" value="${state.rate||1}" aria-label="Speech speed"></label>
  </div>`;
}

function quizFlow(questions,sessNum,title){
  let i=0,correct=0,total=questions.length;
  function render(){
    if(i>=total){finishQuiz(sessNum,title,correct,total);return;}
    const q=questions[i];
    const card=ce('div');card.className='block';
    card.innerHTML=`<p class="kicker">Question ${i+1} of ${total}</p>
      ${q.svg?`<div class="question-art">${q.svg}</div>`:''}<h2 style="font-size:19px;letter-spacing:-0.4px;margin-bottom:14px">${q.q}</h2>
      <div>${q.opts.map((o,idx)=>`<button class="opt" type="button" data-i="${idx}">${o}</button>`).join('')}</div>
      <div class="feedback hidden" role="status" aria-live="polite"></div>
      ${bookmarkButton(q)}${evidence(q)}
      <button class="btn btn-primary next hidden">Next →</button>`;
    app.innerHTML=backbar(title,`${i}/${total}`);
    app.appendChild(card);
    const fb=card.querySelector('.feedback'),next=card.querySelector('.next');
    card.querySelectorAll('.opt').forEach(b=>{
      b.addEventListener('click',()=>{
        if(b.disabled)return;
        const ch=+b.getAttribute('data-i');
        card.querySelectorAll('.opt').forEach(x=>{x.disabled=true;x.classList.add('disabled');});
        recordAttempt(q,ch===q.ans);if(ch===q.ans){b.classList.add('correct');correct++;fb.className='feedback ok';fb.textContent='✅ '+q.ex;}
        else{b.classList.add('wrong');card.querySelectorAll('.opt')[q.ans].classList.add('correct');fb.className='feedback no';fb.textContent='❌ '+q.ex;addReview(q);}
        renderAnswerTools(card,q);next.classList.remove('hidden');
      });
    });
    next.addEventListener('click',()=>{i++;render();window.scrollTo(0,0);});
    bindBookmark(card,q);bindGo();
  }
  render();
  window.scrollTo(0,0);
}
function finishQuiz(sessNum,title,correct,total){

  const pct=Math.round(correct/total*100);
  app.innerHTML=backbar(title)+`<div class="block center">
    <div class="badge-xl">${pct>=70?'🎉':'💪'}</div>
    <div class="result-title" role="status">${title} done</div>
    <p class="result-sub">You scored ${correct}/${total} (${pct}%)</p>
    <div class="stat-grid">
      <div class="stat"><div class="n">${correct}</div><div class="l">Correct</div></div>
      <div class="stat"><div class="n">${total-correct}</div><div class="l">To review</div></div>
      <div class="stat"><div class="n">${pct}%</div><div class="l">Score</div></div>
    </div>
    ${pct>=70?'<p>Great work — you understand the key ideas.</p>':'<p>Glance at the ones you missed. They are saved for review.</p>'}
    ${sessNum<3?`<button class="btn btn-primary" data-go="session${sessNum+1}">Next session →</button>`:`<button class="btn btn-ok" data-go="mock">Take the Mock Test 🏁</button>`}
    ${K.state.review.length?`<button class="btn btn-soft" id="revBtn">Review weak spots (${K.state.review.length})</button>`:''}
    <button class="btn btn-ghost" data-go="home">Back to home</button>

  if($('#revBtn'))$('#revBtn').addEventListener('click',openReview);
  if(pct>=70)confetti();bindGo();
}

function safeHTML(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function reviewArt(svg){const match=String(svg||'').match(/assets\/signs\/[a-z0-9-]+\.svg/);return match?signImg(match[0]):'';}
function reviewKey(q){return (q.svg||'')+'|'+q.q+'|'+q.opts[q.ans];}
const TOPIC_PATTERNS=[
 ['Signs and signals',/sign|signal|robot|warning|speed limit|pedestrian man/i],
 ['Parking and stopping',/park|stop|kerb|hydrant|breakdown|triangle/i],
 ['Priority and crossings',/yield|give way|right.of.way|crossing|roundabout|intersection|junction/i],
 ['Speed and distance',/speed|distance|overtak|follow|brak/i],
 ['Visibility and lights',/headlight|light|visibility|mirror|wiper/i],
 ['Vehicle controls',/pedal|clutch|gear|steer|throttle|horn|hooter|indicator|accelerator|control/i],
 ['Safety and legal duties',/learner|licence|alcohol|phone|seatbelt|fuel|trailer|tow/i]
];
function questionCode(q){const title=typeof q==='string'?q:q.q;return K.CONTROLS.some(c=>c.q===title)?'2':K.MOTORCYCLE_CONTROLS.some(c=>c.q===title)?'1':K.HEAVY_CONTROLS.some(c=>c.q===title)?'3':null;}
function visibleForCode(q){const code=questionCode(q);return !code||code===K.state.vehicleCode;}
function topicFor(q){if(q.svg)return 'Signs and signals';if([...K.CONTROLS,...K.MOTORCYCLE_CONTROLS,...K.HEAVY_CONTROLS].some(c=>c.q===q.q))return 'Vehicle controls';return (TOPIC_PATTERNS.find(([,re])=>re.test(q.q))||['Rules of the road'])[0];}
function topicStats(){const out={};Object.values(K.state.attempts).filter(a=>visibleForCode(a.q)).forEach(a=>{const t=a.topic||'Rules of the road';const row=out[t]||{topic:t,correct:0,wrong:0,items:0};row.correct+=a.correct;row.wrong+=a.wrong;row.items++;out[t]=row;});return Object.values(out).sort((a,b)=>(b.wrong/(b.wrong+b.correct+1))-(a.wrong/(a.wrong+a.correct+1)));}
const VARIANT_LINKS=[
 ['When refuelling','When refuelling, the engine must be…'],
 ['While the vehicle is moving, may you hold a cell phone?','A cell phone while driving — what is the rule?'],
 ['A pedestrian is crossing on your half','A pedestrian is crossing your half'],
 ['What does a YELLOW kerb line mean?','No parking yellow line'],
 ['What does a BROKEN','Broken (dashed) white line']
];
function variantFor(q){
 if(q.svg){const sign=K.SIGNS.find(s=>q.svg.includes(s.svg));if(!sign)return null;const v=K.signQuestion(sign);v.q='Which action or restriction does this sign show?';v.ex=sign.analogy+' '+sign.mean;return v;}
 const pair=VARIANT_LINKS.find(([a,b])=>q.q.startsWith(a)||q.q.startsWith(b));if(!pair)return null;
 const other=q.q.startsWith(pair[0])?pair[1]:pair[0];
 const extra=K.MOCK_EXTRA.find(x=>x.q.startsWith(other));if(extra){const so=K.shufOpts(extra.opts,extra.ans);return {q:extra.q,opts:so.opts,ans:so.ans,ex:extra.ex};}
 const rule=K.RULES.find(x=>x.q.startsWith(other));if(rule){const opts=K.shuffle([rule.a,...K.ruleWrongs(rule)]);return {q:rule.q,opts,ans:opts.indexOf(rule.a),ex:rule.a};}
 return null;
}
function optionRationale(q){
 const wrong=q.opts.map((o,i)=>({o,i})).filter(x=>x.i!==q.ans);
 return `<details class="d"><summary>Why the other choices are wrong</summary><ul>${wrong.map(({o})=>{const sign=K.SIGNS.find(s=>s.name===o);return `<li><b>${safeHTML(o)}</b>: ${safeHTML(sign?sign.mean:'It does not answer this situation. Compare the correct rule with the linked official manual topic.')}</li>`;}).join('')}</ul></details>`;
}
function renderAnswerTools(card,q){
 const fb=card.querySelector('.feedback');fb.insertAdjacentHTML('afterend',optionRationale(q));
 const v=variantFor(q);if(v){const button=ce('button');button.className='btn btn-soft';button.type='button';button.textContent='Practise another version';button.addEventListener('click',()=>practiceVariant(v));fb.after(button);}
}
function practiceVariant(q){
 app.innerHTML=backbar('Another version')+`<div class="block"><p class="kicker">Same idea, different wording</p>${q.svg?`<div class="question-art">${q.svg}</div>`:''}<h2>${safeHTML(q.q)}</h2>${q.opts.map((o,i)=>`<button class="opt" type="button" data-i="${i}">${safeHTML(o)}</button>`).join('')}<div class="feedback hidden" role="status"></div>${evidence(q)}<button class="btn btn-ghost" data-go="review">Back to review</button></div>`;
 const card=app.querySelector('.block');card.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;const ok=Number(b.dataset.i)===q.ans;card.querySelectorAll('.opt').forEach(x=>x.disabled=true);b.classList.add(ok?'correct':'wrong');if(!ok){card.querySelectorAll('.opt')[q.ans].classList.add('correct');addReview(q);}recordAttempt(q,ok);const fb=card.querySelector('.feedback');fb.className='feedback '+(ok?'ok':'no');fb.textContent=q.ex;renderAnswerTools(card,q);}));bindGo();
}
function recordAttempt(q,ok){
  const key=reviewKey(q), row=K.state.attempts[key]||{q:q.q,topic:topicFor(q),correct:0,wrong:0,last:0};
  row.correct+=ok?1:0;row.wrong+=ok?0:1;row.last=Date.now();row.topic=topicFor(q);

}
function bookmarkButton(q){

}
function bindBookmark(card,q){
  const b=card.querySelector('.bookmark');if(!b)return;
  b.addEventListener('click',()=>{const key=reviewKey(q);if(K.state.bookmarks[key])delete K.state.bookmarks[key];else K.state.bookmarks[key]={q:q.q,a:q.opts[q.ans],svg:q.svg||'',ex:q.ex||''};K.save();b.setAttribute('aria-pressed',!!K.state.bookmarks[key]);b.textContent=K.state.bookmarks[key]?'★ Saved':'☆ Save question';});
}
const MANUALS={rules:'https://www.natis.gov.za/index.php/downloads/learner-driver-manual/rules-of-the-road',signs:'https://www.natis.gov.za/index.php/downloads/learner-driver-manual/road-traffic-signs',controls:'https://www.natis.gov.za/index.php/downloads/learner-driver-manual/vehicle-controls'};
function sourceFor(q){return [...K.CONTROLS,...K.MOTORCYCLE_CONTROLS,...K.HEAVY_CONTROLS].some(c=>c.q===q.q)?MANUALS.controls:q.svg||q.sec==='Signs'||q.type==='mark'||/marking|kerb line/i.test(q.q)?MANUALS.signs:q.sec==='Controls'||q.type==='ctrl'||/control/i.test(q.q)?MANUALS.controls:MANUALS.rules;}
function evidence(q){return `<p class="footnote">Study source: <a href="${sourceFor(q)}" target="_blank" rel="noopener noreferrer">NaTIS learner manual topic ↗</a> · mapped 3 October 2026 · independent subject review pending. Compare the manual before relying on this explanation.</p>`;}

function addReview(q,answer){
  const item=typeof q==='string'?{q,a:answer}:q;
  const key=item.opts?reviewKey(item):item.q+'|'+item.a;
  const now=Date.now();
  let found=K.state.review.find(r=>r.key===key);
  if(!found){found={key,q:item.q,a:item.opts?item.opts[item.ans]:item.a,opts:item.opts||null,ans:item.ans,ex:item.ex||'',svg:item.svg||'',due:now,level:0,misses:0};K.state.review.push(found);}
  found.opts=item.opts||found.opts;
  found.ans=item.ans??found.ans;
  found.ex=item.ex||found.ex;
  found.svg=item.svg||found.svg;
  found.misses=(found.misses||0)+1;
  found.level=0;
  found.due=now;
  K.save();
}
function reviewDue(){return K.state.review.filter(r=>visibleForCode(r.q)&&Array.isArray(r.opts)&&r.opts.length>1&&Number.isInteger(r.ans)&&r.due<=Date.now());}
function openReview(){
  const due=reviewDue();
  const visible=K.state.review.map((r,i)=>({r,i})).filter(({r})=>visibleForCode(r.q));
  const items=visible.map(({r,i})=>`<div class="mini">

    <p class="footnote">${r.opts?(r.due<=Date.now()?'Ready to retry':`Next review ${new Date(r.due).toLocaleDateString('en-ZA')}`):'Saved from an earlier version · answer only'}</p>
  </div>`).join('');
  app.innerHTML=backbar('Review')+`<div class="block">
    <p class="kicker">Practice your mistakes</p><h2>Weak spots</h2>

    ${due.length?`<button class="btn btn-primary" id="reviewStart" type="button">Retry ${due.length} due question${due.length===1?'':'s'} →</button>`:''}
    ${items||'<p>No mistakes saved yet. Try a section drill or a mock test.</p>'}
    <h3>Saved questions</h3>${Object.values(K.state.bookmarks).filter(b=>visibleForCode(b.q)).map(b=>`<div class="mini"><div class="t">${safeHTML(b.q)}</div><details><summary>Answer and explanation</summary><p>${safeHTML(b.a)} · ${safeHTML(b.ex)}</p></details></div>`).join('')||'<p>Save a question during practice to find it here.</p>'}
    <h3>Topic weaknesses</h3>${topicStats().map(t=>`<div class="mini"><div class="t">${safeHTML(t.topic)}</div><div class="d">${t.correct}/${t.correct+t.wrong} correct across ${t.items} concepts · ${t.wrong} misses</div></div>`).join('')||'<p>Finish a few practice questions to identify weak topics.</p>'}<h3>Repeated mistakes</h3>${Object.values(K.state.attempts).filter(a=>visibleForCode(a.q)&&a.wrong).sort((a,b)=>b.wrong-a.wrong).slice(0,8).map(a=>`<div class="mini"><div class="t">${safeHTML(a.q)}</div><div class="d">${a.wrong} missed · ${a.correct} correct attempts</div></div>`).join('')||'<p>Your practice history will appear here.</p>'}
    <button class="btn btn-ghost" data-go="home">Home</button>
  </div>`;
  if($('#reviewStart'))$('#reviewStart').addEventListener('click',()=>startReview(due.map(r=>r.key)));
  app.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>{K.state.review.splice(Number(b.dataset.remove),1);K.save();openReview();}));
  bindGo();
}
function startReview(keys){
  let i=0,correct=0;
  const total=keys.length;
  function render(){
    if(i>=total){app.innerHTML=backbar('Review complete')+`<div class="block center"><h2>Review complete</h2><p>${correct}/${total} correct. Missed questions remain ready to practise; correct ones return on a later day.</p><button class="btn btn-primary" id="reviewReturn">View weak spots</button><button class="btn btn-ghost" data-go="home">Home</button></div>`;$('#reviewReturn').addEventListener('click',openReview);bindGo();return;}
    const r=K.state.review.find(item=>item.key===keys[i]);
    if(!r){i++;render();return;}
    app.innerHTML=backbar('Weak spots',`${i+1}/${total}`)+`<div class="block"><p class="kicker">Retry ${i+1} of ${total}</p>${r.svg?`<div class="question-art">${reviewArt(r.svg)}</div>`:''}<h2>${safeHTML(r.q)}</h2><div>${r.opts.map((o,n)=>`<button class="opt" type="button" data-i="${n}">${safeHTML(o)}</button>`).join('')}</div><div class="feedback hidden" role="status" aria-live="polite"></div><button class="btn btn-primary next hidden" type="button">Next →</button></div>`;
    const buttons=app.querySelectorAll('.opt'),fb=app.querySelector('.feedback'),next=app.querySelector('.next');
    buttons.forEach(b=>b.addEventListener('click',()=>{
      if(b.disabled)return;
      const chosen=Number(b.dataset.i),ok=chosen===r.ans;
      buttons.forEach(x=>x.disabled=true);buttons[r.ans].classList.add('correct');
      recordAttempt({q:r.q,opts:r.opts,ans:r.ans,svg:r.svg},ok);if(!ok){b.classList.add('wrong');r.level=0;r.due=Date.now();r.misses=(r.misses||0)+1;}
      else{correct++;r.level=Math.min((r.level||0)+1,3);r.due=Date.now()+[0,1,3,7][r.level]*86400000;}
      K.save();fb.className='feedback '+(ok?'ok':'no');fb.textContent=(ok?'Correct. ':'Not yet. ')+(r.ex||'Answer: '+r.a);next.classList.remove('hidden');
    }));
    next.addEventListener('click',()=>{i++;render();window.scrollTo(0,0);});bindGo();
  }
  render();
}

let flashDeck=[];
let flashTotal=0;
function flashPool(){
  const d=[];
  K.SIGNS.forEach(s=>d.push({front:signImg(s.svg),back:{t:s.name,mean:s.mean,extra:s.analogy},kind:'sign'}));
  K.MARKINGS.forEach(m=>d.push({front:m.t,back:{t:'Meaning',mean:m.d,extra:m.tip},kind:'mark'}));

}

      <button class="btn btn-primary" id="flashGot" type="button" style="margin-top:0">✓ Got it</button>
      <button class="btn btn-ghost" id="flashAgain" type="button" style="margin-top:0">↻ Again</button>
    </div>
  </div>`;
  const flipCard=$('#fc');
  const flip=()=>{flipCard.classList.toggle('flip');flipCard.setAttribute('aria-label',flipCard.classList.contains('flip')?'Flip flashcard to show question':'Flip flashcard to reveal answer');};

}

function buildDrill(cat){
  const q=[];
  if(cat==='signs'||cat==='mixed'){
    K.SIGNS.forEach(s=>q.push(K.signQuestion(s)));
    K.MARKINGS.forEach(mk=>{const wrong=K.shuffle(K.MARKINGS.filter(x=>x!==mk).map(x=>x.d)).slice(0,3);const opts=K.shuffle([mk.d,...wrong]);q.push({q:mk.t+' — what does it mean?',opts,ans:opts.indexOf(mk.d),ex:mk.tip});});
  }
  if(cat==='rules'||cat==='mixed')K.rulesForCode(K.state.vehicleCode).forEach(r=>{const opts=K.shuffle([r.a,...K.ruleWrongs(r)]);q.push({q:r.q,opts,ans:opts.indexOf(r.a),ex:r.a});});
  if(cat==='controls'||cat==='mixed')K.controlsForCode(K.state.vehicleCode).forEach(c=>{const so=K.shufOpts(c.opts,c.ans);q.push({q:c.q,opts:so.opts,ans:so.ans,ex:c.ex});});
  if(cat==='mixed')return K.shuffle(q).slice(0,20);
  if(cat==='signs')return q; // full section = 28+ questions in real test; we use all available
  if(cat==='rules')return q;
  if(cat==='controls')return q;
  return K.shuffle(q);
}
function drill(cat){
  const qs=buildDrill(cat);let i=0,correct=0,total=qs.length;
  const names={signs:'Signs',rules:'Rules',controls:'Controls',mixed:'Mixed'};
  // Official section pass marks: Rules 22/28, Signs 23/28, Controls 6/8
  const passMap={rules:Math.ceil(total*22/28),signs:Math.ceil(total*23/28),controls:Math.ceil(total*6/8),mixed:Math.ceil(total*0.8)};
  const passMark=passMap[cat]||Math.ceil(total*0.8);
  render();
  function render(){
    if(i>=total){const p=correct>=passMark;const topicMap={signs:1,rules:2,controls:3};if(topicMap[cat]){K.state.mastery=K.state.mastery||{};K.state.mastery[topicMap[cat]]=Math.round(correct/total*100);K.save();}app.innerHTML=backbar(names[cat])+`<div class="block center"><div class="badge-xl">${p?'🎉':'💪'}</div><div class="result-title">${p?'Pass!':'Keep going'}</div><p class="result-sub">${correct}/${total} — needed ${passMark}</p><div class="stat-grid"><div class="stat"><div class="n">${correct}</div><div class="l">Correct</div></div><div class="stat"><div class="n">${total-correct}</div><div class="l">To review</div></div><div class="stat"><div class="n">${p?'PASS':'STUDY'}</div><div class="l">Verdict</div></div></div><button class="btn btn-primary" id="drillAgain" type="button">Retry</button><button class="btn btn-ghost" data-go="practice">More drills</button></div>`;const b=$('#drillAgain');if(b)b.addEventListener('click',()=>drill(cat));bindGo();return;}
    const q=qs[i];const card=ce('div');card.className='block';
    card.innerHTML=`<p class="kicker">Question ${i+1} of ${total}</p>${q.svg?`<div class="question-art">${q.svg}</div>`:''}<h2 style="font-size:18px;letter-spacing:-0.3px;margin:0 0 14px">${q.q}</h2><div>${q.opts.map((o,idx)=>`<button class="opt" type="button" data-i="${idx}">${o}</button>`).join('')}</div><div class="feedback hidden" role="status" aria-live="polite"></div><button class="btn btn-primary next hidden" type="button">Next →</button>`;
    app.innerHTML=backbar(names[cat],`${correct}/${total}`);app.appendChild(card);
    const fb=card.querySelector('.feedback'),next=card.querySelector('.next');
    card.querySelectorAll('.opt').forEach(b=>{b.addEventListener('click',()=>{if(b.disabled)return;const ch=+b.getAttribute('data-i');card.querySelectorAll('.opt').forEach(x=>{x.disabled=true;x.classList.add('disabled');});recordAttempt(q,ch===q.ans);if(ch===q.ans){b.classList.add('correct');correct++;fb.className='feedback ok';}else{b.classList.add('wrong');card.querySelectorAll('.opt')[q.ans].classList.add('correct');addReview(q);}fb.textContent='💡 '+q.ex;renderAnswerTools(card,q);next.classList.remove('hidden');});});
    next.addEventListener('click',()=>{i++;render();window.scrollTo(0,0);});
    bindBookmark(card,q);bindGo();
  }
}

function mockAcc(){const a=K.state.acc;return a?.total? Math.round(a.correct/a.total*100):0;}
function sectionPass(sec){const p=K.state.secPass;return !!(p&&p[sec]);}
function readiness(){
  const s=K.state;
  const sessionsDone=[1,2,3].filter(n=>s.sessions[n]).length;
  const acc=mockAcc();
  const doneAll=sessionsDone===3;
  const secRules=sectionPass('rules'), secSigns=sectionPass('signs'), secCtrl=sectionPass('controls');
  const allSec=secRules&&secSigns&&secCtrl;
  let verdict,emoji,msg,score;
  if(doneAll && allSec && acc>=85){
    verdict='Strong practice result'; emoji='🏆'; score=100;
    msg='You passed every section in practice and completed the study sessions. Keep reviewing mistakes and use the current official material before your test.';
  } else if(doneAll && allSec){
    verdict='Almost there'; emoji='🚀'; score=85;
    msg='You completed the sessions and passed every section in practice. Review the questions you missed and try another full mock.';
  } else if(sessionsDone===0 && !allSec){
    verdict=s.acc?.total?'Build your foundation':'Just starting'; emoji='🌱'; score=0;
    msg=s.acc?.total?'You completed practice questions. Study the signs, rules and controls, then retake the sections you missed.':'Start with Session 1, then use the section drills to track your progress.';
  } else if(!doneAll){
    verdict='Getting there'; emoji='📚'; score=Math.round(sessionsDone/3*60);
    msg='Keep going through the three sessions, then pass each section of the mock.';
  } else if(doneAll && !allSec){
    const missing=[];
    if(!secRules)missing.push('Rules');
    if(!secSigns)missing.push('Signs');
    if(!secCtrl)missing.push('Controls');
    verdict='Pass your weak section'; emoji='🎯'; score=60;
    msg='Sessions are done. You still need to pass: '+missing.join(', ')+'. Retake that section of the mock.';
  } else {
    verdict='Close — pass the mock'; emoji='🎯'; score=45;
    msg='Sessions are done. Now lock it in: retake the mock until you pass all sections comfortably.';
  }
  const attempts=Object.values(s.attempts||{}).filter(a=>visibleForCode(a.q)), repeated=attempts.filter(a=>a.correct+a.wrong>=2).length;
  if(score>=85 && repeated<20){score=Math.min(score,79);msg+=' Build confidence with at least 20 concepts answered more than once; '+repeated+' have repeated evidence so far.';}
  if(s.vehicleCode!=='2'){score=Math.min(score,79);msg+=' Complete your selected code’s official controls manual too.';}
  return {verdict,emoji,msg,score,sessionsDone,acc,mockPass:!!s.mockPass,secRules,secSigns,secCtrl,allSec};
}

/* Build one section's questions (full pool, shuffled) */
function buildSection(sec){
  const q=[];
  if(sec==='rules'){
    K.rulesForCode(K.state.vehicleCode).forEach(r=>{const opts=K.shuffle([r.a,...K.ruleWrongs(r)]);q.push({q:r.q,opts,ans:opts.indexOf(r.a),ex:r.a});});
    K.extraForCode(K.state.vehicleCode).forEach(e=>{const so=K.shufOpts(e.opts,e.ans);q.push({q:e.q,opts:so.opts,ans:so.ans,ex:e.ex});});
  } else if(sec==='signs'){
    K.SIGNS.forEach(s=>q.push(K.signQuestion(s)));
    K.MARKINGS.forEach(mk=>{const wrong=K.shuffle(K.MARKINGS.filter(x=>x!==mk).map(x=>x.d)).slice(0,3);const opts=K.shuffle([mk.d,...wrong]);q.push({q:mk.t+' — what does it mean?',opts,ans:opts.indexOf(mk.d),ex:mk.tip});});
  } else if(sec==='controls'){
    K.controlsForCode(K.state.vehicleCode).forEach(c=>{const so=K.shufOpts(c.opts,c.ans);q.push({q:c.q,opts:so.opts,ans:so.ans,ex:c.ex});});
  }
  // Return exact official counts: Rules 28, Signs 28, Controls 8
  const target = sec==='rules' ? 28 : sec==='signs' ? 28 : 8;
  return K.shuffle(q).slice(0, target);
}

/* Start a full test (sequential sections) or a single section */
function startMock(onlySec){
  const sections = onlySec ? [onlySec] : SECTION_ORDER.slice();
  // Store results on K.state so finishMock/share handler can access
  K.state.mockResults = onlySec ? (K.state.mockResults || {}) : {};
  K.state.secPass = onlySec ? (K.state.secPass || {}) : {};
  if (onlySec) { delete K.state.mockResults[onlySec]; delete K.state.secPass[onlySec]; }
  const timedMock = mockSeconds > 0;
  let si=0;
  function startSection(sec){
    const meta=SECTION_META[sec];
    mockData=buildSection(sec);
    let i=0,correct=0,total=mockData.length;
    function timerHTML(){
      if(!mockSeconds)return '';
      const m=String(Math.floor(mockSeconds/60)).padStart(2,'0'),s=String(mockSeconds%60).padStart(2,'0');
      return `<div class="timer no-print ${mockSeconds<=60?'warn':''}"><span class="ttl">Time left</span><span class="time">${m}:${s}</span></div>`;
    }
    if(mockSeconds){
      mockTimer=setInterval(()=>{mockSeconds--;const t=document.querySelector('.timer .time');if(t)t.textContent=String(Math.floor(mockSeconds/60)).padStart(2,'0')+':'+String(mockSeconds%60).padStart(2,'0');if(mockSeconds<=60&&document.querySelector('.timer'))document.querySelector('.timer').classList.add('warn');if(mockSeconds<=0){clearInterval(mockTimer);mockTimer=null;finishSection(sec);}},1000);
    }
    function render(){
      if(i>=total){finishSection(sec);return;}
      const q=mockData[i];
      const card=ce('div');card.className='block';
      let head=q.svg?`<div class="question-art">${q.svg}</div>`:'';
      card.innerHTML=`<p class="kicker">${meta.name} · Q${i+1} of ${total}</p>
        ${head}
        <h2 style="font-size:18px;letter-spacing:-0.3px;margin:0 0 14px">${q.q}</h2>
        <div>${q.opts.map((o,idx)=>`<button class="opt" type="button" data-i="${idx}">${o}</button>`).join('')}</div>
        <div class="feedback hidden" role="status" aria-live="polite"></div>
        ${bookmarkButton(q)}${evidence(q)}
        <button class="btn btn-primary next hidden">Next →</button>`;
      app.innerHTML=backbar(meta.name,`${i+1}/${total}`)+(mockSeconds?timerHTML():'');
      app.appendChild(card);
      const fb=card.querySelector('.feedback'),next=card.querySelector('.next');
      card.querySelectorAll('.opt').forEach(b=>{
        b.addEventListener('click',()=>{
          if(b.disabled)return;
          const ch=+b.getAttribute('data-i');
          card.querySelectorAll('.opt').forEach(x=>{x.disabled=true;x.classList.add('disabled');});
          recordAttempt(q,ch===q.ans);if(ch===q.ans){b.classList.add('correct');correct++;fb.className='feedback ok';fb.textContent='✅ '+q.ex;}
          else{b.classList.add('wrong');card.querySelectorAll('.opt')[q.ans].classList.add('correct');fb.className='feedback no';fb.textContent='❌ '+q.ex;addReview(q);}
          renderAnswerTools(card,q);next.classList.remove('hidden');
        });
      });
      next.addEventListener('click',()=>{i++;render();window.scrollTo(0,0);});
      bindBookmark(card,q);bindGo();
    }
    function finishSection(sec){
      const meta=SECTION_META[sec];
      const need=meta.need;
      const passed=correct>=need;
      K.state.mockResults[sec]={correct,total,pass:passed,need};
      K.state.secPass=K.state.secPass||{};
      K.state.secPass[sec]=passed;
      K.save();
      if(mockTimer){clearInterval(mockTimer);mockTimer=null;}
      const nextSec = onlySec ? null : SECTION_ORDER[SECTION_ORDER.indexOf(sec)+1];
      if(timedMock && mockSeconds<=0){ finishMock(onlySec); return; }
      if(nextSec){
        // Section break screen
        app.innerHTML=backbar('Section Complete')+`<div class="block center">
          <div class="badge-xl">${passed?'✅':'📚'}</div>
          <div class="result-title">${meta.name} done</div>
          <p class="result-sub">${correct}/${total} — needed ${need} · ${passed?'PASSED ✓':'NOT PASSED'}</p>
          <div class="stat-grid">
            <div class="stat"><div class="n">${correct}</div><div class="l">Correct</div></div>
            <div class="stat"><div class="n">${total-correct}</div><div class="l">Wrong</div></div>
            <div class="stat"><div class="n">${passed?'PASS':'RETRY'}</div><div class="l">Verdict</div></div>
          </div>
          <button class="btn btn-primary" id="nextSecBtn" type="button">Next: ${SECTION_META[nextSec].name} →</button>
          <button class="btn btn-ghost" data-go="mock">Quit to menu</button>
        </div>`;
        $('#nextSecBtn').addEventListener('click',()=>startSection(nextSec));
        bindGo();
      } else {
        finishMock(onlySec);
      }
    }
    render();
  }
  startSection(sections[0]);
}

/* ---------- SHARE CARD (canvas-generated result image) ---------- */
function makeShareCard(secCorrect, secCount, totalCorrect, total, passed, scope='full'){
  const cvs=document.createElement('canvas');
  cvs.width=800; cvs.height=600;
  const ctx=cvs.getContext('2d');
  // Background
  const grad=ctx.createLinearGradient(0,0,0,600);
  grad.addColorStop(0,'#0075de'); grad.addColorStop(1,'#005bab');
  ctx.fillStyle=grad; ctx.fillRect(0,0,800,600);
  // Accent stripe
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,800,6);
  // Title
  ctx.font='bold 48px Inter, Arial'; ctx.fillStyle='#fff'; ctx.textAlign='center';
  ctx.fillText(T('share.title') || 'My K53 Mock Result', 400, 80);
  // Overall
  ctx.font='bold 72px Inter, Arial';
  ctx.fillStyle=passed?'#7bf0a2':'#ffb08a';
  ctx.fillText(totalCorrect + ' / ' + total, 400, 180);
  ctx.font='24px Inter, Arial'; ctx.fillStyle='#e8f5ff';
  ctx.fillText(scope==='section'?'Section practice':'Full practice mock', 400, 210);
  // Section bars
  const meta={'rules':'Rules','signs':'Signs','controls':'Controls'};
  const order=['rules','signs','controls'];
  const barW=500, barH=48, startX=150, startY=260, gap=60;
  order.forEach((s,idx)=>{
    const c=secCorrect[s]||0, t=secCount[s]||0, need=SECTION_META[s].need;
    const pct=t>0?c/t:0; const ok=t===SECTION_META[s].n&&c>=need;
    ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.beginPath(); ctx.roundRect(startX,startY+idx*gap,barW,barH,12); ctx.fill();
    ctx.fillStyle=ok?'rgba(21,128,61,0.6)':'rgba(176,69,0,0.6)'; if(t&&c){ctx.beginPath();ctx.roundRect(startX,startY+idx*gap,barW*pct,barH,12);ctx.fill();}
    ctx.font='bold 22px Inter, Arial'; ctx.fillStyle='#fff'; ctx.textAlign='left';
    ctx.fillText(meta[s], startX+20, startY+idx*gap+32);
    ctx.font='20px Inter, Arial'; ctx.fillStyle='#cfefff'; ctx.textAlign='right';
    ctx.fillText(t?c+'/'+t+' (need '+need+')':'Not taken', startX+barW-20, startY+idx*gap+32);
  });
  // Footer
  ctx.font='18px Inter, Arial'; ctx.fillStyle='#cfefff'; ctx.textAlign='center';
  const msg = scope==='section' ? (passed?'Section practice passed':'Keep practising this section') : (passed?'All sections passed in practice':'Working on my weak sections');
  ctx.fillText(msg, 400, 560);
  return cvs.toDataURL('image/png');
}

function finishMock(onlySec){
  const sections = onlySec ? [onlySec] : SECTION_ORDER;

  sections.forEach(s=>{const r=K.state.secPass&&K.state.secPass[s];if(!r)allPass=false;});
  // Build summary
  const rows=sections.map(s=>{
    const p=K.state.secPass&&K.state.secPass[s];
    const m=SECTION_META[s];
    const result=K.state.mockResults?.[s];
    return `<tr><td>${m.name}</td><td>${!result?'NOT TAKEN':`${result.correct}/${result.total} · ${p?'<span style="color:var(--ok);font-weight:700">PASSED</span>':'<span style="color:var(--err);font-weight:700">NOT PASSED</span>'}`}</td><td>${m.need}/${m.n}</td></tr>`;
  }).join('');
  const overallPass = onlySec ? (K.state.secPass&&K.state.secPass[onlySec]) : allPass;
  const attempted=sections.map(s=>K.state.mockResults?.[s]).filter(Boolean);
  const attemptedCorrect=attempted.reduce((sum,r)=>sum+r.correct,0);
  const attemptedTotal=attempted.reduce((sum,r)=>sum+r.total,0);
  if(!onlySec)K.state.mockPass=overallPass;
  K.state.mastery=K.state.mastery||{};
  const resultMap={rules:2,signs:1,controls:3};
  sections.forEach(sec=>{const result=(K.state.mockResults||{})[sec];if(result&&result.total){K.state.mastery[resultMap[sec]]=Math.round(result.correct/result.total*100);}});
  const allResults=Object.values(K.state.mockResults||{});
  const totalSeen=allResults.reduce((sum,item)=>sum+(item.total||0),0);
  const correctSeen=allResults.reduce((sum,item)=>sum+(item.correct||0),0);
  if(totalSeen)K.state.acc={correct:correctSeen,total:totalSeen};
  K.save();
  app.innerHTML=backbar('Mock Result')+`<div class="block center">
    <div class="badge-xl">${overallPass?'🏆':'📚'}</div>
    <div class="result-title" role="status">${overallPass?(onlySec?'Section practice passed':'Practice test passed'):'Review your sections'}</div>

    <p class="result-sub"><strong>${attemptedCorrect}/${attemptedTotal}</strong> correct${onlySec?' in this section':' across the mock'}</p>
    <table class="span-table" style="margin:var(--s4) 0"><thead><tr><th>Section</th><th>Result</th><th>Pass mark</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="footnote" style="margin-bottom:var(--s4)">Real K53 learner's test: Rules ${SECTION_META.rules.need}/${SECTION_META.rules.n} · Signs ${SECTION_META.signs.need}/${SECTION_META.signs.n} · Controls ${SECTION_META.controls.need}/${SECTION_META.controls.n}. You must reach each on its own.</p>
    ${overallPass?'<p>You passed this practice test. Review the official material before booking.</p>':'<p>Review the sections you missed, then try again.</p>'}
    ${K.state.review.length?`<button class="btn btn-soft" id="revBtn">Review my weak spots (${K.state.review.length})</button>`:''}
    <button class="btn btn-primary" id="shareBtn" type="button">📤 Share Result</button>
    <button class="btn btn-ghost" data-go="mock">Retake mock</button>
    <button class="btn btn-ghost" data-go="home">Home</button>
  </div>`;
  if($('#revBtn'))$('#revBtn').addEventListener('click',openReview);
  if($('#shareBtn'))$('#shareBtn').addEventListener('click',()=>{
    const r = K.state.mockResults || {};
    const secCorrect={}, secCount={};
    SECTION_ORDER.forEach(s=>{const item=onlySec&&s!==onlySec?null:r[s];secCorrect[s]=item?.correct||0;secCount[s]=item?.total||0;});
    const totalCorrect = SECTION_ORDER.reduce((sum,s)=>sum+(r[s]?.correct||0), 0);
    const totalQ = SECTION_ORDER.reduce((sum,s)=>sum+(r[s]?.total||0), 0);
    const dataUrl=makeShareCard(secCorrect, secCount, totalCorrect, totalQ, overallPass, onlySec?'section':'full');
    const a=document.createElement('a'); a.href=dataUrl; a.download='k53-result.png'; a.click();
  });
  if(overallPass)confetti();
  bindGo();
}

/* ---------- PWA INSTALL PROMPT ---------- */
let deferredPrompt=null;
let installDismissed=false;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone=(window.matchMedia&&(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true));
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault(); deferredPrompt=e;
});
window.addEventListener('appinstalled',()=>{ deferredPrompt=null; installDismissed=true; removeInstallBanner(); });
function installPromptHTML(){
  const canPrompt=!isIOS && !!deferredPrompt;
  const label=isIOS?'Get GreenLight on your Home Screen':(canPrompt?'Install GreenLight K53':'Add GreenLight to your phone');
  const sub=isIOS?'Works offline after adding to Home Screen.':'Free study aid · works offline after installation.';
  const icon = '<span class="pwa-icon" aria-hidden="true"><img src="icon.svg" alt="" width="24" height="24"></span>';
  const close = '<button class="pwa-close" id="pwaClose" type="button" aria-label="Dismiss install prompt">✕</button>';
  const btn = canPrompt
    ? '<button class="pwa-install" id="pwaInstall" type="button">Install</button>'
    : '<button class="pwa-install pwa-install-subtle" id="pwaInstall" type="button">How to install</button>';
  return `<div class="pwa-card">
      ${close}
      ${icon}
      <div class="pwa-body">
        <div class="pwa-title">${label}</div>
        <div class="pwa-sub">${sub}</div>
      </div>
      ${btn}
    </div>`;
}
function removeInstallBanner(){ const el=document.getElementById('installBanner'); if(el)el.remove(); }
function maybeShowInstall(){
  if(installDismissed||isStandalone)return;
  if(document.getElementById('installBanner'))return;
  // If we have no real prompt and it's not iOS, still allow an honest "how to install" banner.
  const banner=document.createElement('div');
  banner.id='installBanner'; banner.className='no-print';
  banner.setAttribute('role','dialog'); banner.setAttribute('aria-label','Install GreenLight K53');
  banner.innerHTML=installPromptHTML();
  if(!document.getElementById('app')){ if(app) app.insertBefore(banner, app.firstChild); return; }
  app.insertBefore(banner, app.firstChild);
  requestAnimationFrame(()=>banner.classList.add('pwa-in'));
  const i=document.getElementById('pwaInstall'); const d=document.getElementById('pwaClose');
  if(i)i.addEventListener('click',async()=>{
    const canPrompt=!isIOS && !!deferredPrompt;
    if(!canPrompt){
      // No native prompt (iOS or browser hasn't offered): show honest guidance, no dead button
      i.textContent='Done';
      const b=banner.querySelector('.pwa-sub');
      b.textContent=isIOS
        ?'In Safari: tap Share (square with ↑) → “Add to Home Screen” → “Add”. Open it from your Home Screen to use it offline.'
        :'In your browser: tap the ⋮/Share menu → “Install app” or “Add to Home Screen”. It then works offline like an app.';
      b.classList.add('pwa-warn');
      return;
    }
    banner.classList.remove('pwa-in');
    deferredPrompt.prompt();
    try{ await deferredPrompt.userChoice; }catch(e){}
    deferredPrompt=null; installDismissed=true;
    removeInstallBanner();
  });
  if(d)d.addEventListener('click',()=>{ banner.classList.remove('pwa-in'); installDismissed=true; deferredPrompt=null; setTimeout(removeInstallBanner,180); });
}
// Installation guidance is available on demand through the top bar.
/* PWA: register service worker (guarded — only on secure contexts that support it) */
if ('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', {updateViaCache:'none'}).then(()=>{
      // If a new SW is already controlling (installed by a previous load), activate it now
      if(navigator.serviceWorker.controller){
        navigator.serviceWorker.ready.then((reg)=>{ if(reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'}); });
      }
    }).catch(()=>{});
  });
  // On controllerchange (new SW activated), show a quiet reload toast so the user gets the fresh version
  let reloadPrompted=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(reloadPrompted)return; reloadPrompted=true;
    const t=document.createElement('div');
    t.id='swToast'; t.className='no-print';
    t.setAttribute('role','status');
    t.style.cssText='position:fixed;top:76px;right:16px;max-width:360px;z-index:99;padding:12px 14px;border-radius:6px;background:var(--ink, #17130f);color:#fff;font-size:13px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.3);';
    t.innerHTML=`<span style="flex:1">A new version is ready.</span><button id="swReload" style="background:var(--accent,#0e8f3e);color:#fff;border:none;padding:9px 12px;border-radius:6px;font-weight:600;cursor:pointer;font-family:inherit">Reload</button><button id="swClose" aria-label="Dismiss update message" style="background:none;color:#fff;border:0;font-size:20px;cursor:pointer">×</button>`;
    document.body.appendChild(t);
    document.getElementById('swReload').addEventListener('click',()=>location.reload());
    document.getElementById('swClose').addEventListener('click',()=>t.remove());
    setTimeout(()=>t.remove(),9000);
  });
}
/* Privacy-respecting usage beacon: reports a page-view to Vercel Analytics when
   it is enabled for the deployment (via the /_vercel/insights endpoint). If
   Vercel Analytics isn't enabled, this fires no request at all — zero cost,
   respects the offline-first design, and sends no personal data. */
(function(){
  try{
    if(navigator.onLine===false) return;
    var bp=document.createElement('script');
    bp.setAttribute('src','/_vercel/insights/script.js');
    bp.setAttribute('defer','');
    document.head.appendChild(bp);
  }catch(e){}
})();
</script>
