/* ============================================================
   DESIGN.md COMPATIBLE TOKENS (Notion + Mintlify hybrid)
   Warm neutrals, single accent, whisper borders, docs clarity
   ============================================================ */
:root{
  /* GreenLight K53 — traffic-signal inspired, warm asphalt + signal green */
  --ink: #17130f;            /* warm asphalt ink */
  --ink-soft: #5c554b;       /* warm gray-brown */
  --ink-faint: #857d70;
  --paper: #fffdf8;          /* warm daylight paper */
  --warm: #f4efe6;           /* warm sand surface */
  --accent: #0e8f3e;         /* signal GO green — primary */
  --accent-soft: #e8f6ec;
  --accent-dark: #0a6b2e;
  --ok: #0e8f3e;             /* go green */
  --ok-soft: #e8f6ec;
  --warn: #b97b06;           /* amber */
  --warn-soft: #fdf3df;
  --err: #c0392b;            /* stop red */
  --err-soft: #fdecea;
  --line: rgba(23,19,15,0.12);
  --line-soft: rgba(23,19,15,0.07);
  --ring: rgba(23,19,15,0.10);
  --r-micro: 4px; --r-std: 12px; --r-lg: 16px; --r-pill: 9999px;
  --sh-card: rgba(23,19,15,0.06) 0 4px 18px, rgba(23,19,15,0.04) 0 2px 8px;
  --sh-btn: rgba(23,19,15,0.07) 0 1px 2px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px; --s9:80px; --s10:120px;
}
html[data-theme="dark"]{
  --ink: rgba(255,250,242,0.97);
  --ink-soft: #b9b2a6;
  --ink-faint: #8f8678;
  --paper: #15120e;
  --warm: #221e18;
  --accent-soft: rgba(14,143,62,0.22);
  --accent-dark: #3ddb7c;
  --ok-soft: rgba(21,128,61,0.22);
  --warn-soft: rgba(138,90,0,0.22);
  --err-soft: rgba(176,69,0,0.22);
  --line: rgba(255,255,255,0.14);
  --line-soft: rgba(255,255,255,0.09);
  --ring: rgba(255,255,255,0.12);
  --sh-card: rgba(0,0,0,0.5) 0px 4px 18px, rgba(0,0,0,0.3) 0px 2px 8px;
  --sh-btn: rgba(0,0,0,0.4) 0 1px 2px;
}
html[data-theme="dark"] body{color-scheme:dark;}
html[data-theme="dark"] .hero{background:
  radial-gradient(120% 140% at 0% 0%, rgba(14,143,62,0.22), rgba(14,143,62,0) 55%),
  radial-gradient(120% 140% at 100% 0%, rgba(185,123,6,0.16), rgba(185,123,6,0) 50%),
  var(--warm);}
html[data-theme="dark"] .story{border-left-color:var(--accent);}
html[data-theme="dark"] .feedback.ok{color:#7bf0a2;}
html[data-theme="dark"] .feedback.no{color:#ffb08a;}
html[data-theme="dark"] .btn-ok:hover{filter:brightness(1.1);}
/* Theme toggle in topbar */
.theme-toggle{background:none;border:1px solid var(--line);border-radius:var(--r-pill);color:var(--ink-soft);
  font-size:16px;width:36px;height:36px;cursor:pointer;display:grid;place-items:center;flex:none;padding:0;}
.theme-toggle:hover{border-color:var(--accent);color:var(--accent);}
/* ---------- Speech / read-aloud controls ---------- */
.speak{background:none;border:1px solid var(--line);border-radius:var(--r-pill);color:var(--ink-soft);
  font-size:15px;width:36px;height:36px;cursor:pointer;display:inline-grid;place-items:center;flex:none;padding:0;
  vertical-align:middle;transition:border-color .15s,color .15s;}
.speak:hover{border-color:var(--accent);color:var(--accent);}
.speak.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.tts-bar{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;background:var(--warm);
  border:1px solid var(--line-soft);border-radius:var(--r-std);padding:10px var(--s3);margin-top:var(--s3);}
.tts-bar .ttx{font-size:13px;color:var(--ink-soft);flex:1;min-width:140px;}
.tts-bar select{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:var(--r-micro);
  background:var(--paper);color:var(--ink);padding:6px 8px;max-width:160px;}
.tts-bar .rate{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);}
.tts-bar input[type=range]{width:90px;accent-color:var(--accent);}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--paper); color:var(--ink); line-height:1.55; font-size:17px;
  font-feature-settings:"lnum" 1;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:680px;margin:0 auto;padding:var(--s4) var(--s4) var(--s7);}
/* ---------- Top progress ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--paper);
  border-bottom:1px solid var(--line-soft);padding:10px var(--s4);
  display:flex;align-items:center;gap:var(--s3);}
.topbar .brand{font-weight:700;font-size:15px;letter-spacing:-0.2px;}
.topbar .brand span{color:var(--accent);}
.prog{flex:1;height:8px;background:var(--warm);border-radius:var(--r-pill);overflow:hidden;}
.prog > i{display:block;height:100%;width:0;background:var(--accent);border-radius:var(--r-pill);transition:width .5s ease;}
.prog-label{font-size:12px;color:var(--ink-soft);font-weight:500;min-width:38px;text-align:right;}
/* ---------- Hero ---------- */
.hero{border-radius:var(--r-lg);padding:var(--s7) var(--s5);margin-bottom:var(--s5);
  background:
    radial-gradient(120% 140% at 0% 0%, rgba(0,117,222,0.10), rgba(0,117,222,0) 55%),
    radial-gradient(120% 140% at 100% 0%, rgba(26,174,57,0.08), rgba(26,174,57,0) 50%),
    var(--warm);
  border:1px solid var(--line-soft);}
.hero h1{margin:0 0 var(--s2);font-size:34px;line-height:1.05;font-weight:700;letter-spacing:-1.4px;}
.hero p{margin:0;color:var(--ink-soft);font-size:16px;max-width:46ch;}
.hero .facts{display:flex;gap:var(--s4);margin-top:var(--s4);flex-wrap:wrap;}
.hero .fact{font-size:13px;color:var(--ink-soft);}
.hero .fact b{display:block;font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-0.5px;}
/* ---------- Section blocks (left-aligned reading flow) ---------- */
.block{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:var(--s5);margin-bottom:var(--s4);box-shadow:var(--sh-card);}
.block h2{margin:0 0 var(--s2);font-size:22px;font-weight:700;letter-spacing:-0.6px;}
.block .lead{margin:0 0 var(--s4);color:var(--ink-soft);font-size:15px;}
.kicker{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.6px;
  color:var(--accent);margin:0 0 var(--s2);}
/* ---------- Buttons ---------- */
.btn{display:block;width:100%;border:none;border-radius:var(--r-pill);
  padding:16px var(--s5);font-size:16px;font-weight:600;cursor:pointer;
  font-family:inherit;transition:transform .08s, background .15s, filter .15s;
  margin-top:var(--s3);text-align:left;line-height:1.3;}
.btn:active{transform:scale(.985);}
.btn-primary{background:var(--accent);color:#fff;box-shadow:var(--sh-btn);}
.btn-primary:hover{background:var(--accent-dark);}
.btn-ghost{background:var(--warm);color:var(--ink);}
.btn-ghost:hover{background:var(--accent-soft);}
.btn-soft{background:var(--accent-soft);color:var(--accent-dark);}
.btn-ok{background:var(--ok);color:#fff;}
.btn-ok:hover{filter:brightness(.95);}
.btn .sub{display:block;font-size:13px;font-weight:500;opacity:.85;margin-top:2px;}
.btn-row{display:flex;gap:var(--s2);}
.btn-row .btn{margin-top:var(--s3);}
/* Balance buttons on wide screens — cap + center instead of stretched pills */
@media (min-width:560px){
  .block > .btn, .btn-row .btn{width:auto;min-width:320px;margin-left:auto;margin-right:auto;text-align:center;}
}
/* ---------- Sign card (visual-first) ---------- */
.signcard{display:flex;flex-wrap:wrap;gap:var(--s4);align-items:flex-start;padding:var(--s4);
  border:1px solid var(--line-soft);border-radius:var(--r-std);margin-bottom:var(--s3);
  background:var(--paper);}
.signcard .art{flex:none;width:96px;height:96px;display:grid;place-items:center;
  background:var(--warm);border-radius:var(--r-std);}
.signcard .body{flex:1 1 0;min-width:min(100%,170px);}
.signcard .name{display:flex;flex-wrap:wrap;align-items:center;column-gap:8px;row-gap:6px;
  font-weight:700;font-size:17px;letter-spacing:-0.3px;color:var(--ink);}
.signcard .fam{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:0.5px;padding:2px 8px;border-radius:var(--r-pill);white-space:normal;
  overflow-wrap:break-word;max-width:100%;}
.signcard .name .speak{flex:none;margin-left:auto;}
.fam-red{background:var(--err-soft);color:var(--err);}
.fam-tri{background:var(--warn-soft);color:var(--warn);}
.fam-blue{background:var(--accent-soft);color:var(--accent-dark);}
.fam-info{background:var(--ok-soft);color:var(--ok);}
.signcard .mean{margin:4px 0 0;font-size:14px;color:var(--ink-soft);}
.signcard .analogy{margin:6px 0 0;font-size:13px;color:var(--ink);background:var(--warm);
  padding:6px 10px;border-radius:var(--r-micro);}
/* ---------- Story cards (rules) ---------- */
.story{border-left:3px solid var(--accent);background:var(--warm);
  padding:var(--s3) var(--s4);border-radius:0 var(--r-std) var(--r-std) 0;margin-bottom:var(--s3);}
.story .q{font-weight:600;font-size:16px;margin:0 0 4px;}
.story .a{font-size:14px;color:var(--ink-soft);margin:0;}
/* ---------- Quiz ---------- */
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);
  background:var(--paper);border-radius:var(--r-std);padding:14px var(--s4);font-size:16px;
  margin-bottom:var(--s2);cursor:pointer;font-family:inherit;color:var(--ink);
  transition:border-color .12s, background .12s;}
.opt:active{border-color:var(--accent);}
.opt.correct{border-color:var(--ok);background:var(--ok-soft);}
.opt.wrong{border-color:var(--err);background:var(--err-soft);}
.opt.disabled{pointer-events:none;}
.feedback{padding:12px var(--s4);border-radius:var(--r-std);margin:var(--s3) 0;font-size:14px;}
.feedback.ok{background:var(--ok-soft);color:#0f6b22;}
.feedback.no{background:var(--err-soft);color:#9a3d00;}
/* ---------- Markings + misc ---------- */
.mini{border:1px solid var(--line-soft);border-radius:var(--r-std);padding:var(--s3) var(--s4);
  margin-bottom:var(--s2);background:var(--paper);}
.mini .t{font-weight:600;font-size:15px;}
.mini .d{font-size:14px;color:var(--ink-soft);margin-top:2px;}
/* ---------- Results ---------- */
.result-title{font-size:28px;font-weight:700;letter-spacing:-0.8px;margin:0 0 4px;}
.result-sub{color:var(--ink-soft);margin:0 0 var(--s4);font-size:15px;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);margin:var(--s4) 0;}
.stat{background:var(--warm);border-radius:var(--r-std);padding:var(--s3);text-align:center;}
.stat .n{font-size:22px;font-weight:700;letter-spacing:-0.5px;}
.stat .l{font-size:12px;color:var(--ink-soft);margin-top:2px;}
/* ---------- Back bar ---------- */
.backbar{position:sticky;top:0;z-index:30;background:var(--paper);
  border-bottom:1px solid var(--line-soft);padding:10px var(--s4);
  display:flex;align-items:center;gap:var(--s3);}
.backbar button{background:none;border:none;font-size:22px;cursor:pointer;color:var(--ink-soft);padding:4px 6px;}
.backbar .ttl{font-weight:700;font-size:16px;}
.backbar .sc{margin-left:auto;font-size:13px;color:var(--ink-soft);font-weight:500;}
/* ---------- Progress rings (readiness) ---------- */
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);margin:var(--s4) 0;}
.ring{--val:0;width:72px;height:72px;margin:0 auto 6px;border-radius:50%;
  background:conic-gradient(var(--accent) calc(var(--val)*1%), var(--warm) 0);display:grid;place-items:center;}
.ring::before{content:'';width:56px;height:56px;border-radius:50%;background:var(--paper);}
.ring span{position:absolute;font-size:15px;font-weight:700;}
.ringwrap{text-align:center;}
.ringwrap .rt{font-size:12px;color:var(--ink-soft);font-weight:600;}
/* ---------- Streak ---------- */
.streak{display:flex;align-items:center;justify-content:center;gap:var(--s2);background:var(--warm);
  border:1px solid var(--line-soft);border-radius:var(--r-pill);padding:8px var(--s4);font-size:14px;font-weight:600;margin-bottom:var(--s3);}
.streak .flame{font-size:18px;}
/* ---------- Flashcards ---------- */
.flash-stage{perspective:1200px;margin:var(--s4) 0;}
.flash-card{position:relative;width:100%;min-height:220px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer;}
.flash-card.flip{transform:rotateY(180deg);}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);
  border-radius:var(--r-lg);background:var(--paper);box-shadow:var(--sh-card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--s5);text-align:center;}
.flash-back{transform:rotateY(180deg);background:var(--accent-soft);}
.flash-back .mean{color:var(--ink);font-size:16px;font-weight:600;margin-top:var(--s2);}
.flash-back .analogy{margin-top:var(--s2);font-size:14px;color:var(--ink-soft);}
.flash-back .hint{position:absolute;top:var(--s2);right:var(--s2);font-size:11px;font-weight:700;color:var(--accent-dark);text-transform:uppercase;letter-spacing:.5px;}
.flash-ctl{display:flex;gap:var(--s2);margin-top:var(--s3);}
@media (prefers-reduced-motion: reduce){.flash-card{transition:none;}}
/* ---------- Memory tricks ---------- */
.mem{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s4);border:1px solid var(--line-soft);
  border-radius:var(--r-std);margin-bottom:var(--s3);background:var(--paper);}
.mem .t2{flex:none;width:40px;height:40px;border-radius:var(--r-pill);background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:18px;}
.mem .tt{font-weight:700;font-size:15px;letter-spacing:-0.2px;}
.mem .tn{margin:2px 0 0;font-size:14px;color:var(--ink-soft);}
/* ---------- Stopping table ---------- */
.span-table{width:100%;border-collapse:collapse;font-size:14px;margin:var(--s3) 0;}
.span-table th,.span-table td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line-soft);}
.span-table th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);}
.span-table td:first-child{font-weight:700;}
.span-table tr:last-child td{border-bottom:none;}
/* ---------- Timer ---------- */
.timer{position:sticky;top:0;z-index:31;background:var(--paper);border-bottom:1px solid var(--line-soft);
  padding:8px var(--s4);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:space-between;}
.timer .ttl{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;}
.timer .time{font-variant-numeric:tabular-nums;}
.timer.warn .time{color:var(--err);}
/* ---------- Utility ---------- */
.hidden{display:none!important;}
.center{text-align:center;}
.footnote{text-align:center;font-size:12px;color:var(--ink-faint);margin-top:var(--s5);line-height:1.5;}
.badge-xl{font-size:60px;text-align:center;margin:6px 0 2px;}
/* ---------- Cheat sheet (print) ---------- */
.cheat h3{margin:var(--s5) 0 6px;font-size:17px;letter-spacing:-0.3px;}
.cheat ul{margin:0;padding-left:20px;}
.cheat li{margin-bottom:6px;font-size:15px;}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--r-pill);margin-right:6px;text-transform:uppercase;letter-spacing:.4px;}
.tag-r{background:var(--err-soft);color:var(--err);}
.tag-t{background:var(--warn-soft);color:var(--warn);}
.tag-b{background:var(--accent-soft);color:var(--accent-dark);}
.tag-g{background:var(--ok-soft);color:var(--ok);}
/* ---------- Confetti ---------- */
.confetti{position:fixed;top:-12px;width:9px;height:14px;opacity:.9;z-index:999;pointer-events:none;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0;}}
@media (prefers-reduced-motion: reduce){.confetti{display:none;}.prog>i{transition:none;}}
/* focus visibility */
a:focus-visible,button:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
@media print{
  .topbar,.backbar,.btn,.footnote,.no-print{display:none!important;}
  .wrap{max-width:100%;padding:0 12px;}
  .block,.signcard,.mini,.story{box-shadow:none;border-color:#ccc;break-inside:avoid;}
  body{font-size:12px;}
}
/* Real SADC sign assets — consistent render */
.signsvg{width:100%;height:100%;display:block;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(23,19,15,.12));}
.question-art{width:min(100%,180px);height:180px;margin:0 auto 16px;display:grid;place-items:center;background:#fff;border:1px solid var(--line-soft);border-radius:12px;padding:12px;box-sizing:border-box;}
.question-art .signsvg{width:100%;height:100%;}
@media(max-width:520px){.question-art{width:144px;height:144px;}}

/* Render a simplified sign study illustration from its asset path. */
function signImg(svg){
  if(typeof svg==='function') return svg();
  if(typeof svg==='string' && svg.endsWith('.svg')) return '<img class="signsvg" src="'+svg+'" alt="" width="88" height="88" >';
  return svg;
}

function selectPaper(pool,count,series){
  // Rotate three disjoint item rosters; later sittings revisit concepts.
  if(pool.length<count*3)throw Error('Question pool too small for three distinct papers');
  const width=Math.ceil(pool.length/4),spread=[];
  for(let i=0;i<width;i++)for(let lane=0;lane<4;lane++){
    const item=pool[i+lane*width];if(item)spread.push(item);
  }
  const start=((Math.max(1,series)-1)*count)%spread.length;
  return shuffle(Array.from({length:count},(_,i)=>spread[(start+i)%spread.length]));
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
/* Shuffle option order AND return the new index of the correct answer (never hard-coded). */
function shufOpts(opts, correctIdx){
  const tagged=opts.map((o,i)=>({o,i}));
  const sh=shuffle(tagged);
  return {opts:sh.map(x=>x.o), ans: sh.findIndex(x=>x.i===correctIdx)};
}
function signQuestion(sign){
  const related=shuffle(SIGNS.filter(x=>x.id!==sign.id&&x.fam===sign.fam));
  const others=shuffle(SIGNS.filter(x=>x.id!==sign.id&&x.fam!==sign.fam));
  const wrongs=[...related,...others].slice(0,3).map(x=>x.name);
  const opts=shuffle([sign.name,...wrongs]);
  return {q:'What does this sign mean?',svg:signImg(sign.svg),opts,ans:opts.indexOf(sign.name),ex:sign.mean};
}
/* Build 3 plausible-but-wrong options for a rules question, avoiding the correct answer
   and avoiding duplicates. Mixes real content (other rule answers) with sensible decoys so
   the wrong answers read like a real multiple-choice test, not "The opposite". */
function ruleWrongs(rule){
  // Prefer the rule's curated wrong-answer array (topic-relevant, similar-but-not-identical).
  if(rule && rule.w && rule.w.length>=3){ return shuffle(rule.w.slice(0,3)); }
  const correct=rule && rule.a ? rule.a : rule;
  const pool=[];
  RULES.forEach(r=>{ if(r.a!==correct) pool.push(r.a); });
  const decoys=['At least 5 seconds behind','The car on your left goes first','Drive on the right','120 km/h','Stop only if a police officer signals','0.05 g per 100 ml for everyone','At least 1 second behind','Green means go without looking'];
  const out=new Set();
  shuffle(pool).forEach(x=>{ if(out.size<2 && !out.has(x)) out.add(x); });
  shuffle(decoys).forEach(x=>{ if(out.size<3 && !out.has(x)) out.add(x); });
  return [...out].slice(0,3);
}
function buildMock(){
 const m=[];
 SIGNS.forEach(s=>m.push({type:'sign',...signQuestion(s)}));
 MARKINGS.forEach(mk=>{
   const wrongs=shuffle(MARKINGS.filter(x=>x!==mk).map(x=>x.d)).slice(0,3);
   const opts=shuffle([mk.d,...wrongs]);
   m.push({type:'mark',q:mk.t+' — what does it mean?',opts,ans:opts.indexOf(mk.d),ex:mk.tip});
 });
 RULES.forEach(r=>{
   const opts=shuffle([r.a,...ruleWrongs(r)]);
   m.push({type:'rule',q:r.q,opts,ans:opts.indexOf(r.a),ex:r.a});
 });
 CONTROLS.forEach(c=>{const so=shufOpts(c.opts,c.ans);m.push({type:'ctrl',q:c.q,opts:so.opts,ans:so.ans,ex:c.ex});});
 MOCK_EXTRA.forEach(e=>{const so=shufOpts(e.opts,e.ans);m.push({type:'extra',q:e.q,opts:so.opts,ans:so.ans,ex:e.ex});});
 return shuffle(m).slice(0,40);
}

    ['At an uncontrolled intersection, a vehicle approaches from your right. What do you do?',{q:RULE_VARIANTS.find(x=>x.q.startsWith('At an uncontrolled junction,')).q,a:RULE_VARIANTS.find(x=>x.q.startsWith('At an uncontrolled junction,')).opts[0],ex:RULE_VARIANTS.find(x=>x.q.startsWith('At an uncontrolled junction,')).ex}],

  };

  state.review=[...reviewed.values()];
  state.bookmarks=Object.fromEntries(Object.entries(state.bookmarks).map(([key,original])=>{const item=refresh(original);return [item!==original?keyFor(item):key,item];}));
  if(Array.isArray(state.activeAssessment?.questions))state.activeAssessment.questions=state.activeAssessment.questions.map(refresh);
  if(Array.isArray(state.roadPractice?.questions))state.roadPractice.questions=state.roadPractice.questions.map(refresh);

const TTS = (()=>{
  function ok(){return typeof speechSynthesis!=='undefined';}
  function pickVoice(){
    if(!ok())return null;
    const vs=speechSynthesis.getVoices();
    if(!vs||!vs.length)return null;
    const prefs=[
      v=>/en[-_]ZA/i.test(v.lang)&&/male/i.test(v.name), // prefer SA male
      v=>/en[-_]ZA/i.test(v.lang),
      v=>/en[-_]GB/i.test(v.lang),
      v=>/en[-_]US/i.test(v.lang)&&/male/i.test(v.name),
      v=>v.lang.startsWith('en')
    ];
    for(const match of prefs){const f=vs.find(match);if(f)return f;}
    return vs[0];
  }
  function stop(){if(ok())speechSynthesis.cancel();}
  function speak(text){ 
    if(!ok()||!text)return;
    stop();
    const u=new SpeechSynthesisUtterance(text);
    const v=pickVoice(); if(v)u.voice=v;
    u.lang=(v&&v.lang)||'en-ZA';
    u.rate=+(state.rate||1);
    u.pitch=1;
    speechSynthesis.speak(u);
  }
  if(ok()){speechSynthesis.onvoiceschanged=()=>{}; speechSynthesis.getVoices();}
  return {ok,speak,stop};
})();

function touch(){
  const today=dayKey();
  if(state.lastDay===today) return;
  const y=new Date(); y.setDate(y.getDate()-1);
  const yes=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
  state.streak = (state.lastDay===yes) ? (state.streak||0)+1 : 1;
  state.lastDay=today;
  save();
}

/* Compact, searchable readers retain the entire bank without an unbounded page. */
function mountStudyReader(container,{items,render,key='study',noun='items',size=6,grid='lesson-grid',check=null}){
  let page=0;
  container.innerHTML=`<div class="reader-tools"><label for="${key}Search">Search ${noun}<input type="search" id="${key}Search" placeholder="Find a word or topic" autocomplete="off"></label></div><p class="reader-count" role="status" aria-live="polite"></p><div class="${grid} reader-results" tabindex="-1"></div><nav class="reader-pages" aria-label="${noun} pages"><button type="button" class="reader-prev">← Previous</button><span class="reader-page"></span><button type="button" class="reader-next">${check?'Continue →':'Next →'}</button></nav>${check?'<button type="button" class="btn btn-primary reader-check hidden">Start the 10-question check →</button>':''}`;
  const search=container.querySelector('input'),results=container.querySelector('.reader-results'),prev=container.querySelector('.reader-prev'),next=container.querySelector('.reader-next');
  function paint(focus=false){const q=search.value.trim().toLowerCase(),all=items.filter(x=>JSON.stringify(x).toLowerCase().includes(q)),pages=Math.max(1,Math.ceil(all.length/size));page=Math.min(page,pages-1);results.innerHTML=all.slice(page*size,(page+1)*size).map(render).join('')||'<p class="empty-state">No matches. Try another word or clear your search.</p>';container.querySelector('.reader-count').textContent=all.length?`${page*size+1}–${Math.min((page+1)*size,all.length)} of ${all.length} ${noun}`:`No matching ${noun}`;container.querySelector('.reader-page').textContent=`Page ${page+1} of ${pages}`;prev.disabled=page===0;next.disabled=page>=pages-1;if(check){next.classList.toggle('hidden',page>=pages-1);container.querySelector('.reader-check').classList.toggle('hidden',page<pages-1||!all.length);}bindTTS(results);bindArtExpansion(results);if(focus){results.focus({preventScroll:true});container.scrollIntoView({block:'start'});}}
  if(check)container.querySelector('.reader-check').addEventListener('click',check);search.addEventListener('input',()=>{page=0;paint();});prev.addEventListener('click',()=>{page--;paint(true);});next.addEventListener('click',()=>{page++;paint(true);});paint();
}

let shortPracticeActive=false;
function confirmShortLeave(){if(!shortPracticeActive)return true;if(!window.confirm('Leave this short practice? Recorded answers stay in your history, but this set will restart.'))return false;shortPracticeActive=false;return true;}
window.addEventListener('beforeunload',e=>{if(shortPracticeActive){e.preventDefault();e.returnValue='';}});
function quizFlow(questions,sessNum,title){
  practiceStartedAt=Date.now();
  shortPracticeActive=true;
  const missed=[];let i=0,correct=0,total=questions.length;
  function render(){
    if(i>=total){finishQuiz(sessNum,title,correct,total,mistakeKeys(missed));return;}
    const q=questions[i];
    const card=ce('div');card.className='block';
    card.innerHTML=`<p class="kicker">Question ${i+1} of ${total}</p>
      ${q.svg?`<div class="question-art">${q.svg}</div>`:''}<h2 class="question-title">${q.q}</h2>
      <div>${q.opts.map((o,idx)=>`<button class="opt" type="button" data-i="${idx}">${o}</button>`).join('')}</div>
      <div class="feedback hidden" role="status" aria-live="polite"></div>
      ${bookmarkButton(q)}${evidence(q)}
      <button class="btn btn-primary next hidden">Next →</button>`;
    app.innerHTML=backbar(title,`Q ${i+1}/${total}`);
    app.appendChild(card);
    const fb=card.querySelector('.feedback'),next=card.querySelector('.next');
    card.querySelectorAll('.opt').forEach(b=>{
      b.addEventListener('click',()=>{
        if(b.disabled)return;
        const ch=+b.getAttribute('data-i');
        card.querySelectorAll('.opt').forEach(x=>{x.disabled=true;x.classList.add('disabled');});
        recordAttempt(q,ch===q.ans);if(ch===q.ans){b.classList.add('correct');correct++;fb.className='feedback ok';fb.textContent='Correct. '+q.ex;}
        else{b.classList.add('wrong');card.querySelectorAll('.opt')[q.ans].classList.add('correct');fb.className='feedback no';fb.textContent='Review this. '+q.ex;addReview(q);missed.push(q);}
        renderAnswerTools(card,q);next.classList.remove('hidden');focusPracticeContent();
      });
    });
    next.addEventListener('click',()=>{i++;render();window.scrollTo(0,0);});
    bindBookmark(card,q);bindGo();
  }
  render();
  window.scrollTo(0,0);
}
function finishQuiz(sessNum,title,correct,total,missed=[]){
  recordOutcome('topic-check-'+sessNum,correct,total);
  shortPracticeActive=false;
  K.state.sessions[sessNum]=true;K.state.mastery=K.state.mastery||{};K.state.mastery[sessNum]=Math.round(correct/total*100);K.save();
  const pct=Math.round(correct/total*100);
  app.innerHTML=backbar(title)+`<div class="block center">
    <div class="badge-xl">${pct>=70?'🎉':'💪'}</div>
    <div class="result-title" role="status">${title} done</div>
    <p class="result-sub">You scored ${correct}/${total} (${pct}%)</p>
    <div class="stat-grid">
      <div class="stat"><div class="n">${correct}</div><div class="l">Correct</div></div>
      <div class="stat"><div class="n">${total-correct}</div><div class="l">To review</div></div>
      <div class="stat"><div class="n">${pct}%</div><div class="l">Score</div></div>
    </div>
    ${pct>=70?'<p>Great work — you understand the key ideas.</p>':'<p>Glance at the ones you missed. They are saved for review.</p>'}
    ${retryMissedButton(missed)}${sessNum<3?`<button class="btn ${missed.length?'btn-soft':'btn-primary'}" data-go="session${sessNum+1}">Next session →</button>`:`<button class="btn ${missed.length?'btn-soft':'btn-primary'}" data-go="mock">Take the Mock Test 🏁</button>`}
    ${!missed.length&&K.state.review.length?`<button class="btn btn-soft" id="revBtn">Review weak spots (${K.state.review.length})</button>`:''}
    ${K.state.vehicleCode==='2'?`<button class="btn btn-soft" data-practice-mode="${({1:'signs',2:'rules',3:'controls'})[sessNum]}">Practise these decisions</button>`:''}
    <button class="btn btn-ghost" data-go="home">Back to home</button>
  </div>`;
  bindMissed(missed);if($('#revBtn'))$('#revBtn').addEventListener('click',openReview);
  if(pct>=70)confetti();bindGo();
}

function safeHTML(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function reviewArt(svg){const decision=String(svg||'').match(/(?:^|src=["'])assets\/decision\/art\/([SRCO][0-9]{2})\.svg(?:$|["'])/);if(decision)return `<img class="decision-art" src="assets/decision/art/${decision[1]}.svg" alt="Saved decision illustration" loading="lazy">`;const match=String(svg||'').match(/assets\/signs\/[a-z0-9-]+\.svg/);return match?signImg(match[0]):'';}
function reviewKey(q){return (q.svg||'')+'|'+q.q+'|'+q.opts[q.ans];}
const TOPIC_PATTERNS=[
 ['Signs and signals',/sign|signal|robot|warning|speed limit|pedestrian man/i],
 ['Parking and stopping',/park|stop|kerb|hydrant|breakdown|triangle/i],
 ['Priority and crossings',/yield|give way|right.of.way|crossing|roundabout|intersection|junction/i],
 ['Speed and distance',/speed|distance|overtak|follow|brak/i],
 ['Visibility and lights',/headlight|light|visibility|mirror|wiper/i],
 ['Vehicle controls',/pedal|clutch|gear|steer|throttle|horn|hooter|indicator|accelerator|control/i],
 ['Safety and legal duties',/learner|licence|alcohol|phone|seatbelt|fuel|trailer|tow/i]
];
function questionCode(q){const title=typeof q==='string'?q:q.q;if((typeof q==='object'&&q.decisionId)||Object.values(K.state.attempts).some(a=>a.code==='2'&&a.q===title)||K.state.review.some(r=>r.decisionId&&r.q===title))return '2';return K.CONTROLS.some(c=>c.q===title)?'2':K.MOTORCYCLE_CONTROLS.some(c=>c.q===title)?'1':K.HEAVY_CONTROLS.some(c=>c.q===title)?'3':null;}
function visibleForCode(q){const code=questionCode(q);return !code||code===K.state.vehicleCode;}
function topicFor(q){if(q.decisionId&&K.state.attempts['decision:'+q.decisionId])return K.state.attempts['decision:'+q.decisionId].topic;if(q.svg||K.SIGN_VARIANTS.some(c=>c.q===q.q))return 'Signs and signals';if([...K.CONTROLS,...K.MOTORCYCLE_CONTROLS,...K.HEAVY_CONTROLS,...K.CONTROL_VARIANTS].some(c=>c.q===q.q))return 'Vehicle controls';return (TOPIC_PATTERNS.find(([,re])=>re.test(q.q))||['Rules of the road'])[0];}
function topicStats(){const out={};Object.values(K.state.attempts).filter(a=>visibleForCode(a.q)).forEach(a=>{const t=a.topic||'Rules of the road';const row=out[t]||{topic:t,correct:0,wrong:0,items:0};row.correct+=a.correct;row.wrong+=a.wrong;row.items++;out[t]=row;});return Object.values(out).sort((a,b)=>(b.wrong/(b.wrong+b.correct+1))-(a.wrong/(a.wrong+a.correct+1)));}
const VARIANT_LINKS=[
 ['When refuelling','When refuelling, the engine must be…'],
 ['While the vehicle is moving, may you hold a cell phone?','A cell phone while driving — what is the rule?'],
 ['A pedestrian is crossing on your half','A pedestrian is crossing your half'],
 ['What does a YELLOW kerb line mean?','No parking yellow line'],
 ['What does a BROKEN','Broken (dashed) white line']
];
function variantFor(q){
 if(q.svg){const sign=K.SIGNS.find(s=>q.svg.includes(s.svg));if(!sign)return null;const v=K.signQuestion(sign);v.q='Which action or restriction does this sign show?';v.ex=sign.analogy+' '+sign.mean;return v;}
 const pair=VARIANT_LINKS.find(([a,b])=>q.q.startsWith(a)||q.q.startsWith(b));if(!pair)return null;
 const other=q.q.startsWith(pair[0])?pair[1]:pair[0];
 const extra=K.MOCK_EXTRA.find(x=>x.q.startsWith(other));if(extra){const so=K.shufOpts(extra.opts,extra.ans);return {q:extra.q,opts:so.opts,ans:so.ans,ex:extra.ex};}
 const rule=K.RULES.find(x=>x.q.startsWith(other));if(rule){const opts=K.shuffle([rule.a,...K.ruleWrongs(rule)]);return {q:rule.q,opts,ans:opts.indexOf(rule.a),ex:rule.a};}
 return null;
}
function optionRationale(q){
 const wrong=q.opts.map((o,i)=>({o,i})).filter(x=>x.i!==q.ans);
 const signMeanings=wrong.map(({o})=>({o,sign:K.SIGNS.find(s=>s.name===o)}));
 if(signMeanings.every(x=>x.sign))return `<details class="d"><summary>Compare the signs</summary><ul>${signMeanings.map(({o,sign})=>`<li><b>${safeHTML(o)}</b>: ${safeHTML(sign.mean)}</li>`).join('')}</ul></details>`;
 return `<details class="d"><summary>Review the answer</summary><p>The answer here is <b>${safeHTML(q.opts[q.ans])}</b>. ${safeHTML(q.ex||'')} Check the linked manual topic for the exact rule and its conditions.</p></details>`;
}
function renderAnswerTools(card,q,back='review'){
  if(!card.querySelector('[data-question-report]')){const report=ce('details');report.className='question-source';report.dataset.questionReport='true';report.innerHTML='<summary>Report a problem with this question</summary><p>Check the source first. You can open a report on GitHub, review the text, then submit it. No progress or personal details are sent automatically.</p>';const link=ce('a');link.textContent='Open question report ↗';link.target='_blank';link.rel='noopener noreferrer';link.href='https://github.com/buttercode101/Greenlight-k53/issues/new?title='+encodeURIComponent('Question review: '+q.q.slice(0,100))+'&body='+encodeURIComponent('Question: '+q.q+'\nSelected code: '+K.state.vehicleCode+'\nExpected answer shown: '+q.opts[q.ans]+'\nExplanation: '+(q.ex||'')+'\n\nWhat seems incorrect?\nSource supporting a correction:');report.appendChild(link);card.appendChild(report);}

 const fb=card.querySelector('.feedback');fb.insertAdjacentHTML('afterend',optionRationale(q));
 const v=variantFor(q);if(v&&!assessmentActive){const button=ce('button');button.className='btn btn-soft';button.type='button';button.textContent='Practise another version';button.addEventListener('click',()=>practiceVariant(v,back));fb.after(button);}
}
function practiceVariant(q,back='review'){
 if(!confirmShortLeave())return;
 const signPractice=back==='signlibrary'||back==='concepts';
 app.innerHTML=backbar(signPractice?'Sign practice':'Another version')+`<div class="block"><p class="kicker">${signPractice?'Recognise the sign':'Same idea, different wording'}</p>${q.svg?`<div class="question-art">${q.svg}</div>`:''}<h2>${safeHTML(q.q)}</h2>${q.opts.map((o,i)=>`<button class="opt" type="button" data-i="${i}">${safeHTML(o)}</button>`).join('')}<div class="feedback hidden" role="status"></div>${evidence(q)}<button class="btn btn-ghost" data-go="${back}">${back==='signlibrary'?'Back to sign atlas':back==='concepts'?'Back to concept focus':'Back to review'}</button></div>`;
 const card=app.querySelector('.block');card.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;const ok=Number(b.dataset.i)===q.ans;card.querySelectorAll('.opt').forEach(x=>x.disabled=true);b.classList.add(ok?'correct':'wrong');if(!ok){card.querySelectorAll('.opt')[q.ans].classList.add('correct');addReview(q);}recordAttempt(q,ok);const fb=card.querySelector('.feedback');fb.className='feedback '+(ok?'ok':'no');fb.textContent=q.ex;renderAnswerTools(card,q,back);focusPracticeContent();}));bindGo();
}
function recordAttempt(q,ok){
  if(q.decisionId&&K.recordDecisionQuestion){K.recordDecisionQuestion(q,ok);syncPracticeProgress();return;}
  const key=reviewKey(q), row=K.state.attempts[key]||{q:q.q,topic:topicFor(q),correct:0,wrong:0,last:0};
  const now=Date.now(),previous=row.last;
  if(row.correct+row.wrong===0){row.firstOk=!!ok;row.firstAt=now;}
  if(ok&&row.lastOk===true&&Number.isFinite(previous)&&now-previous>=86400000)row.retainedAt=now;
  if(!ok)delete row.retainedAt;
  row.recent=[...(Array.isArray(row.recent)?row.recent.filter(x=>typeof x==='boolean'):[]),!!ok].slice(-5);row.lastOk=!!ok;
  row.correct+=ok?1:0;row.wrong+=ok?0:1;row.last=now;row.topic=topicFor(q);row.svg=q.svg||'';
  const sign=K.SIGNS.find(s=>q.svg&&q.svg.includes(s.svg));
  if(sign&&SITUATIONS.some(x=>x.sign===sign.id)){
    const history=K.state.conceptHistory=Array.isArray(K.state.conceptHistory)?K.state.conceptHistory:[];
    history.push({id:sign.id,variant:q.q,ok:!!ok,at:Date.now()});
    if(history.length>300)history.splice(0,history.length-300);
  }
  K.state.attempts[key]=row;K.save();syncPracticeProgress();
}
function bookmarkButton(q){
  const key=reviewKey(q),saved=!!K.state.bookmarks[key];
  return `<button class="btn btn-ghost bookmark" type="button" aria-pressed="${saved}">${saved?'★ Saved':'☆ Save question'}</button>`;
}
function bindBookmark(card,q){
  const b=card.querySelector('.bookmark');if(!b)return;
  b.addEventListener('click',()=>{const key=reviewKey(q);if(K.state.bookmarks[key])delete K.state.bookmarks[key];else K.state.bookmarks[key]={q:q.q,a:q.opts[q.ans],svg:q.svg||'',ex:q.ex||''};K.save();b.setAttribute('aria-pressed',!!K.state.bookmarks[key]);b.textContent=K.state.bookmarks[key]?'★ Saved':'☆ Save question';});
}
const MANUALS={rules:'https://www.natis.gov.za/index.php/downloads/learner-driver-manual/rules-of-the-road',signs:'https://www.natis.gov.za/index.php/downloads/learner-driver-manual/road-traffic-signs',controls:'https://www.natis.gov.za/index.php/downloads/learner-driver-manual/vehicle-controls'};
const SIGN_CODES={stop:'R1',giveway:'R2',noentry:'R3',robot:'W301',turnleft:'R108',keepleft:'R103',minspeed:'R101-60',headlightson:'R133',speed60:'R201',noovertake:'R214',nouturn:'R213',noleft:'R211',noright:'R212',nopark:'R216',nostop:'R217',buslane:'R302',taxilane:'R310',disablepark:'R323-P',children:'W308',curve:'W202',ped:'W307',animal:'W310',hill:'W322',slippery:'W333',speedbump:'W332',railway:'W317',narrow:'W328',rightofway:'IN7',crossroad:'W101',tjunction:'W104',yjunction:'W115',roundabout:'W201',pedcrossing:'W306',cyclist:'W309',wild:'W311',parking:'R305-P',toll:'R132',redman:'S11P',greenman:'S11P'};
function sourceFor(q){return [...K.CONTROLS,...K.MOTORCYCLE_CONTROLS,...K.HEAVY_CONTROLS,...K.CONTROL_VARIANTS].some(c=>c.q===q.q)||q.sec==='Controls'||q.type==='ctrl'?MANUALS.controls:K.SIGN_VARIANTS.some(c=>c.q===q.q)||q.svg||q.sec==='Signs'||q.type==='mark'||/marking|kerb line/i.test(q.q)?MANUALS.signs:MANUALS.rules;}
function evidence(q){if(q.decisionId&&q.source&&/^https:\/\/(?:www\.)?(?:rtmc\.co\.za|gov\.za|southafrica\.net|sanews\.gov\.za|tourism\.gov\.za)\//.test(q.source.url))return `<details class="question-source"><summary>Source &amp; review status</summary><p><a href="${safeHTML(q.source.url)}" target="_blank" rel="noopener noreferrer">${safeHTML(q.source.title)}</a> · ${safeHTML(q.source.section)}</p><p>${safeHTML(q.source.review)} · ${safeHTML(q.source.checked)}</p></details>`;const sign=K.SIGNS.find(s=>q.svg&&q.svg.includes(s.svg));const code=sign?` · illustrated sign ${safeHTML(SIGN_CODES[sign.id])}`:'';return `<details class="question-source"><summary>Source & review status</summary><p><a href="${sourceFor(q)}" target="_blank" rel="noopener noreferrer">NaTIS learner manual ↗</a>${code}</p><p>Selected practice material. Independent subject review is pending; use the official manual for complete coverage.</p></details>`;}

function addReview(q,answer){
  if(q&&typeof q==='object'&&q.decisionId)return; // Recorded atomically with its decision attempt.
  const item=typeof q==='string'?{q,a:answer}:q;
  const key=item.opts?reviewKey(item):item.q+'|'+item.a;
  const now=Date.now();
  let found=K.state.review.find(r=>r.key===key);
  if(!found){found={key,q:item.q,a:item.opts?item.opts[item.ans]:item.a,opts:item.opts||null,ans:item.ans,ex:item.ex||'',svg:item.svg||'',due:now,level:0,misses:0};K.state.review.push(found);}
  found.opts=item.opts||found.opts;
  found.ans=item.ans??found.ans;
  found.ex=item.ex||found.ex;
  found.svg=item.svg||found.svg;
  found.misses=(found.misses||0)+1;
  found.level=0;
  found.due=now;
  K.save();
}
function mistakeKeys(questions){return [...new Set(questions.map(q=>q.decisionId?'decision:'+q.decisionId:reviewKey(q)))].filter(key=>K.state.review.some(r=>r.key===key));}
function retryMissedButton(keys){return keys.length?`<button class="btn btn-primary" id="retryMissed" type="button">Review ${Math.min(10,keys.length)} missed question${keys.length===1?'':'s'}${keys.length>10?' · '+keys.length+' saved':''} →</button>`:'';}
function bindMissed(keys){const b=document.getElementById('retryMissed');if(b)b.addEventListener('click',()=>{currentArea='review';startReview(keys);window.scrollTo(0,0);});}
function reviewDue(){return K.state.review.filter(r=>visibleForCode(r.q)&&(r.decisionId||(Array.isArray(r.opts)&&r.opts.length>1&&Number.isInteger(r.ans)))&&r.due<=Date.now());}
function openReview(){
  currentArea='review';rememberView('review');
  const due=reviewDue();
  const visible=K.state.review.map((r,i)=>({r,i})).filter(({r})=>visibleForCode(r.q));
  const reviewMarkup=({r,i})=>`<article class="mini review-card"><div class="t"><span>${safeHTML(r.q)}</span></div>${r.svg?`<div class="review-art">${reviewArt(r.svg)}</div>`:''}<details class="d"><summary>Answer and saved question options</summary><p>Answer: ${safeHTML(r.a)}</p><button class="review-remove" data-remove="${i}" type="button" aria-label="Remove saved question">Remove from review</button></details>${r.decisionId||(Array.isArray(r.opts)&&Number.isInteger(r.ans))?`<button class="btn btn-soft review-retry" data-retry="${i}" type="button">Retry this question →</button>`:''}<p class="footnote">${r.due<=Date.now()?'Ready to retry':`Next review ${new Date(r.due).toLocaleDateString('en-ZA')}`}</p></article>`;
  const bookmarks=Object.values(K.state.bookmarks).filter(b=>visibleForCode(b.q));
  app.innerHTML=backbar('Review')+`<div class="block">
    <p class="kicker">Practice your mistakes</p><h2>Weak spots</h2>
    <p class="lead">${due.length} ready now · ${visible.length} saved. Retry missed questions; correct answers come back tomorrow, then after three and seven days. Progress stays on this device.</p>
    ${due.length?`<button class="btn btn-primary" id="reviewStart" type="button">Review ${Math.min(10,due.length)} question${due.length===1?'':'s'}${due.length>10?' · '+due.length+' due':''} →</button>`:''}
    <div id="reviewReader"></div>
    <details class="review-section"><summary>Saved questions · ${bookmarks.length}</summary><div id="bookmarkReader"></div></details>
    <details class="review-section"><summary>Topic weaknesses</summary><div class="lesson-grid">${topicStats().map(t=>`<div class="mini"><div class="t">${safeHTML(t.topic)}</div><p>${t.correct}/${t.correct+t.wrong} correct across ${t.items} concepts · ${t.wrong} misses</p></div>`).join('')||'<p>Finish a few practice questions to identify weak topics.</p>'}</div></details>
    <details class="review-section"><summary>Repeated mistakes</summary><div class="lesson-grid">${Object.entries(K.state.attempts).filter(([,a])=>visibleForCode(a.q)&&a.wrong).sort(([,a],[,b])=>b.wrong-a.wrong).slice(0,8).map(([key,a])=>`<div class="mini"><div class="t">${safeHTML(a.q)}</div>${reviewArt(a.svg||key)?`<div class="review-art">${reviewArt(a.svg||key)}</div>`:''}<p>${a.wrong} missed · ${a.correct} correct attempts</p></div>`).join('')||'<p>Your practice history will appear here.</p>'}</div></details>
    <button class="btn btn-ghost" data-go="home">Home</button>
  </div>`;
  if($('#reviewStart'))$('#reviewStart').addEventListener('click',()=>startReview(due.map(r=>r.key)));
  if(visible.length)mountStudyReader($('#reviewReader'),{key:'reviewStudy',items:visible,noun:'questions',size:8,grid:'review-grid',render:reviewMarkup});else $('#reviewReader').innerHTML='<p class="empty-state">No mistakes saved yet. Try a topic drill or a learning mock.</p>';
  if(bookmarks.length)mountStudyReader($('#bookmarkReader'),{key:'bookmarkStudy',items:bookmarks,noun:'saved questions',grid:'review-grid',render:b=>`<article class="mini"><div class="t">${safeHTML(b.q)}</div>${b.svg?`<div class="review-art">${reviewArt(b.svg)}</div>`:''}<details><summary>Answer and explanation</summary><p>${safeHTML(b.a)} · ${safeHTML(b.ex)}</p></details></article>`});else $('#bookmarkReader').innerHTML='<p>Save a question during practice to find it here.</p>';
  $('#reviewReader').addEventListener('click',e=>{const retry=e.target.closest('[data-retry]');if(retry){const r=K.state.review[Number(retry.dataset.retry)];if(r)startReview([r.key]);return;}const b=e.target.closest('[data-remove]');if(b){K.state.review.splice(Number(b.dataset.remove),1);K.save();openReview();}});
  bindGo();
}
function startReview(keys){
  keys=keys.slice(0,10);
  shortPracticeActive=true;
  let i=0,correct=0;
  const total=keys.length;
  function render(){
    if(i>=total){shortPracticeActive=false;rememberView('review');app.innerHTML=backbar('Review complete')+`<div class="block center"><h2>Review complete</h2><p>${correct}/${total} correct. Missed questions remain ready to practise; correct ones return on a later day.</p><button class="btn btn-primary" id="reviewReturn">View weak spots</button><button class="btn btn-ghost" data-go="home">Home</button></div>`;$('#reviewReturn').addEventListener('click',openReview);bindGo();return;}
    const r=K.state.review.find(item=>item.key===keys[i]);
    if(!r){i++;render();return;}
    if(r.decisionId){shortPracticeActive=false;openDecision({ids:[r.decisionId],title:'Review decisions',onComplete:result=>{shortPracticeActive=true;correct+=result.correct;i++;render();}});return;}
    rememberView('review');app.innerHTML=backbar('Weak spots',`${i+1}/${total}`)+`<div class="block"><p class="kicker">Retry ${i+1} of ${total}</p>${r.svg?`<div class="question-art">${reviewArt(r.svg)}</div>`:''}<h2>${safeHTML(r.q)}</h2><div>${r.opts.map((o,n)=>`<button class="opt" type="button" data-i="${n}">${safeHTML(o)}</button>`).join('')}</div><div class="feedback hidden" role="status" aria-live="polite"></div><button class="btn btn-primary next hidden" type="button">Next →</button></div>`;
    const buttons=app.querySelectorAll('.opt'),fb=app.querySelector('.feedback'),next=app.querySelector('.next');
    buttons.forEach(b=>b.addEventListener('click',()=>{
      if(b.disabled)return;
      const chosen=Number(b.dataset.i),ok=chosen===r.ans;
      buttons.forEach(x=>x.disabled=true);buttons[r.ans].classList.add('correct');
      recordAttempt({q:r.q,opts:r.opts,ans:r.ans,svg:r.svg},ok);if(!ok){b.classList.add('wrong');r.level=0;r.due=Date.now();r.misses=(r.misses||0)+1;}
      else{correct++;r.level=Math.min((r.level||0)+1,3);r.due=Date.now()+[0,1,3,7][r.level]*86400000;}
      K.save();fb.className='feedback '+(ok?'ok':'no');fb.textContent=(ok?'Correct. ':'Not yet. ')+(r.ex||'Answer: '+r.a);next.classList.remove('hidden');focusPracticeContent();
    }));
    next.addEventListener('click',()=>{i++;render();window.scrollTo(0,0);});bindGo();
  }
  render();
}

/* ---------- FLASHCARDS (repeat-within-session recall) ---------- */
let flashDeck=[];
let flashTotal=0,flashRemaining=[],flashRetry=[],flashSeen=0,flashKnown=0;
function flashPool(){
  const d=[];
  K.SIGNS.forEach(s=>d.push({front:signImg(s.svg),back:{t:s.name,mean:s.mean,extra:s.analogy},kind:'sign'}));
  K.MARKINGS.forEach(m=>d.push({front:m.t,back:{t:'Meaning',mean:m.d,extra:m.tip},kind:'mark'}));
  K.rulesForCode(K.state.vehicleCode).forEach(r=>d.push({front:r.q,back:{t:'Answer',mean:r.a},kind:'rule'}));
  K.controlsForCode(K.state.vehicleCode).forEach(c=>d.push({front:c.q,back:{t:'Answer',mean:c.ex},kind:'ctrl'}));
  K.extraForCode(K.state.vehicleCode).forEach(e=>d.push({front:e.q,back:{t:'Answer',mean:e.ex},kind:'extra'}));
  return d;
}
function openFlash(cat){
  currentArea='learn';
  flashDeck=K.shuffle(cat?cat.slice():flashPool()).map(x=>({...x,pass:false}));
  if(!flashDeck.length)flashDeck=K.shuffle(flashPool());
  flashRemaining=flashDeck.slice(10);flashDeck=flashDeck.slice(0,10);flashTotal=flashDeck.length;flashRetry=[];flashSeen=0;flashKnown=0;
  renderFlash();
}
function renderFlash(){
  if(!flashDeck.length){app.innerHTML=backbar('Flashcards')+`<section class="block"><p class="kicker">Round complete</p><h1>${flashSeen} cards reviewed</h1><p class="lead">${flashKnown} recalled · ${flashRetry.length} to revisit. Self-rated recall helps you study; it does not change your readiness score.</p>${flashRetry.length?'<button class="btn btn-primary" id="flashRetry">Review the cards marked Again →</button>':''}${flashRemaining.length?`<button class="btn ${flashRetry.length?'btn-soft':'btn-primary'}" id="flashMore">Next ${Math.min(10,flashRemaining.length)} cards →</button>`:''}<button class="btn btn-ghost" data-go="learn">Back to Learn</button></section>`;const start=cards=>{const remaining=flashRemaining.slice();openFlash(cards);flashRemaining=remaining;};$('#flashRetry')?.addEventListener('click',()=>start(flashRetry));$('#flashMore')?.addEventListener('click',()=>{const cards=flashRemaining.splice(0,10);start(cards);});bindGo();return;}
  const c=flashDeck[0];
  const front=c.kind==='sign'?`<div class="art" style="width:96px;height:96px;margin-bottom:var(--s3)">${c.front}</div><div style="font-size:14px;color:var(--ink-soft)">What is this? (tap card to flip)</div>`:`<div style="font-size:20px;font-weight:700;color:var(--ink)">${c.front}</div><div style="margin-top:var(--s3);font-size:14px;color:var(--ink-soft)">Tap to reveal the answer</div>`;
  app.innerHTML=backbar('Flashcards',flashDeck.length)+`
  <div class="block">
    <div class="flash-progress" aria-live="polite">Card ${flashSeen+1} of ${flashTotal} · short round</div>
    <div class="prog" aria-hidden="true"><i style="width:${Math.round((flashTotal-flashDeck.length)/flashTotal*100)}%"></i></div>
    <div class="flash-stage"><div class="flash-card" id="fc" role="button" tabindex="0" aria-label="Flip flashcard to reveal answer">
      <div class="flash-face" aria-hidden="false">${front}</div>
      <div class="flash-face flash-back" aria-hidden="true"><span class="hint">Answer</span>
        <div class="tt" style="font-size:19px;font-weight:700">${c.back.t}</div>
        <div class="mean">${c.back.mean}</div>
        ${c.back.extra?`<div class="analogy">💡 ${c.back.extra}</div>`:''}
      </div>
    </div></div>
    <div class="flash-ctl">
      <button class="btn btn-primary" id="flashGot" type="button" disabled style="margin-top:0">✓ Got it</button>
      <button class="btn btn-ghost" id="flashAgain" type="button" disabled style="margin-top:0">↻ Again</button>
    </div>
  </div>`;
  const flipCard=$('#fc');
  const flip=()=>{flipCard.classList.toggle('flip');$('#flashGot').disabled=false;$('#flashAgain').disabled=false;const on=flipCard.classList.contains('flip');flipCard.querySelector('.flash-face:not(.flash-back)').setAttribute('aria-hidden',on);flipCard.querySelector('.flash-back').setAttribute('aria-hidden',!on);flipCard.setAttribute('aria-label',flipCard.classList.contains('flip')?'Flip flashcard to show question':'Flip flashcard to reveal answer');};
  flipCard.addEventListener('click',flip);
  flipCard.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip();}});
  $('#flashGot').addEventListener('click',()=>{flashDeck.shift();flashSeen++;flashKnown++;renderFlash();});
  $('#flashAgain').addEventListener('click',()=>{const x=flashDeck.shift();flashRetry.push(x);flashSeen++;renderFlash();});
  bindGo();
}

function buildDrill(cat,limit=null){
  const q=[];
  if(cat==='signs'||cat==='mixed'){
    K.SIGNS.forEach(s=>q.push(K.signQuestion(s)));
    K.MARKINGS.forEach(mk=>{const wrong=K.shuffle(K.MARKINGS.filter(x=>x!==mk).map(x=>x.d)).slice(0,3);const opts=K.shuffle([mk.d,...wrong]);q.push({q:mk.t+' — what does it mean?',opts,ans:opts.indexOf(mk.d),ex:mk.tip});});
    K.SIGN_VARIANTS.forEach(s=>{const so=K.shufOpts(s.opts,s.ans);q.push({q:s.q,opts:so.opts,ans:so.ans,ex:s.ex});});
  }
  if(cat==='rules'||cat==='mixed')K.rulesForCode(K.state.vehicleCode).forEach(r=>{const opts=K.shuffle([r.a,...K.ruleWrongs(r)]);q.push({q:r.q,opts,ans:opts.indexOf(r.a),ex:r.a});});
  if(cat==='rules'||cat==='mixed')K.extraForCode(K.state.vehicleCode).forEach(c=>{const so=K.shufOpts(c.opts,c.ans);q.push({q:c.q,opts:so.opts,ans:so.ans,ex:c.ex});});
  if(cat==='controls'||cat==='mixed')[...K.controlsForCode(K.state.vehicleCode),...K.CONTROL_VARIANTS].forEach(c=>{const so=K.shufOpts(c.opts,c.ans);q.push({q:c.q,opts:so.opts,ans:so.ans,ex:c.ex});});
  if(K.decisionQuestions)q.push(...K.decisionQuestions(cat));
  const size=limit==='all'?q.length:Number(limit)||(cat==='mixed'?20:q.length);
  return selectPractice(q,size);
}
function selectPractice(pool,size){
  const unique=[...new Map(pool.map(q=>[q.decisionId?'decision:'+q.decisionId:reviewKey(q),q])).values()];
  const ranked=K.shuffle(unique).map(q=>{const a=K.state.attempts[q.decisionId?'decision:'+q.decisionId:reviewKey(q)];const priority=!a?0:(a.lastOk===false||(a.wrong>0&&!a.correct)?1:2);return {q,a,priority};}).sort((a,b)=>a.priority-b.priority||(a.a?.last||0)-(b.a?.last||0));
  return ranked.slice(0,Math.max(1,Math.min(size,ranked.length))).map(x=>x.q);
}

    const q=qs[i];const card=ce('div');card.className='block';
    card.innerHTML=`<p class="kicker">Question ${i+1} of ${total}</p>${q.svg?`<div class="question-art">${q.svg}</div>`:''}<h2 class="question-title">${q.q}</h2><div>${q.opts.map((o,idx)=>`<button class="opt" type="button" data-i="${idx}">${o}</button>`).join('')}</div><div class="feedback hidden" role="status" aria-live="polite"></div><button class="btn btn-primary next hidden" type="button">Next →</button>`;

    card.querySelectorAll('.opt').forEach(b=>{b.addEventListener('click',()=>{if(b.disabled)return;const ch=+b.getAttribute('data-i');card.querySelectorAll('.opt').forEach(x=>{x.disabled=true;x.classList.add('disabled');});recordAttempt(q,ch===q.ans);if(ch===q.ans){b.classList.add('correct');correct++;fb.className='feedback ok';}else{b.classList.add('wrong');card.querySelectorAll('.opt')[q.ans].classList.add('correct');fb.className='feedback no';addReview(q);missed.push(q);}fb.textContent=(ch===q.ans?'Correct. ':'Review this. ')+q.ex;renderAnswerTools(card,q);next.classList.remove('hidden');focusPracticeContent();});});
    next.addEventListener('click',()=>{i++;render();window.scrollTo(0,0);});
    bindBookmark(card,q);bindGo();
  }
}

/* Portable progress contains no unfinished exam or executable question markup. */
const PORTABLE_FIELDS=['vehicleCode','sessions','mastery','secPass','mockPass','mockResults','acc','attempts','review','bookmarks','codeProgress','diagnostic','outcomes'];
function cleanPortable(value,depth=0){
 if(depth>12)throw Error('Backup nesting is invalid.');
 if(value===null||typeof value==='boolean')return value;
 if(typeof value==='number'){if(!Number.isFinite(value)||Math.abs(value)>1e15)throw Error('Invalid number in backup.');return value;}
 if(typeof value==='string'){if(value.length>12000)throw Error('Backup text is too long.');return value;}
 if(Array.isArray(value)){if(value.length>5000)throw Error('Backup has too many entries.');return value.map(x=>cleanPortable(x,depth+1));}
 if(value&&typeof value==='object'){const pairs=Object.entries(value);if(pairs.length>5000)throw Error('Backup has too many entries.');const out=Object.create(null);for(const [key,v] of pairs){if(['__proto__','prototype','constructor'].includes(key))throw Error('Unsafe backup field.');if(v!==undefined)out[key]=cleanPortable(v,depth+1);}return out;}
 throw Error('Unsupported backup value.');
}
function portableSnapshot(){return cleanPortable(Object.fromEntries(PORTABLE_FIELDS.filter(k=>K.state[k]!==undefined).map(k=>[k,K.state[k]])));}
function validateBackup(text){
 if(text.length>2500000)throw Error('Choose a GreenLight backup smaller than 2.5 MB.');
 const data=cleanPortable(JSON.parse(text));
 if(data.product!=='GreenLight K53'||data.schema!==1||!data.progress||!['1','2','3'].includes(data.progress.vehicleCode))throw Error('This is not a supported GreenLight backup.');
 const out=Object.fromEntries(PORTABLE_FIELDS.filter(k=>data.progress[k]!==undefined).map(k=>[k,data.progress[k]]));
 const map=x=>x&&typeof x==='object'&&!Array.isArray(x);
 for(const field of ['sessions','mastery','secPass','mockResults','acc','attempts','bookmarks','codeProgress','diagnostic'])if(out[field]!==undefined&&!map(out[field]))throw Error('Invalid '+field+' in backup.');
 if(out.review!==undefined&&(!Array.isArray(out.review)||out.review.some(r=>!r||typeof r.q!=='string'||typeof r.key!=='string'||!Array.isArray(r.opts)||r.opts.some(o=>typeof o!=='string')||(!r.decisionId&&(!Number.isInteger(r.ans)||r.ans<0||r.ans>=r.opts.length)))))throw Error('Invalid review questions in backup.');
 for(const row of Object.values(out.attempts||{}))if(!map(row)||typeof row.q!=='string'||!Number.isFinite(row.correct)||row.correct<0||!Number.isFinite(row.wrong)||row.wrong<0)throw Error('Invalid attempt history in backup.');
 const count=v=>Number.isFinite(v)&&v>=0&&v<=1e9;
 const boolMap=(value,allowed)=>map(value)&&Object.entries(value).every(([k,v])=>allowed.includes(k)&&typeof v==='boolean');
 const mastery=value=>map(value)&&Object.entries(value).every(([k,v])=>['1','2','3'].includes(k)&&count(v)&&v<=100);
 if(out.sessions&&!boolMap(out.sessions,['1','2','3']))throw Error('Invalid topic checks.');
 if(out.mastery&&!mastery(out.mastery))throw Error('Invalid topic accuracy.');
 if(out.secPass&&!boolMap(out.secPass,['signs','rules','controls']))throw Error('Invalid section results.');
 if(out.mockPass!==undefined&&typeof out.mockPass!=='boolean')throw Error('Invalid mock result.');
 if(out.acc&&(!count(out.acc.correct)||!count(out.acc.total)||out.acc.correct>out.acc.total))throw Error('Invalid accuracy totals.');
 for(const row of Object.values(out.bookmarks||{}))if(!map(row)||typeof row.q!=='string'||typeof row.a!=='string'||(row.ex!==undefined&&typeof row.ex!=='string'))throw Error('Invalid saved question.');
 for(const row of Object.values(out.attempts||{}))if((row.recent!==undefined&&(!Array.isArray(row.recent)||row.recent.some(v=>typeof v!=='boolean')))||(row.firstOk!==undefined&&typeof row.firstOk!=='boolean')||(row.lastOk!==undefined&&typeof row.lastOk!=='boolean'))throw Error('Invalid attempt evidence.');
 if(out.review)for(const row of out.review)if((row.decisionId&&!/^[SRCO][0-9]{2}$/.test(row.decisionId))||!count(row.level)||row.level>3||!Number.isFinite(row.due)||row.due<0||(row.a!==undefined&&typeof row.a!=='string')||(row.ex!==undefined&&typeof row.ex!=='string'))throw Error('Invalid review schedule.');
 const accuracy=value=>map(value)&&count(value.correct)&&count(value.total)&&value.correct<=value.total;
 const mockRows=value=>{if(!map(value))throw Error('Invalid mock sections.');return Object.fromEntries(Object.entries(value).filter(([section])=>['signs','rules','controls'].includes(section)).map(([section,r])=>{if(!map(r)||!count(r.correct)||!count(r.total)||r.total>28||r.correct>r.total||(r.answered!==undefined&&(!count(r.answered)||r.answered>r.total))||(r.pass!==undefined&&typeof r.pass!=='boolean')||(r.need!==undefined&&!count(r.need))||(r.missed!==undefined&&(!Array.isArray(r.missed)||r.missed.some(x=>typeof x!=='string'))))throw Error('Invalid mock section values.');return [section,{correct:r.correct,total:r.total,answered:r.answered??r.total,pass:r.pass===true,need:SECTION_META[section].need,missed:r.missed||[]}];}));};
 if(out.mockResults)out.mockResults=mockRows(out.mockResults);
 // Code snapshots contain numerical mock results only. Unknown nested fields are removed.
 if(out.codeProgress)out.codeProgress=Object.fromEntries(Object.entries(out.codeProgress).filter(([code])=>['1','2','3'].includes(code)).map(([code,r])=>{if(!map(r)||(r.controlsMastery!==undefined&&(!count(r.controlsMastery)||r.controlsMastery>100))||(r.secPass&&!boolMap(r.secPass,['signs','rules','controls'])))throw Error('Invalid vehicle progress.');return [code,{controlsDone:r.controlsDone===true,...(r.controlsMastery===undefined?{}:{controlsMastery:r.controlsMastery}),secPass:r.secPass||{},mockPass:r.mockPass===true,mockResults:mockRows(r.mockResults||{}),acc:accuracy(r.acc)?r.acc:{correct:0,total:0}}];}));
 if(out.diagnostic)out.diagnostic=Object.fromEntries(Object.entries(out.diagnostic).filter(([code,r])=>['1','2','3'].includes(code)&&map(r)&&Number.isFinite(r.at)&&map(r.results)&&['signs','rules','controls'].every(k=>count(r.results[k])&&r.results[k]<=2)).map(([code,r])=>[code,{at:r.at,results:Object.fromEntries(['signs','rules','controls'].map(k=>[k,r.results[k]]))}]));
 if(out.outcomes)out.outcomes=Array.isArray(out.outcomes)?out.outcomes.filter(r=>map(r)&&typeof r.kind==='string'&&count(r.correct)&&count(r.total)&&r.correct<=r.total&&Number.isFinite(r.at)&&count(r.elapsedSeconds)).slice(-100).map(r=>({kind:r.kind.slice(0,40),code:['1','2','3'].includes(r.code)?r.code:'2',correct:r.correct,total:r.total,at:r.at,elapsedSeconds:r.elapsedSeconds})):[];
 for(const field of ['review','bookmarks'])for(const row of Array.isArray(out[field])?out[field]:Object.values(out[field]||{}))if(row.svg){const path=String(row.svg).match(/assets\/(?:signs\/[a-z0-9-]+|decision\/art\/[SRCO][0-9]{2})\.svg/);row.svg=path?path[0]:'';}
 return out;
}

/* Progress is evidence, not a promise of passing. Counts are selected-bank coverage. */
function learningEvidence(){
 const pool=['signs','rules','controls'].flatMap(cat=>buildDrill(cat,'all'));
 const ids=new Set(pool.map(q=>q.decisionId?'decision:'+q.decisionId:reviewKey(q)));
 if(K.state.vehicleCode==='2')for(const [prefix,n] of [['S',28],['R',34],['C',10],['O',10]])for(let i=1;i<=n;i++)ids.add('decision:'+prefix+String(i).padStart(2,'0'));

/* Decision evidence joins the existing study/mock signal; never a pass probability. */
function decisionEvidence(state){
 const topics={signs:{label:'Signs',mode:'signs',need:6,seen:0,correct:0,attempts:0,unresolved:0},rules:{label:'Rules',mode:'rules',need:8,seen:0,correct:0,attempts:0,unresolved:0},controls:{label:'Controls',mode:'controls',need:4,seen:0,correct:0,attempts:0,unresolved:0},observe:{label:'Observation',mode:'observe',need:4,seen:0,correct:0,attempts:0,unresolved:0}};
 const topicForId=id=>{const m=/^([SROC])(\d{2})$/.exec(id||'');if(!m)return null;const n=Number(m[2]),map={S:['signs',28],R:['rules',34],O:['observe',10],C:['controls',10]};return n>0&&n<=map[m[1]][1]?map[m[1]][0]:null;};
 let completed=0,attempts=0;
 for(const [key,row] of Object.entries(state.attempts||{})){if(!key.startsWith('decision:'))continue;const topic=topicForId(key.slice(9));if(!topic)continue;const correct=Number.isFinite(row.correct)&&row.correct>=0?row.correct:0,wrong=Number.isFinite(row.wrong)&&row.wrong>=0?row.wrong:0;if(correct+wrong===0)continue;const recent=Array.isArray(row.recent)?row.recent.filter(x=>typeof x==='boolean').slice(-5):null;const t=topics[topic];t.seen++;t.correct+=recent?.length?recent.filter(Boolean).length:correct;t.attempts+=recent?.length?recent.length:correct+wrong;completed++;attempts+=correct+wrong;}
 const unresolved=new Set();for(const r of Array.isArray(state.review)?state.review:[]){const topic=topicForId(r.decisionId);if(topic&&!(r.level>0)&&!unresolved.has(r.decisionId)){unresolved.add(r.decisionId);topics[topic].unresolved++;}}
 for(const t of Object.values(topics)){t.accuracy=t.attempts?Math.round(t.correct/t.attempts*100):null;t.coverage=Math.min(1,t.seen/t.need);t.score=Math.round((t.accuracy||0)*t.coverage);if(t.unresolved)t.score=Math.min(t.score,69);}
 return {topics,completed,attempts,unresolved:unresolved.size,score:Math.round(Object.values(topics).reduce((n,t)=>n+t.score,0)/4),sufficient:Object.values(topics).every(t=>t.seen>=t.need)};
}

}

function readiness(){
  const s=K.state;
  const sessionsDone=[1,2,3].filter(n=>s.sessions[n]).length;
  const acc=mockAcc();
  const doneAll=sessionsDone===3;
  const secRules=sectionPass('rules'), secSigns=sectionPass('signs'), secCtrl=sectionPass('controls');
  const allSec=secRules&&secSigns&&secCtrl;
  let verdict,emoji,msg,score;
  if(doneAll && allSec && acc>=85){
    verdict='Strong practice result'; emoji='🏆'; score=100;
    msg='You passed every section in practice and completed the study sessions. Keep reviewing mistakes and use the current official material before your test.';
  } else if(doneAll && allSec){
    verdict='Almost there'; emoji='🚀'; score=85;
    msg='You completed the sessions and passed every section in practice. Review the questions you missed and try another full mock.';
  } else if(sessionsDone===0 && !allSec){
    verdict=s.acc?.total?'Build your foundation':'Set your baseline'; emoji='🌱'; score=0;
    msg=s.acc?.total?'You completed practice questions. Study the signs, rules and controls, then retake the sections you missed.':'Start with Session 1, then use the section drills to track your progress.';
  } else if(!doneAll){
    verdict=sessionsDone+' of 3 topic checks complete'; emoji='📚'; score=Math.round(sessionsDone/3*60);
    msg='Keep going through the three sessions, then pass each section of the mock.';
  } else if(doneAll && !allSec){
    const missing=[];
    if(!secRules)missing.push('Rules');
    if(!secSigns)missing.push('Signs');
    if(!secCtrl)missing.push('Controls');
    verdict='Pass your weak section'; emoji='🎯'; score=60;
    msg='Sessions are done. You still need to pass: '+missing.join(', ')+'. Retake that section of the mock.';
  } else {
    verdict='Close — pass the mock'; emoji='🎯'; score=45;
    msg='Sessions are done. Now lock it in: retake the mock until you pass all sections comfortably.';
  }
  const attempts=Object.values(s.attempts||{}).filter(a=>visibleForCode(a.q)), repeated=attempts.filter(a=>a.correct+a.wrong>=2).length;
  if(score>=85 && repeated<20){score=Math.min(score,79);msg+=' Build confidence with at least 20 concepts answered more than once; '+repeated+' have repeated evidence so far.';}
  if(s.vehicleCode!=='2'){score=Math.min(score,79);msg+=' Complete your selected code’s official controls manual too.';}
  const decision=s.vehicleCode==='2'?decisionEvidence(s):null;
  if(decision){score=Math.max(0,Math.round(score*.8+decision.score*.2)-Math.min(15,decision.unresolved*2));if(decision.unresolved)score=Math.min(score,84);if(!decision.sufficient)msg+=' Build evidence across signs, rules, controls and observation decisions.';if(decision.unresolved){verdict='Resolve your decision weaknesses';msg+=' '+decision.unresolved+' unresolved decision'+(decision.unresolved===1?' remains':'s remain')+' in Review.';}else if(decision.completed)msg+=' '+decision.completed+' selected road decisions now contribute to this signal.';}
  const observed=Object.values(s.attempts||{}).filter(a=>visibleForCode(a.q)&&a.correct+a.wrong>0);
  if(!sessionsDone&&!allSec&&observed.length){const count=observed.reduce((n,a)=>n+a.correct+a.wrong,0),right=observed.reduce((n,a)=>n+a.correct,0);score=Math.max(score,Math.min(39,Math.round(right/count*100*Math.min(1,observed.length/30))));if(!decision?.unresolved)verdict='Building practice evidence';msg='You have tried '+observed.length+' different questions. Continue the topic checks and pass each mock section to strengthen this signal.';}
  return {verdict,emoji,msg,score,sessionsDone,acc,mockPass:!!s.mockPass,secRules,secSigns,secCtrl,allSec,decision};
}

function daysUntilTest(){
 const parts=String(K.state.testDate||'').split('-').map(Number);
 if(parts.length!==3||parts.some(x=>!Number.isInteger(x)))return null;

 if(target.getFullYear()!==parts[0]||target.getMonth()!==parts[1]-1||target.getDate()!==parts[2])return null;
 return Math.round((target-today)/86400000);
}

const boundSpeechControls=new WeakSet();
function bindTTS(scope){
  scope=scope||app;
  scope.querySelectorAll('[data-speak]').forEach(b=>{
    if(boundSpeechControls.has(b))return;boundSpeechControls.add(b);
    b.addEventListener('click',(e)=>{e.stopPropagation();const txt=b.getAttribute('data-speak');if(txt)speakText(txt);});
  });
  const v=scope.querySelector('#ttsVoice');
  if(v&&!boundSpeechControls.has(v)){boundSpeechControls.add(v);v.addEventListener('change',()=>{state.voice=v.value;K.save();});}
  const r=scope.querySelector('#ttsRate');
  if(r&&!boundSpeechControls.has(r)){boundSpeechControls.add(r);r.addEventListener('input',()=>{state.rate=parseFloat(r.value);K.save();});}
}
function rememberView(view){
  const url=new URL(location.href);url.hash='';if(view==='home')url.searchParams.delete('go');else url.searchParams.set('go',view);history.replaceState(null,'',url);
}
function focusPracticeContent(){
  const update=document.getElementById('swToast');if(update&&(app.querySelector('.opt')||decisionModule?.isActive()))update.hidden=true;
  if(!app.querySelector('.opt'))return;
  const card=app.querySelector('.block:has(.opt)'),advance=card?.querySelector('.next'),message=card?.querySelector('.feedback');if(advance&&message)message.after(advance);
  const feedback=app.querySelector('.feedback:not(.hidden)');
  const target=feedback||app.querySelector('.block h2');
  if(target){target.tabIndex=-1;target.focus({preventScroll:true});}
}
function navigateFromPractice(navigate,onCancel=()=>{}){
  if(!confirmShortLeave()){onCancel();return;}
  if(assessmentActive && !window.confirm('Leave this practice test? You can resume from Home; a timed attempt keeps counting down.')){onCancel();return;}
  assessmentActive=false;
  if(mockTimer){clearInterval(mockTimer);mockTimer=null;mockSeconds=0;}
  if(decisionModule?.isActive()){decisionModule.requestLeave(navigate);return;}
  navigate();
}

let decisionModule=null,decisionLoading=false;
function practiceHeader(title,back='practice'){currentArea='practice';let bar=backbar(title).replace('class="backbar no-print"','class="backbar practice-back no-print"');if(back==='practice')bar=bar.replace('<button data-go="home"','<button data-go="practice"').replace('Back to home','Back to Practise');return bar;}
function decisionBridge(){return {root:app,state:K.state,save:K.save,touch:K.touch,header:practiceHeader,bind:(scope=app)=>bindGo(scope,{decision:true}),toggleTheme:K.toggleTheme,speak:speakText,stopSpeech,storageStatus:showStorageStatus,openPractice,openDecision};}
async function loadDecisionModule(){decisionModule=decisionModule||await import('./assets/decision/practice.js?v=32');K.decisionQuestions=topic=>decisionModule.getPracticeQuestions(topic,K.state.vehicleCode);K.recordDecisionQuestion=(q,ok)=>{decisionModule.recordChoiceAttempt(K.state,q,ok);K.touch();K.save();};return decisionModule;}
function showRoadPracticeRecovery(){const slot=document.getElementById('practiceResumeSlot');if(slot&&K.state.vehicleCode==='2')loadDecisionModule().then(module=>{if(slot.isConnected)module.renderResumeNotice(decisionBridge(),slot);}).catch(()=>{});}
async function openDecision(args={}){
  if(decisionLoading)return;
  decisionLoading=true;
  try{
    const module=await loadDecisionModule();
    module.mount(decisionBridge(),args);
    window.scrollTo(0,0);
  }catch(error){
    console.error('Decision practice could not open',error);
    app.innerHTML=backbar('Decision practice')+'<div class="block"><h2>Practice could not open</h2><p>Reconnect once to update the app, then try again. Your existing study history is unchanged.</p><button class="btn btn-primary" data-go="decision">Try again</button><button class="btn btn-ghost" data-go="practice">Section drills</button></div>';bindGo();
  }finally{decisionLoading=false;}
}

let mockData=[];

/* A checkpoint keeps the exact paper and deadline; refreshing never grants extra time. */
function validAssessment(c){
  if(!c||c.version!==1||!['sim','mock'].includes(c.mode)||!['1','2','3'].includes(c.code)||!Number.isFinite(c.deadline)||c.deadline<0||!Number.isInteger(c.i)||!Array.isArray(c.questions)||!c.questions.length||c.questions.length>64||c.i<0||c.i>c.questions.length||!Array.isArray(c.answers)||c.answers.length!==c.questions.length)return false;
  if(c.mode==='mock'&&(!Number.isInteger(c.series)||c.series<1||!SECTION_ORDER.includes(c.sec)||(c.onlySec!==null&&c.onlySec!==c.sec)||c.questions.length!==SECTION_META[c.sec].n))return false;
  if(c.mode==='sim'&&(c.questions.length!==64||SECTION_ORDER.some(sec=>c.questions.filter(q=>q&&typeof q.sec==='string'&&q.sec.toLowerCase()===sec).length!==SECTION_META[sec].n)))return false;
  return c.questions.every((q,n)=>q&&typeof q.q==='string'&&Array.isArray(q.opts)&&q.opts.length>=2&&q.opts.length<=6&&q.opts.every(o=>typeof o==='string')&&Number.isInteger(q.ans)&&q.ans>=0&&q.ans<q.opts.length&&(c.mode!=='sim'||['Rules','Signs','Controls'].includes(q.sec))&&(c.answers[n]===null||(Number.isInteger(c.answers[n])&&c.answers[n]>=0&&c.answers[n]<q.opts.length))&&(n<c.i?c.answers[n]!==null:n>c.i?c.answers[n]===null:true));
}
function saveAssessment(c){K.state.activeAssessment={...c,version:1,code:K.state.vehicleCode};K.save();}
function clearAssessment(){delete K.state.activeAssessment;K.save();}
function resumeAssessment(){
  const c=K.state.activeAssessment;
  if(!validAssessment(c)){clearAssessment();renderHome();return;}
  if(K.state.vehicleCode!==c.code)setVehicleCode(c.code);
  c.questions=c.questions.map(q=>({...q,svg:reviewArt(q.svg),ex:typeof q.ex==='string'?q.ex:''}));
  mockSeconds=c.deadline?remainingSeconds(c.deadline):0;
  if(c.mode==='sim')startSim(c);else startMock(c.onlySec,c);
}

  const slot=document.getElementById('assessmentResumeSlot'),anchor=app.querySelector('.backbar')||app.querySelector('.app-header');if(slot)slot.append(box);else if(anchor)anchor.after(box);else app.prepend(box);

window.addEventListener('beforeunload',e=>{if(assessmentActive&&window.__storageFailed){e.preventDefault();e.returnValue='';}});
function remainingSeconds(deadline,now=Date.now()){return Math.max(0,Math.ceil((deadline-now)/1000));}
function sectionPassed(correct,answered,total,need){return answered===total&&correct>=need;}
/* Build one section's questions (full pool, shuffled) */
function buildSection(sec,series){
  const q=[];
  if(sec==='rules'){
    K.rulesForCode(K.state.vehicleCode).forEach(r=>{const opts=K.shuffle([r.a,...K.ruleWrongs(r)]);q.push({q:r.q,opts,ans:opts.indexOf(r.a),ex:r.a});});
    K.extraForCode(K.state.vehicleCode).forEach(e=>{const so=K.shufOpts(e.opts,e.ans);q.push({q:e.q,opts:so.opts,ans:so.ans,ex:e.ex});});
  } else if(sec==='signs'){
    K.SIGNS.forEach(s=>q.push(K.signQuestion(s)));
    K.MARKINGS.forEach(mk=>{const wrong=K.shuffle(K.MARKINGS.filter(x=>x!==mk).map(x=>x.d)).slice(0,3);const opts=K.shuffle([mk.d,...wrong]);q.push({q:mk.t+' — what does it mean?',opts,ans:opts.indexOf(mk.d),ex:mk.tip});});
    K.SIGN_VARIANTS.forEach(s=>{const so=K.shufOpts(s.opts,s.ans);q.push({q:s.q,opts:so.opts,ans:so.ans,ex:s.ex});});
  } else if(sec==='controls'){
    K.controlsForCode(K.state.vehicleCode).forEach(c=>{const so=K.shufOpts(c.opts,c.ans);q.push({q:c.q,opts:so.opts,ans:so.ans,ex:c.ex});});
    K.CONTROL_VARIANTS.forEach(c=>{const so=K.shufOpts(c.opts,c.ans);q.push({q:c.q,opts:so.opts,ans:so.ans,ex:c.ex});});
  }
  if(K.decisionQuestions)q.push(...K.decisionQuestions(sec));
  // Retain the existing independent practice-paper section counts.
  const target = sec==='rules' ? 28 : sec==='signs' ? 28 : 8;
  return K.selectPaper(q,target,series);
}
