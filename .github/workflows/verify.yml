name: Verify K53
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: node scripts/verify-all.mjs

  browsers:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit, chromium]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install isolated browser test dependencies
        run: npm install --prefix "$RUNNER_TEMP/greenlight-browser-tools" --ignore-scripts playwright@1.62.1 @axe-core/playwright@4.14.0
      - name: Install official browser and host dependencies
        run: node "$RUNNER_TEMP/greenlight-browser-tools/node_modules/playwright/cli.js" install --with-deps "${{ matrix.browser }}"
      - name: Verify learner journey and layouts
        run: node scripts/verify-learner-browser.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/greenlight-browser-tools/node_modules
          K53_BROWSER: ${{ matrix.browser }}
          K53_BROWSER_MATRIX: '1'
          K53_EVIDENCE_DIR: artifacts/browser-${{ matrix.browser }}
      - name: Verify full product UI matrix (Chromium)
        if: matrix.browser == 'chromium'
        run: node scripts/verify-product-browser.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/greenlight-browser-tools/node_modules
          K53_EVIDENCE_DIR: artifacts/product-browser
      - name: Verify deep navigation, return paths and saved-state recovery (Chromium)
        if: matrix.browser == 'chromium'
        run: node scripts/verify-navigation-browser.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/greenlight-browser-tools/node_modules
          K53_EVIDENCE_DIR: artifacts/deep-navigation
      - name: Verify clarity redesign, keyboard and reduced motion (Chromium)
        if: matrix.browser == 'chromium'
        run: node scripts/verify-clarity-browser.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/greenlight-browser-tools/node_modules
          K53_EVIDENCE_DIR: artifacts/deep-clarity
      - name: Verify populated product states and visual polish (Chromium)
        if: matrix.browser == 'chromium'
        run: node scripts/verify-polish-browser.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/greenlight-browser-tools/node_modules
          K53_EVIDENCE_DIR: artifacts/deep-polish
      - name: Verify all decision cards and complete simulations (Chromium)
        if: matrix.browser == 'chromium'
        run: node scripts/verify-decision-browser.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/greenlight-browser-tools/node_modules
          K53_EVIDENCE_DIR: artifacts/deep-decisions
      - name: Verify Drive timing, interruption and storage edge cases (Chromium)
        if: matrix.browser == 'chromium'
        run: node scripts/verify-decision-edge-browser.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/greenlight-browser-tools/node_modules
          K53_EVIDENCE_DIR: artifacts/deep-decision-edge
      - name: Verify readiness, section results and weak-topic follow-ups (Chromium)
        if: matrix.browser == 'chromium'
        run: node scripts/verify-readiness-browser.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/greenlight-browser-tools/node_modules
          K53_EVIDENCE_DIR: artifacts/deep-readiness
      - name: Verify real service-worker upgrade and offline resume (Chromium)
        if: matrix.browser == 'chromium'
        run: node scripts/verify-unified-browser.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/greenlight-browser-tools/node_modules
          K53_EVIDENCE_DIR: artifacts/deep-offline
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: greenlight-${{ matrix.browser }}
          path: |
            artifacts/browser-${{ matrix.browser }}
            artifacts/product-browser
            artifacts/deep-*
          if-no-files-found: ignore
          retention-days: 7
