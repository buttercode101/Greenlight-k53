name: Verify K53
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify.mjs
      - run: node scripts/verify-content.mjs
      - run: node scripts/verify-offline.mjs
      - run: node scripts/verify-assessment.mjs
  signs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-signs.mjs
