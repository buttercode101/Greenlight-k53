/* ============================================================
   DESIGN.md COMPATIBLE TOKENS (Notion + Mintlify hybrid)
   Warm neutrals, single accent, whisper borders, docs clarity
   ============================================================ */
:root{
  /* Colors — warm neutrals never blue-gray */
  --ink: rgba(0,0,0,0.95);
  --ink-soft: #615d59;
  --ink-faint: #75706b;
  --paper: #ffffff;
  --warm: #f6f5f4;
  --accent: #0075de;        /* Notion Blue — only saturated UI color */
  --accent-soft: #f2f9ff;
  --accent-dark: #005bab;
  --ok: #15803d;
  --ok-soft: #eafaf0;
  --warn: #8a5a00;
  --warn-soft: #fef6e7;
  --err: #b04500;
  --err-soft: #fdeee2;
  /* Borders — whisper weight */
  --line: rgba(0,0,0,0.10);
  --line-soft: rgba(0,0,0,0.06);
  --ring: rgba(0,0,0,0.08);
  /* Radius */
  --r-micro: 4px;
  --r-std: 12px;
  --r-lg: 16px;
  --r-pill: 9999px;
  /* Shadow (Vercel-style stack, low opacity) */
  --sh-card: rgba(0,0,0,0.04) 0px 4px 18px, rgba(0,0,0,0.027) 0px 2.025px 7.85px, rgba(0,0,0,0.02) 0px 0.8px 2.93px, rgba(0,0,0,0.01) 0px 0.175px 1.04px;
  --sh-btn: rgba(0,0,0,0.06) 0 1px 2px;
  /* Spacing scale */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px; --s9:80px; --s10:120px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
@media (prefers-reduced-motion: no-preference){ html{scroll-behavior:smooth;} }
/* ---------- Dark mode (token overrides under [data-theme="dark"]) ---------- */
html[data-theme="dark"]{
  --ink: rgba(255,255,255,0.96);
  --ink-soft: #b9b4ae;
  --ink-faint: #8d8882;
  --paper: #16181d;
  --warm: #1f232b;
  --accent-soft: rgba(0,117,222,0.16);
  --accent-dark: #6cb6ff;
  --ok-soft: rgba(21,128,61,0.22);
  --warn-soft: rgba(138,90,0,0.22);
  --err-soft: rgba(176,69,0,0.22);
  --line: rgba(255,255,255,0.14);
  --line-soft: rgba(255,255,255,0.09);
  --ring: rgba(255,255,255,0.12);
  --sh-card: rgba(0,0,0,0.5) 0px 4px 18px, rgba(0,0,0,0.3) 0px 2px 8px;
  --sh-btn: rgba(0,0,0,0.4) 0 1px 2px;
}
html[data-theme="dark"] body{color-scheme:dark;}
html[data-theme="dark"] .hero{background:
  radial-gradient(120% 140% at 0% 0%, rgba(0,117,222,0.20), rgba(0,117,222,0) 55%),
  radial-gradient(120% 140% at 100% 0%, rgba(21,128,61,0.16), rgba(21,128,61,0) 50%),
  var(--warm);}
html[data-theme="dark"] .story{border-left-color:var(--accent);}
html[data-theme="dark"] .feedback.ok{color:#7bf0a2;}
html[data-theme="dark"] .feedback.no{color:#ffb08a;}
html[data-theme="dark"] .btn-ok:hover{filter:brightness(1.1);}
/* Theme toggle in topbar */
.theme-toggle{background:none;border:1px solid var(--line);border-radius:var(--r-pill);color:var(--ink-soft);
  font-size:16px;width:36px;height:36px;cursor:pointer;display:grid;place-items:center;flex:none;padding:0;}
.theme-toggle:hover{border-color:var(--accent);color:var(--accent);}
/* ---------- Speech / read-aloud controls ---------- */
.speak{background:none;border:1px solid var(--line);border-radius:var(--r-pill);color:var(--ink-soft);
  font-size:15px;width:36px;height:36px;cursor:pointer;display:inline-grid;place-items:center;flex:none;padding:0;
  vertical-align:middle;transition:border-color .15s,color .15s;}
.speak:hover{border-color:var(--accent);color:var(--accent);}
.speak.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.tts-bar{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;background:var(--warm);
  border:1px solid var(--line-soft);border-radius:var(--r-std);padding:10px var(--s3);margin-top:var(--s3);}
.tts-bar .ttx{font-size:13px;color:var(--ink-soft);flex:1;min-width:140px;}
.tts-bar select{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:var(--r-micro);
  background:var(--paper);color:var(--ink);padding:6px 8px;max-width:160px;}
.tts-bar .rate{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);}
.tts-bar input[type=range]{width:90px;accent-color:var(--accent);}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--paper); color:var(--ink); line-height:1.55; font-size:17px;
  font-feature-settings:"lnum" 1;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:680px;margin:0 auto;padding:var(--s4) var(--s4) var(--s7);}
/* ---------- Top progress ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--paper);
  border-bottom:1px solid var(--line-soft);padding:10px var(--s4);
  display:flex;align-items:center;gap:var(--s3);}
.topbar .brand{font-weight:700;font-size:15px;letter-spacing:-0.2px;}
.topbar .brand span{color:var(--accent);}
.prog{flex:1;height:8px;background:var(--warm);border-radius:var(--r-pill);overflow:hidden;}
.prog > i{display:block;height:100%;width:0;background:var(--accent);border-radius:var(--r-pill);transition:width .5s ease;}
.prog-label{font-size:12px;color:var(--ink-soft);font-weight:500;min-width:38px;text-align:right;}
/* ---------- Hero ---------- */
.hero{border-radius:var(--r-lg);padding:var(--s7) var(--s5);margin-bottom:var(--s5);
  background:
    radial-gradient(120% 140% at 0% 0%, rgba(0,117,222,0.10), rgba(0,117,222,0) 55%),
    radial-gradient(120% 140% at 100% 0%, rgba(26,174,57,0.08), rgba(26,174,57,0) 50%),
    var(--warm);
  border:1px solid var(--line-soft);}
.hero h1{margin:0 0 var(--s2);font-size:34px;line-height:1.05;font-weight:700;letter-spacing:-1.4px;}
.hero p{margin:0;color:var(--ink-soft);font-size:16px;max-width:46ch;}
.hero .facts{display:flex;gap:var(--s4);margin-top:var(--s4);flex-wrap:wrap;}
.hero .fact{font-size:13px;color:var(--ink-soft);}
.hero .fact b{display:block;font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-0.5px;}
/* ---------- Section blocks (left-aligned reading flow) ---------- */
.block{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:var(--s5);margin-bottom:var(--s4);box-shadow:var(--sh-card);}
.block h2{margin:0 0 var(--s2);font-size:22px;font-weight:700;letter-spacing:-0.6px;}
.block .lead{margin:0 0 var(--s4);color:var(--ink-soft);font-size:15px;}
.kicker{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.6px;
  color:var(--accent);margin:0 0 var(--s2);}
/* ---------- Buttons ---------- */
.btn{display:block;width:100%;border:none;border-radius:var(--r-pill);
  padding:16px var(--s5);font-size:16px;font-weight:600;cursor:pointer;
  font-family:inherit;transition:transform .08s, background .15s, filter .15s;
  margin-top:var(--s3);text-align:left;line-height:1.3;}
.btn:active{transform:scale(.985);}
.btn-primary{background:var(--accent);color:#fff;box-shadow:var(--sh-btn);}
.btn-primary:hover{background:var(--accent-dark);}
.btn-ghost{background:var(--warm);color:var(--ink);}
.btn-ghost:hover{background:var(--accent-soft);}
.btn-soft{background:var(--accent-soft);color:var(--accent-dark);}
.btn-ok{background:var(--ok);color:#fff;}
.btn-ok:hover{filter:brightness(.95);}
.btn .sub{display:block;font-size:13px;font-weight:500;opacity:.85;margin-top:2px;}
.btn-row{display:flex;gap:var(--s2);}
.btn-row .btn{margin-top:var(--s3);}
/* Balance buttons on wide screens — cap + center instead of stretched pills */
@media (min-width:560px){
  .block > .btn, .btn-row .btn{width:auto;min-width:320px;margin-left:auto;margin-right:auto;text-align:center;}
}
/* ---------- Sign card (visual-first) ---------- */
.signcard{display:flex;gap:var(--s4);align-items:flex-start;padding:var(--s4);
  border:1px solid var(--line-soft);border-radius:var(--r-std);margin-bottom:var(--s3);
  background:var(--paper);}
.signcard .art{flex:none;width:96px;height:96px;display:grid;place-items:center;
  background:var(--warm);border-radius:var(--r-std);}
.signcard .body{flex:1;min-width:0;}
.signcard .name{font-weight:700;font-size:17px;letter-spacing:-0.3px;}
.signcard .fam{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:0.5px;padding:2px 8px;border-radius:var(--r-pill);margin-left:var(--s2);}
.fam-red{background:var(--err-soft);color:var(--err);}
.fam-tri{background:var(--warn-soft);color:var(--warn);}
.fam-blue{background:var(--accent-soft);color:var(--accent-dark);}
.fam-info{background:var(--ok-soft);color:var(--ok);}
.signcard .mean{margin:4px 0 0;font-size:14px;color:var(--ink-soft);}
.signcard .analogy{margin:6px 0 0;font-size:13px;color:var(--ink);background:var(--warm);
  padding:6px 10px;border-radius:var(--r-micro);}
/* ---------- Story cards (rules) ---------- */
.story{border-left:3px solid var(--accent);background:var(--warm);
  padding:var(--s3) var(--s4);border-radius:0 var(--r-std) var(--r-std) 0;margin-bottom:var(--s3);}
.story .q{font-weight:600;font-size:16px;margin:0 0 4px;}
.story .a{font-size:14px;color:var(--ink-soft);margin:0;}
/* ---------- Quiz ---------- */
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);
  background:var(--paper);border-radius:var(--r-std);padding:14px var(--s4);font-size:16px;
  margin-bottom:var(--s2);cursor:pointer;font-family:inherit;color:var(--ink);
  transition:border-color .12s, background .12s;}
.opt:active{border-color:var(--accent);}
.opt.correct{border-color:var(--ok);background:var(--ok-soft);}
.opt.wrong{border-color:var(--err);background:var(--err-soft);}
.opt.disabled{pointer-events:none;}
.feedback{padding:12px var(--s4);border-radius:var(--r-std);margin:var(--s3) 0;font-size:14px;}
.feedback.ok{background:var(--ok-soft);color:#0f6b22;}
.feedback.no{background:var(--err-soft);color:#9a3d00;}
/* ---------- Markings + misc ---------- */
.mini{border:1px solid var(--line-soft);border-radius:var(--r-std);padding:var(--s3) var(--s4);
  margin-bottom:var(--s2);background:var(--paper);}
.mini .t{font-weight:600;font-size:15px;}
.mini .d{font-size:14px;color:var(--ink-soft);margin-top:2px;}
/* ---------- Results ---------- */
.result-title{font-size:28px;font-weight:700;letter-spacing:-0.8px;margin:0 0 4px;}
.result-sub{color:var(--ink-soft);margin:0 0 var(--s4);font-size:15px;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);margin:var(--s4) 0;}
.stat{background:var(--warm);border-radius:var(--r-std);padding:var(--s3);text-align:center;}
.stat .n{font-size:22px;font-weight:700;letter-spacing:-0.5px;}
.stat .l{font-size:12px;color:var(--ink-soft);margin-top:2px;}
/* ---------- Back bar ---------- */
.backbar{position:sticky;top:0;z-index:30;background:var(--paper);
  border-bottom:1px solid var(--line-soft);padding:10px var(--s4);
  display:flex;align-items:center;gap:var(--s3);}
.backbar button{background:none;border:none;font-size:22px;cursor:pointer;color:var(--ink-soft);padding:4px 6px;}
.backbar .ttl{font-weight:700;font-size:16px;}
.backbar .sc{margin-left:auto;font-size:13px;color:var(--ink-soft);font-weight:500;}
/* ---------- Progress rings (readiness) ---------- */
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);margin:var(--s4) 0;}
.ring{--val:0;width:72px;height:72px;margin:0 auto 6px;border-radius:50%;
  background:conic-gradient(var(--accent) calc(var(--val)*1%), var(--warm) 0);display:grid;place-items:center;}
.ring::before{content:'';width:56px;height:56px;border-radius:50%;background:var(--paper);}
.ring span{position:absolute;font-size:15px;font-weight:700;}
.ringwrap{text-align:center;}
.ringwrap .rt{font-size:12px;color:var(--ink-soft);font-weight:600;}
/* ---------- Streak ---------- */
.streak{display:flex;align-items:center;justify-content:center;gap:var(--s2);background:var(--warm);
  border:1px solid var(--line-soft);border-radius:var(--r-pill);padding:8px var(--s4);font-size:14px;font-weight:600;margin-bottom:var(--s3);}
.streak .flame{font-size:18px;}
/* ---------- Flashcards ---------- */
.flash-stage{perspective:1200px;margin:var(--s4) 0;}
.flash-card{position:relative;width:100%;min-height:220px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer;}
.flash-card.flip{transform:rotateY(180deg);}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);
  border-radius:var(--r-lg);background:var(--paper);box-shadow:var(--sh-card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--s5);text-align:center;}
.flash-back{transform:rotateY(180deg);background:var(--accent-soft);}
.flash-back .mean{color:var(--ink);font-size:16px;font-weight:600;margin-top:var(--s2);}
.flash-back .analogy{margin-top:var(--s2);font-size:14px;color:var(--ink-soft);}
.flash-back .hint{position:absolute;top:var(--s2);right:var(--s2);font-size:11px;font-weight:700;color:var(--accent-dark);text-transform:uppercase;letter-spacing:.5px;}
.flash-ctl{display:flex;gap:var(--s2);margin-top:var(--s3);}
@media (prefers-reduced-motion: reduce){.flash-card{transition:none;}}
/* ---------- Memory tricks ---------- */
.mem{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s4);border:1px solid var(--line-soft);
  border-radius:var(--r-std);margin-bottom:var(--s3);background:var(--paper);}
.mem .t2{flex:none;width:40px;height:40px;border-radius:var(--r-pill);background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:18px;}
.mem .tt{font-weight:700;font-size:15px;letter-spacing:-0.2px;}
.mem .tn{margin:2px 0 0;font-size:14px;color:var(--ink-soft);}
/* ---------- Stopping table ---------- */
.span-table{width:100%;border-collapse:collapse;font-size:14px;margin:var(--s3) 0;}
.span-table th,.span-table td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line-soft);}
.span-table th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);}
.span-table td:first-child{font-weight:700;}
.span-table tr:last-child td{border-bottom:none;}
/* ---------- Timer ---------- */
.timer{position:sticky;top:0;z-index:31;background:var(--paper);border-bottom:1px solid var(--line-soft);
  padding:8px var(--s4);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:space-between;}
.timer .ttl{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;}
.timer .time{font-variant-numeric:tabular-nums;}
.timer.warn .time{color:var(--err);}
/* ---------- Utility ---------- */
.hidden{display:none!important;}
.center{text-align:center;}
.footnote{text-align:center;font-size:12px;color:var(--ink-faint);margin-top:var(--s5);line-height:1.5;}
.badge-xl{font-size:60px;text-align:center;margin:6px 0 2px;}
/* ---------- Cheat sheet (print) ---------- */
.cheat h3{margin:var(--s5) 0 6px;font-size:17px;letter-spacing:-0.3px;}
.cheat ul{margin:0;padding-left:20px;}
.cheat li{margin-bottom:6px;font-size:15px;}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--r-pill);margin-right:6px;text-transform:uppercase;letter-spacing:.4px;}
.tag-r{background:var(--err-soft);color:var(--err);}
.tag-t{background:var(--warn-soft);color:var(--warn);}
.tag-b{background:var(--accent-soft);color:var(--accent-dark);}
.tag-g{background:var(--ok-soft);color:var(--ok);}
/* ---------- Confetti ---------- */
.confetti{position:fixed;top:-12px;width:9px;height:14px;opacity:.9;z-index:999;pointer-events:none;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0;}}
@media (prefers-reduced-motion: reduce){.confetti{display:none;}.prog>i{transition:none;}}
/* focus visibility */
a:focus-visible,button:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
@media print{
  .topbar,.backbar,.btn,.footnote,.no-print{display:none!important;}
  .wrap{max-width:100%;padding:0 12px;}
  .block,.signcard,.mini,.story{box-shadow:none;border-color:#ccc;break-inside:avoid;}
  body{font-size:12px;}
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
/* Shuffle option order AND return the new index of the correct answer (never hard-coded). */
function shufOpts(opts, correctIdx){
  const tagged=opts.map((o,i)=>({o,i}));
  const sh=shuffle(tagged);
  return {opts:sh.map(x=>x.o), ans: sh.findIndex(x=>x.i===correctIdx)};
}
/* Build 3 plausible-but-wrong options for a rules question, avoiding the correct answer
   and avoiding duplicates. Mixes real content (other rule answers) with sensible decoys so
   the wrong answers read like a real multiple-choice test, not "The opposite". */
function ruleWrongs(rule){
  // Prefer the rule's curated wrong-answer array (topic-relevant, similar-but-not-identical).
  if(rule && rule.w && rule.w.length>=3){ return shuffle(rule.w.slice(0,3)); }
  const correct=rule && rule.a ? rule.a : rule;
  const pool=[];
  RULES.forEach(r=>{ if(r.a!==correct) pool.push(r.a); });
  const decoys=['At least 5 seconds behind','The car on your left goes first','Drive on the right','120 km/h','Stop only if a police officer signals','0.05 g per 100 ml for everyone','At least 1 second behind','Green means go without looking'];
  const out=new Set();
  shuffle(pool).forEach(x=>{ if(out.size<2 && !out.has(x)) out.add(x); });
  shuffle(decoys).forEach(x=>{ if(out.size<3 && !out.has(x)) out.add(x); });
  return [...out].slice(0,3);
}
function buildMock(){

   const wrongs=shuffle(SIGNS.filter(x=>x.id!==s.id)).slice(0,3).map(x=>x.name);
   const opts=shuffle([s.name,...wrongs]);
   m.push({type:'sign',svg:typeof s.svg==='function'?s.svg():s.svg,q:'What does this sign mean?',opts,ans:opts.indexOf(s.name),ex:s.mean});
 });
 MARKINGS.forEach(mk=>{
   const wrongs=shuffle(MARKINGS.filter(x=>x!==mk).map(x=>x.d)).slice(0,3);
   const opts=shuffle([mk.d,...wrongs]);
   m.push({type:'mark',q:mk.t+' — what does it mean?',opts,ans:opts.indexOf(mk.d),ex:mk.tip});
 });
 RULES.forEach(r=>{
   const opts=shuffle([r.a,...ruleWrongs(r)]);
   m.push({type:'rule',q:r.q,opts,ans:opts.indexOf(r.a),ex:r.a});
 });
 CONTROLS.forEach(c=>{const so=shufOpts(c.opts,c.ans);m.push({type:'ctrl',q:c.q,opts:so.opts,ans:so.ans,ex:c.ex});});
 MOCK_EXTRA.forEach(e=>{const so=shufOpts(e.opts,e.ans);m.push({type:'extra',q:e.q,opts:so.opts,ans:so.ans,ex:e.ex});});
 return shuffle(m).slice(0,40);
}

function dayKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
/* ---------- TEXT-TO-SPEECH (browser speechSynthesis — offline, no service) ---------- */
const TTS = (()=>{
  function ok(){return typeof speechSynthesis!=='undefined';}
  function pickVoice(){
    if(!ok())return null;
    const vs=speechSynthesis.getVoices();
    if(!vs||!vs.length)return null;
    const prefs=[
      v=>/en[-_]ZA/i.test(v.lang)&&/male/i.test(v.name), // prefer SA male
      v=>/en[-_]ZA/i.test(v.lang),
      v=>/en[-_]GB/i.test(v.lang),
      v=>/en[-_]US/i.test(v.lang)&&/male/i.test(v.name),
      v=>v.lang.startsWith('en')
    ];
    for(const match of prefs){const f=vs.find(match);if(f)return f;}
    return vs[0];
  }
  function stop(){if(ok())speechSynthesis.cancel();}
  function speak(text){ 
    if(!ok()||!text)return;
    stop();
    const u=new SpeechSynthesisUtterance(text);
    const v=pickVoice(); if(v)u.voice=v;
    u.lang=(v&&v.lang)||'en-ZA';
    u.rate=+(state.rate||1);
    u.pitch=1;
    speechSynthesis.speak(u);
  }
  if(ok()){speechSynthesis.onvoiceschanged=()=>{}; speechSynthesis.getVoices();}
  return {ok,speak,stop};
})();
window.__TTS=TTS;
/* Streak: bump once per calendar day; reset if a day was skipped */
function touch(){
  const today=dayKey();
  if(state.lastDay===today) return;
  const y=new Date(); y.setDate(y.getDate()-1);
  const yes=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
  state.streak = (state.lastDay===yes) ? (state.streak||0)+1 : 1;
  state.lastDay=today;
  save();
}

function buildDrill(cat){
  const q=[];
  if(cat==='signs'||cat==='mixed'){
    K.SIGNS.forEach(s=>{const wrong=K.shuffle(K.SIGNS.filter(x=>x.id!==s.id)).slice(0,3).map(x=>x.name);const opts=K.shuffle([s.name,...wrong]);q.push({q:'What does this sign mean?',svg:typeof s.svg==='function'?s.svg():s.svg,opts,ans:opts.indexOf(s.name),ex:s.mean});});
    K.MARKINGS.forEach(mk=>{const wrong=K.shuffle(K.MARKINGS.filter(x=>x!==mk).map(x=>x.d)).slice(0,3);const opts=K.shuffle([mk.d,...wrong]);q.push({q:mk.t+' — what does it mean?',opts,ans:opts.indexOf(mk.d),ex:mk.tip});});
  }
  if(cat==='rules'||cat==='mixed')K.RULES.forEach(r=>{const opts=K.shuffle([r.a,...K.ruleWrongs(r)]);q.push({q:r.q,opts,ans:opts.indexOf(r.a),ex:r.a});});
  if(cat==='controls'||cat==='mixed')K.CONTROLS.forEach(c=>{const so=K.shufOpts(c.opts,c.ans);q.push({q:c.q,opts:so.opts,ans:so.ans,ex:c.ex});});
  if(cat==='mixed')return K.shuffle(q).slice(0,20);
  if(cat==='signs')return q; // full section = 28+ questions in real test; we use all available
  if(cat==='rules')return q;
  if(cat==='controls')return q;
  return K.shuffle(q);
}
function drill(cat){
  const qs=buildDrill(cat);let i=0,correct=0,total=qs.length;
  const names={signs:'Signs',rules:'Rules',controls:'Controls',mixed:'Mixed'};
  // Official section pass marks: Rules 22/28, Signs 23/28, Controls 6/8
  const passMap={rules:Math.ceil(total*22/28),signs:Math.ceil(total*23/28),controls:Math.ceil(total*6/8),mixed:Math.ceil(total*0.8)};
  const passMark=passMap[cat]||Math.ceil(total*0.8);
  render();
  function render(){
    if(i>=total){const p=correct>=passMark;app.innerHTML=backbar(names[cat])+`<div class="block center"><div class="badge-xl">${p?'🎉':'💪'}</div><div class="result-title">${p?'Pass!':'Keep going'}</div><p class="result-sub">${correct}/${total} — needed ${passMark}</p><div class="stat-grid"><div class="stat"><div class="n">${correct}</div><div class="l">Correct</div></div><div class="stat"><div class="n">${total-correct}</div><div class="l">To review</div></div><div class="stat"><div class="n">${p?'PASS':'STUDY'}</div><div class="l">Verdict</div></div></div><button class="btn btn-primary" id="drillAgain" type="button">Retry</button><button class="btn btn-ghost" data-go="practice">More drills</button></div>`;const b=$('#drillAgain');if(b)b.addEventListener('click',()=>drill(cat));bindGo();return;}
    const q=qs[i];const card=ce('div');card.className='block';
    card.innerHTML=`<p class="kicker">Question ${i+1} of ${total}</p>${q.svg?`<div style="display:grid;place-items:center;margin-bottom:12px">${q.svg}</div>`:''}<h2 style="font-size:18px;letter-spacing:-0.3px;margin:0 0 14px">${q.q}</h2><div>${q.opts.map((o,idx)=>`<button class="opt" type="button" data-i="${idx}">${o}</button>`).join('')}</div><div class="feedback hidden" role="status" aria-live="polite"></div><button class="btn btn-primary next hidden" type="button">Next →</button>`;
    app.innerHTML=backbar(names[cat],`${correct}/${total}`);app.appendChild(card);
    const fb=card.querySelector('.feedback'),next=card.querySelector('.next');
    card.querySelectorAll('.opt').forEach(b=>{b.addEventListener('click',()=>{const ch=+b.getAttribute('data-i');card.querySelectorAll('.opt').forEach(x=>x.classList.add('disabled'));if(ch===q.ans){b.classList.add('correct');correct++;fb.className='feedback ok';}else{b.classList.add('wrong');card.querySelectorAll('.opt')[q.ans].classList.add('correct');}fb.textContent='💡 '+q.ex;next.classList.remove('hidden');});});
    next.addEventListener('click',()=>{i++;render();window.scrollTo(0,0);});
    bindGo();
  }
}

/* ---------- READINESS ENGINE ("Am I ready for Monday?") ---------- */
function mockAcc(){const a=K.state.acc;return a?.total? Math.round(a.correct/a.total*100):0;}
function sectionPass(sec){const p=K.state.secPass;return !!(p&&p[sec]);}
function readiness(){
  const s=K.state;
  const sessionsDone=[1,2,3].filter(n=>s.sessions[n]).length;
  const acc=mockAcc();
  const doneAll=sessionsDone===3;
  const secRules=sectionPass('rules'), secSigns=sectionPass('signs'), secCtrl=sectionPass('controls');
  const allSec=secRules&&secSigns&&secCtrl;
  let verdict,emoji,msg,score;
  if(doneAll && allSec && acc>=85){
    verdict='Ready for Monday'; emoji='🏆'; score=100;
    msg='You\'ve passed all three sections and the mock comfortably. Book that test — you\'ve got this.';
  } else if(doneAll && allSec){
    verdict='Almost there'; emoji='🚀'; score=85;
    msg='All sessions done and every section passed. A couple more rounds on weak spots and you\'re bulletproof.';
  } else if(sessionsDone===0 && !allSec){
    verdict='Just starting'; emoji='🌱'; score=10;
    msg='Do Session 1 to begin. You\'ll be amazed how quickly it clicks.';
  } else if(!doneAll){
    verdict='Getting there'; emoji='📚'; score=Math.round(sessionsDone/3*60);
    msg='Keep going through the three sessions, then pass each section of the mock.';
  } else if(doneAll && !allSec){
    const missing=[];
    if(!secRules)missing.push('Rules');
    if(!secSigns)missing.push('Signs');
    if(!secCtrl)missing.push('Controls');
    verdict='Pass your weak section'; emoji='🎯'; score=60;
    msg='Sessions are done. You still need to pass: '+missing.join(', ')+'. Retake that section of the mock.';
  } else {
    verdict='Close — pass the mock'; emoji='🎯'; score=45;
    msg='Sessions are done. Now lock it in: retake the mock until you pass all sections comfortably.';
  }
  return {verdict,emoji,msg,score,sessionsDone,acc,mockPass:!!s.mockPass,secRules,secSigns,secCtrl,allSec};
}

/* MOCK TEST + RESULT — 3 sections like the real K53 test */
let mockData=[];
let mockTimer=null, mockSeconds=0;
/* Build one section's questions (full pool, shuffled) */
function buildSection(sec){
  const q=[];
  if(sec==='rules'){
    K.RULES.forEach(r=>{const opts=K.shuffle([r.a,...K.ruleWrongs(r)]);q.push({q:r.q,opts,ans:opts.indexOf(r.a),ex:r.a});});
    K.MOCK_EXTRA.forEach(e=>{const so=K.shufOpts(e.opts,e.ans);q.push({q:e.q,opts:so.opts,ans:so.ans,ex:e.ex});});
  } else if(sec==='signs'){
    K.SIGNS.forEach(s=>{const wrong=K.shuffle(K.SIGNS.filter(x=>x.id!==s.id)).slice(0,3).map(x=>x.name);const opts=K.shuffle([s.name,...wrong]);q.push({q:'What does this sign mean?',svg:typeof s.svg==='function'?s.svg():s.svg,opts,ans:opts.indexOf(s.name),ex:s.mean});});
    K.MARKINGS.forEach(mk=>{const wrong=K.shuffle(K.MARKINGS.filter(x=>x!==mk).map(x=>x.d)).slice(0,3);const opts=K.shuffle([mk.d,...wrong]);q.push({q:mk.t+' — what does it mean?',opts,ans:opts.indexOf(mk.d),ex:mk.tip});});
  } else if(sec==='controls'){
    K.CONTROLS.forEach(c=>{const so=K.shufOpts(c.opts,c.ans);q.push({q:c.q,opts:so.opts,ans:so.ans,ex:c.ex});});
  }
  // Return exact official counts: Rules 28, Signs 28, Controls 8
  const target = sec==='rules' ? 28 : sec==='signs' ? 28 : 8;
  return K.shuffle(q).slice(0, target);
}

/* Start a full test (sequential sections) or a single section */
function startMock(onlySec){
  const sections = onlySec ? [onlySec] : SECTION_ORDER.slice();
  // Store results on K.state so finishMock/share handler can access
  K.state.mockResults = K.state.mockResults || {};
  let si=0;
  function startSection(sec){
    const meta=SECTION_META[sec];
    mockData=buildSection(sec);
    let i=0,correct=0,total=mockData.length;
    function timerHTML(){
      if(!mockSeconds)return '';
      const m=String(Math.floor(mockSeconds/60)).padStart(2,'0'),s=String(mockSeconds%60).padStart(2,'0');
      return `<div class="timer no-print ${mockSeconds<=60?'warn':''}"><span class="ttl">Time left</span><span class="time">${m}:${s}</span></div>`;
    }
    if(mockSeconds){
      mockTimer=setInterval(()=>{mockSeconds--;const t=document.querySelector('.timer .time');if(t)t.textContent=String(Math.floor(mockSeconds/60)).padStart(2,'0')+':'+String(mockSeconds%60).padStart(2,'0');if(mockSeconds<=60&&document.querySelector('.timer'))document.querySelector('.timer').classList.add('warn');if(mockSeconds<=0){clearInterval(mockTimer);mockTimer=null;finishSection(sec);}},1000);
    }
    function render(){
      if(i>=total){finishSection(sec);return;}
      const q=mockData[i];
      const card=ce('div');card.className='block';
      let head=q.svg?`<div style="display:grid;place-items:center;margin-bottom:12px">${q.svg}</div>`:'';
      card.innerHTML=`<p class="kicker">${meta.name} · Q${i+1} of ${total}</p>
        ${head}
        <h2 style="font-size:18px;letter-spacing:-0.3px;margin:0 0 14px">${q.q}</h2>
        <div>${q.opts.map((o,idx)=>`<button class="opt" type="button" data-i="${idx}">${o}</button>`).join('')}</div>
        <div class="feedback hidden" role="status" aria-live="polite"></div>
        <button class="btn btn-primary next hidden">Next →</button>`;
      app.innerHTML=backbar(meta.name,`${i+1}/${total}`)+(mockSeconds?timerHTML():'');
      app.appendChild(card);
      const fb=card.querySelector('.feedback'),next=card.querySelector('.next');
      card.querySelectorAll('.opt').forEach(b=>{
        b.addEventListener('click',()=>{
          const ch=+b.getAttribute('data-i');
          card.querySelectorAll('.opt').forEach(x=>x.classList.add('disabled'));
          if(ch===q.ans){b.classList.add('correct');correct++;fb.className='feedback ok';fb.textContent='✅ '+q.ex;}
          else{b.classList.add('wrong');card.querySelectorAll('.opt')[q.ans].classList.add('correct');fb.className='feedback no';fb.textContent='❌ '+q.ex;addReview(q.q,q.opts[q.ans]);}
          next.classList.remove('hidden');
        });
      });
      next.addEventListener('click',()=>{i++;render();window.scrollTo(0,0);});
      bindGo();
    }
    function finishSection(sec){
      const meta=SECTION_META[sec];
      const need=meta.need;
      const passed=correct>=need;
      K.state.mockResults[sec]={correct,total,pass:passed,need};
      K.state.secPass=K.state.secPass||{};
      K.state.secPass[sec]=passed;
      K.save();
      if(mockTimer){clearInterval(mockTimer);mockTimer=null;}
      const nextSec = onlySec ? null : SECTION_ORDER[SECTION_ORDER.indexOf(sec)+1];
      if(nextSec){
        // Section break screen
        app.innerHTML=backbar('Section Complete')+`<div class="block center">
          <div class="badge-xl">${passed?'✅':'📚'}</div>
          <div class="result-title">${meta.name} done</div>
          <p class="result-sub">${correct}/${total} — needed ${need} · ${passed?'PASSED ✓':'NOT PASSED'}</p>
          <div class="stat-grid">
            <div class="stat"><div class="n">${correct}</div><div class="l">Correct</div></div>
            <div class="stat"><div class="n">${total-correct}</div><div class="l">Wrong</div></div>
            <div class="stat"><div class="n">${passed?'PASS':'RETRY'}</div><div class="l">Verdict</div></div>
          </div>
          <button class="btn btn-primary" id="nextSecBtn" type="button">Next: ${SECTION_META[nextSec].name} →</button>
          <button class="btn btn-ghost" data-go="mock">Quit to menu</button>
        </div>`;
        $('#nextSecBtn').addEventListener('click',()=>startSection(nextSec));
        bindGo();
      } else {
        finishMock(onlySec);
      }
    }
    render();
  }
  startSection(sections[0]);
}

/* ---------- SHARE CARD (canvas-generated result image) ---------- */
function makeShareCard(secCorrect, secCount, totalCorrect, total, passed, lang){
  const cvs=document.createElement('canvas');
  cvs.width=800; cvs.height=600;
  const ctx=cvs.getContext('2d');
  // Background
  const grad=ctx.createLinearGradient(0,0,0,600);
  grad.addColorStop(0,'#0075de'); grad.addColorStop(1,'#005bab');
  ctx.fillStyle=grad; ctx.fillRect(0,0,800,600);
  // Accent stripe
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,800,6);
  // Title
  ctx.font='bold 48px Inter, Arial'; ctx.fillStyle='#fff'; ctx.textAlign='center';
  ctx.fillText(T('share.title') || 'My K53 Mock Result', 400, 80);
  // Overall
  ctx.font='bold 72px Inter, Arial';
  ctx.fillStyle=passed?'#7bf0a2':'#ffb08a';
  ctx.fillText(totalCorrect + ' / ' + total, 400, 180);
  ctx.font='24px Inter, Arial'; ctx.fillStyle='#e8f5ff';
  ctx.fillText('Overall', 400, 210);
  // Section bars
  const meta={'rules':'Rules','signs':'Signs','controls':'Controls'};
  const order=['rules','signs','controls'];
  const barW=500, barH=48, startX=150, startY=260, gap=60;
  order.forEach((s,idx)=>{
    const c=secCorrect[s]||0, t=secCount[s]||0, need=SECTION_META[s].need;
    const pct=t>0?c/t:0; const ok=pct*100>=SECTION_META[s].pct;
    ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.roundRect(startX,startY+idx*gap,barW,barH,12); ctx.fill();
    ctx.fillStyle=ok?'rgba(21,128,61,0.6)':'rgba(176,69,0,0.6)'; ctx.roundRect(startX,startY+idx*gap,barW*pct,barH,12); ctx.fill();
    ctx.font='bold 22px Inter, Arial'; ctx.fillStyle='#fff'; ctx.textAlign='left';
    ctx.fillText(meta[s], startX+20, startY+idx*gap+32);
    ctx.font='20px Inter, Arial'; ctx.fillStyle='#cfefff'; ctx.textAlign='right';
    ctx.fillText(c+'/'+t+' (need '+need+')', startX+barW-20, startY+idx*gap+32);
  });
  // Footer
  ctx.font='18px Inter, Arial'; ctx.fillStyle='#cfefff'; ctx.textAlign='center';
  const msg = passed ? (T('share.passed')||'I passed all sections!') : (T('share.failed')||'Working on my weak sections');
  ctx.fillText(msg, 400, 560);
  return cvs.toDataURL('image/png');
}

    const a=document.createElement('a'); a.href=dataUrl; a.download='k53-result.png'; a.click();

  if(overallPass)confetti();

}

    K.state.shareData={secCorrect,secCount,correct,total,passed:allPass};
    K.state.mockPass=allPass;
    K.state.secPass=K.state.secPass||{};
    SECTION_ORDER.forEach(s=>{K.state.secPass[s]=secCount[s]>0&&secCorrect[s]>=SECTION_META[s].need;});
    K.save();
    app.innerHTML=backbar('Sim Result')+`<div class="block center">
      <div class="badge-xl">${allPass?'🏆':'📚'}</div>
      <div class="result-title" role="status">${allPass?'YOU\'RE READY!':'Check your sections'}</div>
      <p class="result-sub">${correct}/${total} overall · you must pass each section</p>
      <table class="span-table" style="margin:var(--s4) 0"><thead><tr><th>Section</th><th>Your score</th><th>Result</th><th>Pass</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="footnote" style="margin-bottom:var(--s4)">Real test: pass EACH section — Rules ${SECTION_META.rules.need}/${SECTION_META.rules.n} · Signs ${SECTION_META.signs.need}/${SECTION_META.signs.n} · Controls ${SECTION_META.controls.need}/${SECTION_META.controls.n}.</p>
      ${allPass?'<p>Book that test — you\'re ready by Monday! 🚀</p>':'<p>Retake the section(s) you missed. You\'re close.</p>'}
      ${K.state.review.length?`<button class="btn btn-soft" id="revBtn">Review weak spots (${K.state.review.length})</button>`:''}
      <button class="btn btn-primary" id="shareBtn" type="button">📤 Share Result</button>
      <button class="btn btn-ghost" data-go="sim">Retry sim</button>
      <button class="btn btn-ghost" data-go="home">Home</button>
    </div>`;
      if($('#revBtn'))$('#revBtn').addEventListener('click',openReview);
  if($('#shareBtn'))$('#shareBtn').addEventListener('click',()=>{
    const d=K.state.shareData;
    if(!d)return;
    const dataUrl=makeShareCard(d.secCorrect, d.secCount, d.correct, d.total, d.passed, K.state.lang||'en');
    const a=document.createElement('a'); a.href=dataUrl; a.download='k53-sim-result.png'; a.click();
  });
  if(allPass)confetti();
  bindGo();
}
  render();
}

window.__views={renderHome,openSession1,openSession2,openSession3,openReview,openCheat,openMock,openSim,openFlash,openRow,openPractice,openMemory,openChecklist,quizFlow,confetti,bindGo,bindTTS,topbar,backbar,speakText,stopSpeech,toggleTopSpeech,speakBtn,ttsSettingsBar};
window.startApp=initTheme;window.startApp();
renderHome();


/* ---------- PWA INSTALL PROMPT ---------- */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault(); deferredPrompt=e;
  // Show after 30s or after 3 page views
  setTimeout(()=>{ if(deferredPrompt) showInstallPrompt(); }, 30000);
});
function showInstallPrompt(){
  if(!deferredPrompt) return;
  const banner=document.createElement('div');
  banner.className='block no-print';
  banner.style.borderColor='var(--accent)';
  banner.innerHTML=`<p class="kicker">📱 Install K53 Warrior</p>
    <h2>Add to home screen for offline access</h2>
    <p class="lead">Works like a native app — no internet needed once loaded.</p>
    <div class="btn-row">
      <button class="btn btn-primary" id="pwaInstall">Install</button>
      <button class="btn btn-ghost" id="pwaDismiss">Not now</button>
    </div>`;
  app.insertBefore(banner, app.firstChild);
  $('#pwaInstall').addEventListener('click',async()=>{
    banner.remove(); deferredPrompt.prompt(); const {outcome}=await deferredPrompt.userChoice; deferredPrompt=null;
  });
  $('#pwaDismiss').addEventListener('click',()=>{ banner.remove(); deferredPrompt=null; });
}
/* PWA: register service worker (guarded — only on secure contexts that support it) */
if ('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
/* Privacy-respecting usage beacon: reports a page-view to Vercel Analytics when
   it is enabled for the deployment (via the /_vercel/insights endpoint). If
   Vercel Analytics isn't enabled, this fires no request at all — zero cost,
   respects the offline-first design, and sends no personal data. */
(function(){
  try{
    if(navigator.onLine===false) return;
    var bp=document.createElement('script');
    bp.setAttribute('src','/_vercel/insights/script.js');
    bp.setAttribute('defer','');
    document.head.appendChild(bp);
  }catch(e){}
})();
</script>
