<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- K53 Stop Sign (R1) - RED octagon -->
<svg
   xmlns:dc="http://purl.org/dc/elements/1.1/"
   xmlns:cc="http://creativecommons.org/ns#"
   xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   width="200"
   height="200"
   viewBox="0 0 200 200"
   id="stop_sign">
  <defs
     id="defs1" />
  <sodipodi:namedview
     id="base"
     pagecolor="#ffffff"
     bordercolor="#666666"
     borderopacity="1.0"
     inkscape:pageopacity="0.0"
     inkscape:pageshadow="2"
     inkscape:zoom="0.70710678"
     inkscape:cx="100.0"
     inkscape:cy="100.0"
     inkscape:document-units="mm"
     showgrid="false">
  </sodipodi:namedview>
  <rect
     style="fill:#e00000;fill-opacity:1;stroke:#990000;stroke-width:4;stroke-opacity:1"
     id="rect2"
     width="200"
     height="200"
     x="0"
     y="0"/>
  
  <!-- Octagon shape -->
  <path
     d="M 20,60 L 60,20 L 140,20 L 180,60 L 180,140 L 140,180 L 60,180 L 20,140 z"
     style="fill:#ff0000;fill-opacity:1;stroke:#cc0000;stroke-width:8;stroke-linejoin:round"
     id="octagon"/>
  
  <!-- STOP text -->
  <text
     xml:space="preserve"
     style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-size:48px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:normal;text-anchor:middle;line-height:125%;fill:#ffffff;fill-opacity:1;stroke-width:0px"
     x="100"
     y="115"
     id="text2">
     <tspan
        id="tspan1"
        x="100"
        y="115"
        style="font-size:72px;font-weight:bold">STOP</tspan>
  </text>
</svg>